name: Certify published release
run-name: ${{ inputs.devfast && 'devfast source diagnostics' || format('Certify {0} (published binary hashes)', inputs.release_tag) }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published release to certify (required unless devfast); binaries are never replaced'
        type: string
        required: false
      devfast:
        description: 'Diagnose current branch source only; skip expensive tests and all certification/release changes'
        type: boolean
        default: false
      linux_runner:
        description: 'x86-64 Linux runner'
        type: choice
        options: [ubuntu-24.04, ubuntu-latest-m, ubuntu-latest-l, ubuntu-latest-h]
        default: ubuntu-24.04
      arm_runner:
        description: 'Linux ARM64 runner for compilation and qualification'
        type: choice
        options: [ubuntu-24.04-arm-l, ubuntu-24.04-arm-h, ubuntu-24.04-arm]
        default: ubuntu-24.04-arm-l
      windows_runner:
        description: 'Windows x64 runner'
        type: choice
        options: [windows-2022, windows-latest-l, windows-latest-h]
        default: windows-2022

  pull_request:
    paths:
      - '.github/workflows/certify.yml'
      - 'tools/certify-release.py'
      - 'tests/test_certify_release.py'

permissions:
  contents: read

concurrency:
  group: certify-release-${{ inputs.devfast && github.ref || inputs.release_tag }}-${{ inputs.devfast && 'devfast' || 'full' }}
  cancel-in-progress: false

jobs:
  devfast:
    if: github.event_name == 'workflow_dispatch' && inputs.devfast
    uses: ./.github/workflows/devfast.yml
    with:
      linux_runner: ${{ inputs.linux_runner || 'ubuntu-24.04' }}
      windows_runner: ${{ inputs.windows_runner || 'windows-2022' }}

  helpers:
    if: ${{ !inputs.devfast }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tests/test_certify_release.py

  prepare:
    if: github.event_name == 'workflow_dispatch' && !inputs.devfast
    needs: helpers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      baseline: ${{ steps.release.outputs.baseline }}
      inventory_sha256: ${{ steps.release.outputs.inventory_sha256 }}
      linux_matrix: ${{ steps.matrix.outputs.linux_matrix }}
      compatibility_matrix: ${{ steps.matrix.outputs.compatibility_matrix }}
      windows_matrix: ${{ steps.matrix.outputs.windows_matrix }}
      application_targets: ${{ steps.release.outputs.application_targets }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin published source revision and checksum inventory
        id: release
        run: |
          if [ -z "$RELEASE_TAG" ]; then echo '::error::release_tag is required for full certification.'; exit 1; fi
          python3 tools/certify-release.py prepare --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --directory release-info --github-output "$GITHUB_OUTPUT"
      - name: Select full test and copied-binary coverage for every published backend
        id: matrix
        run: python3 tools/release.py matrices --metadata release-info/release-metadata.json --github-output "$GITHUB_OUTPUT"

  linux-tests:
    name: Source and published Linux ${{ matrix.arch }} / ${{ matrix.backend }}
    if: ${{ !inputs.devfast }}
    needs: prepare
    runs-on: ${{ matrix.arch == 'aarch64' && (inputs.arm_runner || 'ubuntu-24.04-arm-l') || inputs.linux_runner || 'ubuntu-24.04' }}
    container: ${{ matrix.image }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.linux_matrix) }}
    env:
      DEBIAN_FRONTEND: noninteractive
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '2'
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      GUI_BACKEND: ${{ matrix.backend }}
      RELEASE_TARGET: ${{ matrix.target }}
      INVENTORY_SHA256: ${{ needs.prepare.outputs.inventory_sha256 }}
    steps:
      - name: Install download and archive inspection prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git gh python3 file binutils make xvfb xauth fonts-dejavu-core fontconfig-config libxtst6 libgl1 libopengl0 libgl1-mesa-dri
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}
      - name: Fetch exact SDK from base (no compiler rebuild)
        if: matrix.sdk
        id: sdk
        run: python3 tools/sdk-release.py fetch --binary-only --repo "$GITHUB_REPOSITORY" --directory downloaded-sdk --github-output "$GITHUB_OUTPUT"
      - name: Install verified SDK
        if: matrix.sdk
        env:
          SDK_FOUND: ${{ steps.sdk.outputs.found }}
        run: |
          if [ "$SDK_FOUND" != true ]; then echo 'Run Maintain base SDK for this recipe first.' >&2; exit 1; fi
          set -- downloaded-sdk/datapump-sdk-*-linux-x86_64.tar.gz
          test "$#" -eq 1
          python3 tools/build-sdk.py install --archive "$1" --destination "$GITHUB_WORKSPACE/build/sdk"
          python3 tools/build-sdk.py verify "$GITHUB_WORKSPACE/build/sdk" --max-host-glibc 2.36
      - name: Install native baseline dependencies and pinned scanner
        if: ${{ !matrix.sdk }}
        run: |
          apt-get install -y --no-install-recommends cmake ninja-build g++-11 libssl-dev libasound2-dev libx11-dev libxft-dev libxext-dev libxrender-dev libxcursor-dev libxfixes-dev libxinerama-dev
          sh tools/install-release-cmake.sh "$GITHUB_WORKSPACE/build/ci-cmake"
          echo "$GITHUB_WORKSPACE/build/ci-cmake/bin" >> "$GITHUB_PATH"
      - name: Install native Rev compiler and module-aware Ninja
        if: ${{ !matrix.sdk && matrix.backend == 'rev' }}
        run: |
          python3 tools/install-release-rev.py "$GITHUB_WORKSPACE/build/ci-rev-tools"
          echo "$GITHUB_WORKSPACE/build/ci-rev-tools/bin" >> "$GITHUB_PATH"
      - name: Run the complete source contract, GUI and packaging suites
        env:
          USE_SDK: ${{ matrix.sdk }}
          DATAPUMP_MAX_GLIBC: ${{ matrix.glibc }}
        run: |
          if [ "$USE_SDK" != true ]; then
            if [ "$GUI_BACKEND" = rev ]; then export CC=clang-19 CXX=clang++-19;
            else export CC=gcc-11 CXX=g++-11; fi
          fi
          # Certification checks out immutable released source. Older wrappers
          # lack --build-jobs, so keep their existing two-job behavior.
          separate_build_jobs=false
          if ./build.sh --help | grep -q -- '--build-jobs'; then
            separate_build_jobs=true
          else
            echo 'Released build wrapper has no --build-jobs; retaining two build/test jobs.'
          fi
          # Run adapter/package checks before the slower numerical calibration.
          for group in build gui packaging contract; do
            set -- --backend "$GUI_BACKEND" --build-dir build/certify --jobs 2
            if [ "$separate_build_jobs" = true ]; then set -- "$@" --build-jobs "$(nproc)"; fi
            if [ "$USE_SDK" = true ]; then set -- "$@" --sdk "$GITHUB_WORKSPACE/build/sdk"; fi
            ./build.sh test "$group" --stop-on-failure "$@" -- -DDATAPUMP_PORTABLE=ON -DDART_TESTING_TIMEOUT=3600
            if [ "$group" = gui ]; then
              xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' ./build.sh test native --stop-on-failure "$@" -- -DDATAPUMP_PORTABLE=ON -DDART_TESTING_TIMEOUT=3600 -DGUI_SMOKE_TIMEOUT=600
            fi
          done
      - name: Verify shared audio routing and both audio platform adapters
        env:
          USE_SDK: ${{ matrix.sdk }}
        run: |
          audio_cmake=cmake
          audio_ctest=ctest
          if [ "$USE_SDK" = true ]; then
            audio_cmake="$GITHUB_WORKSPACE/build/sdk/bin/cmake"
            audio_ctest="$GITHUB_WORKSPACE/build/sdk/bin/ctest"
          fi
          "$audio_cmake" --build build/certify --target test_alsa_audio test_windows_audio test_audio_rates test_resampler --parallel "$(nproc)"
          "$audio_ctest" --test-dir build/certify --output-on-failure -R '^(alsa_audio_contract|windows_audio_contract|audio_rates|resampler)$' --parallel 1 --stop-on-failure --no-tests=error
      - name: Download and verify the exact published archive
        id: binary
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python3 tools/certify-release.py download --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --target "$RELEASE_TARGET" --directory published --inventory-sha256 "$INVENTORY_SHA256" --github-output "$GITHUB_OUTPUT"
      - name: Test published GUI, CLI, relocation and ELF dependencies
        env:
          PACKAGE_ROOT: ${{ steps.binary.outputs.package_root }}
          USE_SDK: ${{ matrix.sdk }}
          GLIBC_CEILING: ${{ matrix.glibc }}
        run: |
          scanner=cmake
          if [ "$USE_SDK" = true ]; then scanner="$GITHUB_WORKSPACE/build/sdk/bin/cmake"; fi
          xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' "$scanner" -DPACKAGE_ROOT="$PACKAGE_ROOT" -DBUILD_DIR="$PWD/build/certify" -DGUI_SMOKE=ON -DGUI_SMOKE_TIMEOUT=600 -P tools/verify-native-package.cmake
          "$scanner" -DPACKAGE_ROOT="$PACKAGE_ROOT" -DMAX_GLIBC="$GLIBC_CEILING" -P tools/verify-linux-abi.cmake

  windows-tests:
    name: Source and published Windows x64 / ${{ matrix.backend }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.windows_matrix) }}
    if: ${{ !inputs.devfast }}
    needs: prepare
    runs-on: ${{ inputs.windows_runner || 'windows-2022' }}
    timeout-minutes: 120
    env:
      VCPKG_DISABLE_METRICS: '1'
      UseMultiToolTask: 'true'
      EnforceProcessCountAcrossBuilds: 'true'
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      GUI_BACKEND: ${{ matrix.backend }}
      RELEASE_TARGET: ${{ matrix.target }}
      INVENTORY_SHA256: ${{ needs.prepare.outputs.inventory_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}
      - name: Load dependency tooling when certifying an older release
        if: ${{ hashFiles('tools/windows-base.py') == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .certification-tools
      - name: Reuse verified static dependencies from base
        shell: pwsh
        run: |
          $script = if (Test-Path tools/use-windows-base.ps1) { './tools/use-windows-base.ps1' } else { './.certification-tools/tools/use-windows-base.ps1' }
          & $script -Repository "$env:GITHUB_REPOSITORY" -Destination "$PWD/build/windows-base"
      - name: Build with the Windows SDK and static MSVC runtime
        shell: pwsh
        run: |
          cmake -S . -B build/release-windows -G 'Visual Studio 17 2022' -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:DATAPUMP_WINDOWS_TOOLCHAIN" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DDATAPUMP_GUI_BACKEND="$env:GUI_BACKEND" -DDATAPUMP_PORTABLE=ON -DDART_TESTING_TIMEOUT=3600 -DDATAPUMP_TEST_NATIVE_GUI=ON -DGUI_SMOKE_TIMEOUT=600 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }
          if ($env:GUI_BACKEND -eq 'rev') {
            # Diagnose the real OpenGL context and native adapter before the
            # full regression build; its compiled Rev dependencies are reused.
            cmake --build build/release-windows --config Release --target test_rev_coordinates --parallel $env:NUMBER_OF_PROCESSORS
            if ($LASTEXITCODE -ne 0) { throw 'Rev native context probe build failed' }
            ctest --test-dir build/release-windows -C Release -R '^gui_coordinates_1x$' --output-on-failure --parallel 1 --stop-on-failure --no-tests=error
            if ($LASTEXITCODE -ne 0) { throw 'Rev native context or adapter check failed' }
          }
          cmake --build build/release-windows --config Release --target datapump-apps datapump-tests-contract datapump-tests-gui datapump-tests-packaging --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          # The live/audio fixtures have their own workers and wall-clock
          # deadlines. Keep independent suites from competing on hosted CPUs.
          foreach ($group in @('gui', 'contract', 'packaging')) {
            ctest --test-dir build/release-windows -C Release --output-on-failure -L "^$group`$" -LE '^calibration$' --parallel 1 --stop-on-failure
            if ($LASTEXITCODE -ne 0) { throw "$group tests failed" }
          }
          # Preserve the complete selection; run the long calibration after
          # the other regressions so a platform failure is reported promptly.
          ctest --test-dir build/release-windows -C Release --output-on-failure -L '^(contract|gui|packaging)$' -L '^calibration$' --parallel 1 --stop-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw 'Calibration tests failed' }
      - name: Download and verify the exact published Windows archive
        id: binary
        shell: pwsh
        run: |
          python tools/certify-release.py download --repo "$env:GITHUB_REPOSITORY" --tag "$env:RELEASE_TAG" --target "$env:RELEASE_TARGET" --directory published --inventory-sha256 "$env:INVENTORY_SHA256" --github-output "$env:GITHUB_OUTPUT"
          if ($LASTEXITCODE -ne 0) { throw 'Published archive verification failed' }
      - name: Test the published GUI, CLI and relocation
        shell: pwsh
        env:
          PACKAGE_ROOT: ${{ steps.binary.outputs.package_root }}
        run: |
          cmake -DPACKAGE_ROOT="$env:PACKAGE_ROOT" -DBUILD_DIR="$PWD/build/release-windows" -DGUI_SMOKE=ON -DGUI_SMOKE_TIMEOUT=600 -P tools/verify-native-package.cmake
          if ($LASTEXITCODE -ne 0) { throw 'Published application checks failed' }

  compatibility:
    name: Published ${{ matrix.target }} on ${{ matrix.image }}
    if: ${{ !inputs.devfast }}
    needs: prepare
    runs-on: ${{ matrix.arch == 'aarch64' && (inputs.arm_runner || 'ubuntu-24.04-arm-l') || inputs.linux_runner || 'ubuntu-24.04' }}
    container: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.compatibility_matrix) }}
    env:
      DEBIAN_FRONTEND: noninteractive
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '2'
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      GUI_BACKEND: ${{ matrix.backend }}
      RELEASE_TARGET: ${{ matrix.target }}
      INVENTORY_SHA256: ${{ needs.prepare.outputs.inventory_sha256 }}
    steps:
      - name: Install inspection and display tools (no compiler)
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl git gh python3 cmake binutils xvfb xauth fontconfig-config fonts-dejavu-core libxtst6 libgl1 libopengl0 libgl1-mesa-dri
          else
            pacman -Syu --noconfirm --needed ca-certificates curl git github-cli python cmake binutils xorg-server-xvfb xorg-xauth ttf-dejavu fontconfig libxtst libglvnd mesa
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}
      - name: Download and verify this target's published archive
        id: binary
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python3 tools/certify-release.py download --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --target "$RELEASE_TARGET" --directory published --inventory-sha256 "$INVENTORY_SHA256" --github-output "$GITHUB_OUTPUT"
      - name: Use the pinned dependency scanner
        run: |
          sh tools/install-release-cmake.sh "$GITHUB_WORKSPACE/build/ci-cmake"
          echo "$GITHUB_WORKSPACE/build/ci-cmake/bin" >> "$GITHUB_PATH"
      - name: Run the identical published application on this distribution
        env:
          PACKAGE_ROOT: ${{ steps.binary.outputs.package_root }}
          GLIBC_CEILING: ${{ matrix.glibc }}
        run: |
          xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' cmake -DPACKAGE_ROOT="$PACKAGE_ROOT" -DGUI_SMOKE=ON -DGUI_SMOKE_TIMEOUT=600 -P tools/verify-native-package.cmake
          cmake -DPACKAGE_ROOT="$PACKAGE_ROOT" -DMAX_GLIBC="$GLIBC_CEILING" -P tools/verify-linux-abi.cmake

  record:
    needs: [prepare, linux-tests, windows-tests, compatibility]
    if: ${{ always() && !inputs.devfast && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      INVENTORY_SHA256: ${{ needs.prepare.outputs.inventory_sha256 }}
      JOB_RESULTS: ${{ toJSON(needs) }}
      TESTED_TARGETS: ${{ needs.prepare.outputs.application_targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record complete job outcomes without replacing binaries
        run: |
          python3 - <<'PYRESULTS'
          import json, os
          needs = json.loads(os.environ['JOB_RESULTS'])
          results = {'source_sha': os.environ['SOURCE_SHA'], 'inventory_sha256': os.environ['INVENTORY_SHA256'],
                     'tested_targets': json.loads(os.environ['TESTED_TARGETS']),
                     'jobs': {name: needs[name]['result'] for name in ('linux-tests', 'windows-tests', 'compatibility')}}
          with open('certification-results.json', 'w') as out:
              json.dump(results, out)
          PYRESULTS
          python3 tools/certify-release.py record --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --run-id "$GITHUB_RUN_ID" --results-json certification-results.json
