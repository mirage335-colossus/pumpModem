name: Isolated three-carrier performance regression

on:
  workflow_call:
    inputs:
      candidate_ref:
        description: 'Immutable application source commit to build and measure'
        type: string
        required: true
      performance_budget_seconds:
        description: 'Fast CI guard wall budget; roughly five-minute target, 600-second default, maximum 1800'
        type: number
        required: false
        default: 600
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: 'Optional immutable application source commit; defaults to this workflow revision'
        type: string
        required: false
        default: ''
      performance_budget_seconds:
        description: 'Fast CI guard wall budget; roughly five-minute target, 600-second default, maximum 1800, no automatic qualification'
        type: number
        required: false
        default: 600
      qualify:
        description: 'Explicit comprehensive qualification with source/hardware-bound artifacts (default branch only)'
        type: boolean
        required: false
        default: false
      qualification_budget_seconds:
        description: 'Budget per explicit stage: bootstrap and complete each receive this duration, maximum 3600 seconds each'
        type: number
        required: false
        default: 1800

permissions:
  contents: read

jobs:
  performance:
    name: CPU receiver performance regression
    runs-on: ubuntu-24.04
    # Fast reject-only guard normally; comprehensive qualification is explicit.
    # Install/build overhead is outside the measured performance budget.
    timeout-minutes: ${{ inputs.qualify && 145 || 50 }}
    env:
      BASELINE_REF: 242ea15fa032ee117b9113a7f3cd07cc6e9f0254
      # Last pre-cascade implementation with modem APIs compatible with the
      # current aligned physical-input driver; qualification keeps BASELINE_REF.
      GUARD_BASELINE_REF: b1d1b30f8bcdc09526d60b66bd260b3c7031b0e1
      CANDIDATE_REF: ${{ inputs.candidate_ref || github.sha }}
      PERFORMANCE_BUDGET_SECONDS: ${{ inputs.performance_budget_seconds }}
      QUALIFICATION_REQUESTED: ${{ inputs.qualify == true }}
      QUALIFICATION_BUDGET_SECONDS: ${{ inputs.qualification_budget_seconds }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # Exercise AVX2 fallback dispatch even when a hosted CPU offers AVX512.
      # This does not emulate older caches/clocks or constrain every vendor path.
      ATEN_CPU_CAPABILITY: avx2
      OPENBLAS_CORETYPE: HASWELL
      MKL_ENABLE_INSTRUCTIONS: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      NPY_DISABLE_CPU_FEATURES: AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR
    steps:
      # The current checkout is the harness. Keep it separate from the exact
      # application revision under test so historical release sources cannot
      # silently be replaced by the harness revision.
      - name: Checkout performance harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout immutable candidate application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_REF }}
          path: candidate

      - name: Checkout immutable receiver reference source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.BASELINE_REF }}
          path: reference

      - name: Checkout immutable fast guard reference source
        if: ${{ inputs.qualify != true }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.GUARD_BASELINE_REF }}
          path: guard-reference

      - name: Validate candidate and benchmark baseline identities
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REF" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] || {
            echo '::error::candidate_ref must be a complete immutable Git object ID.'
            exit 2
          }
          actual=$(git -C candidate rev-parse HEAD)
          baseline=$(git -C reference rev-parse HEAD)
          [[ "$baseline" == "$BASELINE_REF" ]] || {
            echo '::error::Reference checkout does not match the declared receiver baseline.'
            exit 2
          }
          [[ "$actual" == "$CANDIDATE_REF" ]] || {
            echo '::error::Candidate checkout does not match the requested source ID.'
            exit 2
          }
          python3 - <<'PYBUDGET'
          import math, os
          budget = float(os.environ['PERFORMANCE_BUDGET_SECONDS'])
          if not math.isfinite(budget) or not 0 < budget <= 1800:
              raise SystemExit('performance_budget_seconds must be finite and in (0, 1800]')
          if os.environ['QUALIFICATION_REQUESTED'] == 'true':
              if os.environ['GITHUB_EVENT_NAME'] != 'workflow_dispatch' or os.environ['GITHUB_REF'] != 'refs/heads/' + os.environ['DEFAULT_BRANCH']:
                  raise SystemExit('Explicit qualification and cache production require workflow_dispatch on the trusted default branch')
              qualification_budget = float(os.environ['QUALIFICATION_BUDGET_SECONDS'])
              if not math.isfinite(qualification_budget) or not 0 < qualification_budget <= 3600:
                  raise SystemExit('qualification_budget_seconds must be finite and in (0, 3600]')
          PYBUDGET
          git cat-file -e "$BASELINE_REF^{commit}"
          git cat-file -e "$GUARD_BASELINE_REF^{commit}"
          if [[ "$QUALIFICATION_REQUESTED" != true ]]; then
            [[ "$(git -C guard-reference rev-parse HEAD)" == "$GUARD_BASELINE_REF" ]] || {
              echo '::error::Fast guard reference checkout does not match its immutable baseline.'
              exit 2
            }
          fi
          printf 'candidate_sha=%s\nbaseline_sha=%s\n' "$actual" "$BASELINE_REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Install narrow native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build g++ libssl-dev

      - name: Set up pinned Python and pip cache
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/triad-performance.py

      - name: Install pinned CPU numerical stack
        run: |
          python -m pip install --disable-pip-version-check 'numpy==2.3.5' 'scipy==1.16.3' 'coverage==7.17.1' 'threadpoolctl==3.6.0'
          python -m pip install --disable-pip-version-check 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu

      - name: Verify requested portable numerical dispatch
        run: |
          mkdir -p build/triad-performance
          python - <<'PYVERIFY'
          import contextlib, io, json, os, platform
          from pathlib import Path
          flags = Path('/proc/cpuinfo').read_text().lower().split()
          if platform.machine().lower() not in ('x86_64', 'amd64') or not {'avx2', 'fma'}.issubset(flags):
              raise RuntimeError('AVX2 fallback profile requires a physically capable x86 AVX2/FMA CPU')
          import numpy as np
          import scipy.linalg
          import torch
          if torch.backends.cpu.get_cpu_capability() != 'AVX2':
              raise RuntimeError('ATen did not report the requested AVX2 dispatch')
          selected = np.lib.introspect.opt_func_info()
          def current_values(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if key == 'current':
                          yield str(item)
                      else:
                          yield from current_values(item)
          choices = list(current_values(selected))
          if not choices or any('AVX512' in choice.upper() for choice in choices):
              raise RuntimeError('NumPy selected-dispatch verification failed')
          runtime = io.StringIO()
          with contextlib.redirect_stdout(runtime):
              np.show_runtime()
          data = {'requested_profile': 'AVX2 fallback', 'aten_reported': 'AVX2',
                  'numpy_selected': sorted(set(choices)), 'numpy_runtime': runtime.getvalue(),
                  'requested_controls': {k: os.environ[k] for k in ('ATEN_CPU_CAPABILITY', 'OPENBLAS_CORETYPE', 'MKL_ENABLE_INSTRUCTIONS', 'ONEDNN_MAX_CPU_ISA', 'NPY_DISABLE_CPU_FEATURES')},
                  'scope': 'ATen and NumPy selection checked; vendor ceilings requested, not a complete ISA quarantine or old-CPU performance emulation'}
          Path('build/triad-performance/dispatch.json').write_text(json.dumps(data, indent=2) + '\n')
          PYVERIFY

      # Partition expensive qualification anchors by the actually measured
      # machine/runtime profile, without putting hostnames or other runner IDs
      # into a cache key. Their contents are still revalidated by the adapters.
      - name: Fingerprint runner profile for anchor cache
        id: runner-profile
        run: |
          python - <<'PYCACHE'
          import hashlib, json, os, platform, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          from triad_perf_hardware import discover_hardware
          host = discover_hardware('cpu', threads=2)
          profile = {'os': platform.platform(), 'machine': platform.machine(),
                     'cpu': host['cpu'], 'affinity': sorted(os.sched_getaffinity(0)),
                     'numpy': __import__('numpy').__version__,
                     'scipy': __import__('scipy').__version__,
                     'torch': __import__('torch').__version__,
                     'dispatch': 'avx2-fallback'}
          token = hashlib.sha256(json.dumps(profile, sort_keys=True).encode()).hexdigest()[:20]
          # Separate persistent hardware-regression baseline identity from
          # anchor identity: exclude kernel, libraries and source revisions so
          # those changes can be screened against the first measured profile.
          cpu = host['cpu']
          hardware = {'device': host['requested_device'], 'threads': host['requested_threads'],
                      'cpu_model': cpu.get('model name', cpu.get('model')),
                      'cpu_vendor': cpu.get('vendor_id'), 'cpu_flags': cpu.get('flags'),
                      'affinity': cpu.get('affinity_cpu_count'),
                      'affinity_cpus': cpu.get('affinity_cpus'),
                      'affinity_topology': cpu.get('affinity_topology'),
                      'quota': cpu.get('quota_cores'),
                      'dispatch_environment': host.get('dispatch_environment')}
          hardware_token = hashlib.sha256(json.dumps(hardware, sort_keys=True).encode()).hexdigest()[:24]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'key={token}\n')
              output.write(f'hardware_key={hardware_token}\n')
          PYCACHE

      # This immutable first-observation reference is intentionally separate
      # from source/runtime-specific receiver anchors.
      - name: Restore first-observed hardware performance profile
        id: hardware-baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache v6.1.0
        with:
          path: build/triad-performance/hardware-reference.json
          key: triad-hardware-reference-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-profile.outputs.hardware_key }}

      - name: Configure baseline CLI and isolated receiver fixture
        if: ${{ inputs.qualify == true }}
        working-directory: reference
        run: ./build.sh configure --cli --build-dir build/dev-cli -- -DBUILD_TESTING=ON -DDATAPUMP_COMPILER_CACHE=OFF

      - name: Build baseline native simulation and receiver
        if: ${{ inputs.qualify == true }}
        run: cmake --build reference/build/dev-cli --config Release --target triad_long --parallel 2

      - name: Prepare identical planner test driver against immutable reference production
        if: ${{ inputs.qualify == true }}
        run: |
          python - <<'PYPLANNER'
          import hashlib, json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          from triad_perf_planner import prepare_reference_driver
          receipt = prepare_reference_driver(Path('candidate'), Path('reference'))
          receipt['reference_native_sha256'] = hashlib.sha256(Path('reference/build/dev-cli/triad_long').read_bytes()).hexdigest()
          Path('build/triad-performance/planner-reference-build.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PYPLANNER

      - name: Build only the new baseline planner test target
        if: ${{ inputs.qualify == true }}
        working-directory: reference
        run: |
          ./build.sh configure --cli --build-dir build/dev-cli -- -DBUILD_TESTING=ON -DDATAPUMP_COMPILER_CACHE=OFF
          cmake --build build/dev-cli --config Release --target triad_planner_perf --parallel 2

      - name: Verify reference receiver binary was preserved
        if: ${{ inputs.qualify == true }}
        run: |
          python - <<'PYPLANNERBINARY'
          import hashlib, json
          from pathlib import Path
          receipt = json.loads(Path('build/triad-performance/planner-reference-build.json').read_text())
          actual = hashlib.sha256(Path('reference/build/dev-cli/triad_long').read_bytes()).hexdigest()
          if actual != receipt['reference_native_sha256'] or not receipt['production_unchanged']:
              raise RuntimeError('Planner test preparation changed reference receiver inputs or binary')
          PYPLANNERBINARY

      - name: Configure candidate CLI and isolated receiver fixture
        working-directory: candidate
        run: ./build.sh configure --cli --build-dir build/dev-cli -- -DBUILD_TESTING=ON -DDATAPUMP_COMPILER_CACHE=OFF

      - name: Build the focused native transmitter and four functional checks
        working-directory: candidate
        run: cmake --build build/dev-cli --config Release --target triad_long triad_planner_perf test_triad_statistics test_triad_v3_source test_triad_v3_channel test_triad_v3_receiver --parallel 2

      - name: Prepare isolated fast guard reference drivers
        if: ${{ inputs.qualify != true }}
        run: |
          python - <<'PYGUARDREF'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          reference = Path('guard-reference').resolve(strict=True)
          candidate = Path('candidate').resolve(strict=True)
          if subprocess.run(['git', '-C', str(reference), 'status', '--porcelain', '--untracked-files=all'],
                            check=True, capture_output=True, text=True).stdout:
              raise RuntimeError('fast guard reference must start as a clean immutable checkout')
          header = reference / 'tools/triad_fixture_key.hpp'
          if header.exists():
              raise RuntimeError('historical reference unexpectedly provides a fixture header')
          # This generated fixture exists only in the private historical checkout.
          # It is never compiled into a candidate or an operational executable.
          header.write_text('''#pragma once
          #include "datapump/crypto.hpp"
          #include <cstdint>
          #include <span>
          #include <string_view>
          namespace datapump::triad::fixture {
          inline constexpr std::string_view key_mode="legacy-reference";
          inline Crypto key(std::span<const std::uint8_t> seed) { return Crypto(seed); }
          }
          ''')
          driver = reference / 'tools/triad-long.cpp'
          driver.write_bytes((candidate / 'tools/triad-long.cpp').read_bytes())
          sys.path.insert(0, str(Path('tools').resolve()))
          from triad_perf_planner import prepare_reference_driver
          planner = prepare_reference_driver(candidate, reference)
          if not planner['production_unchanged']:
              raise RuntimeError('planner reference preparation changed production sources')
          changed = subprocess.run(['git', '-C', str(reference), 'diff', '--name-only'],
                                   check=True, capture_output=True, text=True).stdout.splitlines()
          allowed = {'CMakeLists.txt', 'tools/triad-long.cpp', 'tools/triad-planner-perf.cpp'}
          if set(changed) - allowed:
              raise RuntimeError('unexpected changed fast guard production source: ' + ', '.join(changed))
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          receipt = {'schema': 'triad-fast-guard-reference-overlay-v1',
                     'reference_commit': subprocess.run(['git', '-C', str(reference), 'rev-parse', 'HEAD'],
                         check=True, capture_output=True, text=True).stdout.strip(),
                     'driver_sha256': digest(driver), 'fixture_header_sha256': digest(header),
                     'tracked_diff_sha256': hashlib.sha256(subprocess.run(
                         ['git', '-C', str(reference), 'diff', '--binary'], check=True, capture_output=True).stdout).hexdigest(),
                     'fixture_key_mode': 'legacy-reference', 'modified_tracked_files': changed,
                     'planner_overlay': planner}
          Path('build/triad-performance/guard-reference-overlay.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PYGUARDREF

      - name: Build isolated fast guard reference drivers
        if: ${{ inputs.qualify != true }}
        working-directory: guard-reference
        run: |
          ./build.sh configure --cli --build-dir build/dev-cli -- -DBUILD_TESTING=ON -DDATAPUMP_COMPILER_CACHE=OFF
          cmake --build build/dev-cli --config Release --target triad_long triad_planner_perf --parallel 2
          ./build/dev-cli/triad_long --mode fixture-key-mode | python -c 'import json,sys; assert json.load(sys.stdin) == {"schema":"triad-fixture-key-mode-v1","fixture_key_mode":"legacy-reference"}'
          python - <<'PYGUARDBUILD'
          import hashlib, json, subprocess
          from pathlib import Path
          path = Path('../build/triad-performance/guard-reference-overlay.json')
          receipt = json.loads(path.read_text())
          digest = lambda data: hashlib.sha256(data).hexdigest()
          if (subprocess.run(['git', 'rev-parse', 'HEAD'], check=True, capture_output=True, text=True).stdout.strip() != receipt['reference_commit'] or
              digest(subprocess.run(['git', 'diff', '--binary'], check=True, capture_output=True).stdout) != receipt['tracked_diff_sha256'] or
              digest(Path('tools/triad_fixture_key.hpp').read_bytes()) != receipt['fixture_header_sha256']):
              raise RuntimeError('fast guard reference source changed during build')
          receipt['binary_sha256'] = {name: hashlib.sha256(Path('build/dev-cli', name).read_bytes()).hexdigest()
                                      for name in ('triad_long', 'triad_planner_perf')}
          path.write_text(json.dumps(receipt, indent=2) + '\n')
          PYGUARDBUILD

      # Fixtures are independent of report logs and are already validated
      # against source, binary, configuration and per-file SHA-256 receipts.
      - name: Compute immutable performance binary identities
        id: binary-key
        run: |
          candidate_sha=$(sha256sum candidate/build/dev-cli/triad_long | cut -d ' ' -f1)
          if [[ "$QUALIFICATION_REQUESTED" == true ]]; then
            reference_sha=$(sha256sum reference/build/dev-cli/triad_long | cut -d ' ' -f1)
          else
            reference_sha=$(sha256sum guard-reference/build/dev-cli/triad_long | cut -d ' ' -f1)
          fi
          printf 'candidate=%s\nreference=%s\n' "$candidate_sha" "$reference_sha" >> "$GITHUB_OUTPUT"

      - name: Restore receiver performance anchors
        if: ${{ inputs.qualify == true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache v6.1.0
        with:
          path: build/triad-performance/anchors
          key: triad-anchors-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-profile.outputs.key }}-${{ steps.binary-key.outputs.candidate }}-${{ steps.binary-key.outputs.reference }}-${{ hashFiles('tools/triad-performance-cases.json', 'tools/triad-performance-native-cases.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            triad-anchors-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-profile.outputs.key }}-${{ steps.binary-key.outputs.candidate }}-${{ steps.binary-key.outputs.reference }}-${{ hashFiles('tools/triad-performance-cases.json', 'tools/triad-performance-native-cases.json') }}-

      - name: Restore deterministic sampled waveform fixtures
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache v6.1.0
        with:
          path: build/triad-performance/triad-performance-fixtures/triad-physical-fixtures
          key: triad-fixtures-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.binary-key.outputs.candidate }}-${{ hashFiles('tools/triad_perf_cases.py', 'tools/triad-performance-*.json', 'candidate/tools/triad-long.cpp', 'candidate/src/triad_modem_v3.cpp', 'candidate/src/triad_simulation_stream.cpp', 'candidate/src/triad_gaussian_fading.hpp', 'candidate/src/channel_perturbation.hpp', 'candidate/src/channel_spread.hpp', 'candidate/include/datapump/triad_modem_v3.hpp', 'candidate/include/datapump/pattern_pulse.hpp', 'candidate/include/datapump/clock_sync.hpp') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            triad-fixtures-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.binary-key.outputs.candidate }}-${{ hashFiles('tools/triad_perf_cases.py', 'tools/triad-performance-*.json', 'candidate/tools/triad-long.cpp', 'candidate/src/triad_modem_v3.cpp', 'candidate/src/triad_simulation_stream.cpp', 'candidate/src/triad_gaussian_fading.hpp', 'candidate/src/channel_perturbation.hpp', 'candidate/src/channel_spread.hpp', 'candidate/include/datapump/triad_modem_v3.hpp', 'candidate/include/datapump/pattern_pulse.hpp', 'candidate/include/datapump/clock_sync.hpp') }}-

      # These are independently qualified artifacts. A cache miss is reported
      # as advisory limited coverage by the guard; normal CI never collects it.
      # Explicit qualification still requires applicable instrumented evidence.
      - name: Restore source-bound instrumented coverage receipts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache v6.1.0
        with:
          path: build/triad-performance/coverage
          key: triad-coverage-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-profile.outputs.key }}-${{ steps.binary-key.outputs.candidate }}-${{ hashFiles('candidate/src/triad*', 'candidate/src/channel_*', 'candidate/include/datapump/triad*', 'candidate/tools/triad*', 'candidate/tests/test_triad*', 'candidate/CMakeLists.txt', 'candidate/cmake/**') }}
          # Coverage describes the candidate, independently of a reference
          # binary. Source/dependency/counter-quality checks remain mandatory.
          restore-keys: |
            triad-coverage-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-profile.outputs.key }}-${{ steps.binary-key.outputs.candidate }}-

      # Restore only independently produced proofs for explicit qualification.
      # The qualification validators
      # recheck sources, hardware, work and raw evidence; no cache hit is a pass.
      - name: Restore qualified lifecycle campaign anchors
        if: ${{ inputs.qualify == true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache v6.1.0
        with:
          path: build/triad-performance/lifecycle-anchors
          key: triad-lifecycle-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-profile.outputs.key }}-${{ steps.binary-key.outputs.candidate }}-${{ steps.binary-key.outputs.reference }}-${{ hashFiles('tools/triad_perf_lifecycle.py', 'tools/triad-performance-lifecycle.json') }}
          restore-keys: |
            triad-lifecycle-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-profile.outputs.key }}-${{ steps.binary-key.outputs.candidate }}-${{ steps.binary-key.outputs.reference }}-

      # One discovery includes the new test_triad_perf_guard*.py policy/adapter
      # checks as well as historical harness contracts; do not run them twice.
      - name: Check native performance trace and harness contracts
        env:
          TRIAD_LONG_BINARY: ${{ github.workspace }}/candidate/build/dev-cli/triad_long
          TRIAD_SOURCE_ROOT: ${{ github.workspace }}/candidate
        run: python -m unittest discover -s tests -p 'test_triad_perf*.py'

      - name: Explicit one-time qualification producer
        id: qualification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualify && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          python tools/triad_perf_bootstrap.py \
            --candidate-root candidate --reference-root reference \
            --binary candidate/build/dev-cli/triad_long --reference-binary reference/build/dev-cli/triad_long \
            --output build/triad-performance/bootstrap \
            --anchor-directory build/triad-performance/anchors \
            --lifecycle-anchor-directory build/triad-performance/lifecycle-anchors \
            --coverage-directory build/triad-performance/coverage \
            --fixture-cache build/triad-performance/triad-performance-fixtures \
            --threads 2 --native-threads 1 --baseline-ref "$BASELINE_REF" \
            --native-direct-case native-vlf-low-cn0 \
            --budget-seconds "$QUALIFICATION_BUDGET_SECONDS"

      - name: Validate exact bootstrap publication index
        id: bootstrap-cache-ready
        if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.qualify && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          python - <<'PYBOOTSTRAP'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          from triad_perf_bootstrap import prepare_publication_cache
          report = Path('build/triad-performance/bootstrap/summary.json')
          paths = {'anchors': [], 'coverage': [], 'lifecycle': []}
          if report.is_file():
              paths = prepare_publication_cache(json.loads(report.read_text()), Path('candidate').resolve(), Path('reference').resolve(),
                  {'candidate': Path('candidate/build/dev-cli/triad_long'), 'reference': Path('reference/build/dev-cli/triad_long')},
                  {'anchors': Path('build/triad-performance/anchors'), 'coverage': Path('build/triad-performance/coverage'),
                   'lifecycle': Path('build/triad-performance/lifecycle-anchors')},
                  Path('build/triad-performance/bootstrap/unpublished-cache-inputs'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, files in paths.items():
                  output.write(f'{name}_ready={str(bool(files)).lower()}\n')
          print({name: len(files) for name, files in paths.items()})
          PYBOOTSTRAP

      - name: Save independently validated native and FFT anchors
        if: ${{ always() && !cancelled() && steps.bootstrap-cache-ready.outputs.anchors_ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.qualify && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache v6.1.0
        with:
          path: build/triad-performance/anchors
          key: triad-anchors-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-profile.outputs.key }}-${{ steps.binary-key.outputs.candidate }}-${{ steps.binary-key.outputs.reference }}-${{ hashFiles('tools/triad-performance-cases.json', 'tools/triad-performance-native-cases.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save independently validated coverage receipts
        if: ${{ always() && !cancelled() && steps.bootstrap-cache-ready.outputs.coverage_ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.qualify && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache v6.1.0
        with:
          path: build/triad-performance/coverage
          key: triad-coverage-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-profile.outputs.key }}-${{ steps.binary-key.outputs.candidate }}-${{ hashFiles('candidate/src/triad*', 'candidate/src/channel_*', 'candidate/include/datapump/triad*', 'candidate/tools/triad*', 'candidate/tests/test_triad*', 'candidate/CMakeLists.txt', 'candidate/cmake/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save independently validated lifecycle anchors
        if: ${{ always() && !cancelled() && steps.bootstrap-cache-ready.outputs.lifecycle_ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.qualify && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache v6.1.0
        with:
          path: build/triad-performance/lifecycle-anchors
          key: triad-lifecycle-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-profile.outputs.key }}-${{ steps.binary-key.outputs.candidate }}-${{ steps.binary-key.outputs.reference }}-${{ hashFiles('tools/triad_perf_lifecycle.py', 'tools/triad-performance-lifecycle.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Guard isolated receiver performance against confirmed large slowdowns
        id: performance-guard
        if: ${{ inputs.qualify != true }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/triad-performance
          hardware_args=()
          if [[ -f build/triad-performance/hardware-reference.json ]]; then
            hardware_args=(--hardware-baseline build/triad-performance/hardware-reference.json)
          fi
          coverage_args=()
          if [[ -f build/triad-performance/coverage/native.json ]]; then
            coverage_args+=(--native-coverage build/triad-performance/coverage/native.json)
          fi
          if [[ -f build/triad-performance/coverage/python.json ]]; then
            coverage_args+=(--python-coverage build/triad-performance/coverage/python.json)
          fi
          # Five-second hardware arithmetic probes are advisory. The guard uses
          # fresh confirmation pairs and one workflow-wide false-block budget.
          # Missing anchors, model uncertainty and exhausted timing budgets do
          # not fail CI; correctness, integrity and confirmed regressions do.
          python tools/triad_perf_guard.py \
            --profile ci --suite-alpha 0.01 --workflow-job-count 1 \
            --candidate-root candidate --reference-root guard-reference \
            --binary candidate/build/dev-cli/triad_long \
            --reference-binary guard-reference/build/dev-cli/triad_long \
            --fixture-cache build/triad-performance/triad-performance-fixtures \
            --device cpu --precision fp32 --threads 2 --native-threads 1 \
            --budget-seconds "$PERFORMANCE_BUDGET_SECONDS" \
            --functional-defaults \
            --planner-binary candidate/build/dev-cli/triad_planner_perf \
            --planner-reference-binary guard-reference/build/dev-cli/triad_planner_perf \
            --planner-bounds-workspace docs/validation-data/triad-v3/2026-11-03-performance-complete/controls/actual-delay-001/sampled-stats \
            --hardware-seconds 5 \
            --legacy-reference-fixture --physical-bit-alignment \
            "${coverage_args[@]}" "${hardware_args[@]}" \
            --output build/triad-performance/guard 2>&1 | tee build/triad-performance/guard.log

      - name: Compare complete isolated workload scope with the fixed baseline
        id: combined-routine
        if: ${{ inputs.qualify == true && !cancelled() && (success() || steps.qualification.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/triad-performance
          hardware_args=()
          if [[ -f build/triad-performance/hardware-reference.json ]]; then
            hardware_args=(--hardware-baseline build/triad-performance/hardware-reference.json)
          fi
          coverage_args=()
          if [[ -f build/triad-performance/coverage/native.json ]]; then
            coverage_args+=(--native-coverage build/triad-performance/coverage/native.json)
          fi
          if [[ -f build/triad-performance/coverage/python.json ]]; then
            coverage_args+=(--python-coverage build/triad-performance/coverage/python.json)
          fi
          # The explicit qualification child retains five-second hardware arithmetic probes.
          # Cold/inventory/model gaps remain blocking here; this is not certification.
          # Resource regimes use full direct work; Gaussian bounds reuse the
          # tracked compact fixture. Neither route requires forecast qualification.
          python tools/triad_perf_complete.py \
            --output build/triad-performance/complete \
            --binary candidate/build/dev-cli/triad_long \
            --reference-binary reference/build/dev-cli/triad_long \
            --reference-root reference \
            --device cpu \
            --budget-seconds "$QUALIFICATION_BUDGET_SECONDS" \
            --stopping-rule decision \
            --regression-profile normal \
            --threads 2 \
            --functional-defaults \
            --planner-binary candidate/build/dev-cli/triad_planner_perf \
            --planner-reference-binary reference/build/dev-cli/triad_planner_perf \
            --planner-bounds-workspace docs/validation-data/triad-v3/2026-11-03-performance-complete/controls/actual-delay-001/sampled-stats \
            --resource-direct \
            --lifecycle-mixed-method direct \
            --lifecycle-direct-cycles auto \
            --family-route paired \
            --family-mode direct \
            --native-direct-case native-vlf-low-cn0 \
            --anchor-directory build/triad-performance/anchors \
            --fixture-cache build/triad-performance/triad-performance-fixtures \
            "${coverage_args[@]}" \
            "${hardware_args[@]}" \
            --baseline-ref "$BASELINE_REF" \
            --candidate-root candidate 2>&1 | tee build/triad-performance/stdout.log

      # Capture only the first complete hardware measurement for this allocation.
      # A broader incomplete receiver result does not invalidate that independent
      # profile, nor does caching it promote the receiver result to a pass.
      # The immutable cache key prevents later runs ratcheting a
      # slower or otherwise changed profile into the reference.
      - name: Capture first complete hardware reference
        id: captured-hardware-reference
        if: ${{ always() && !cancelled() && steps.hardware-baseline.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        env:
          CANDIDATE_REF: ${{ env.CANDIDATE_REF }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ready=false\n')
          report = Path('build/triad-performance/complete/native-fft.json' if os.environ['QUALIFICATION_REQUESTED'] == 'true'
                        else 'build/triad-performance/guard/summary.json')
          if not report.is_file():
              print('No independently complete hardware profile was produced; nothing to cache.')
              raise SystemExit(0)
          profile = json.loads(report.read_text()).get('hardware_profile')
          if not isinstance(profile, dict) or profile.get('status') != 'complete' or profile.get('device') != 'cpu':
              print('Hardware profile is absent, partial or wrong-backend; nothing to cache.')
              raise SystemExit(0)
          payload = {'schema': 'triad-first-hardware-reference-v1',
                     'hardware_profile': profile,
                     'provenance': {'report_sha256': hashlib.sha256(report.read_bytes()).hexdigest(),
                                    'candidate_source': os.environ['CANDIDATE_REF'],
                                    'receiver_qualification_claim': False,
                                    'run_id': os.environ['GITHUB_RUN_ID'],
                                    'run_attempt': os.environ['GITHUB_RUN_ATTEMPT']}}
          destination = Path('build/triad-performance/hardware-reference.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          with destination.open('x') as stream:
              json.dump(payload, stream, indent=2)
              stream.write('\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ready=true\n')
          PY

      - name: Save immutable first-observed hardware reference
        if: ${{ always() && !cancelled() && steps.captured-hardware-reference.outputs.ready == 'true' && steps.hardware-baseline.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache v6.1.0
        with:
          path: build/triad-performance/hardware-reference.json
          key: triad-hardware-reference-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-profile.outputs.hardware_key }}

      - name: Validate fixture identities before ancillary caching
        id: fixture-cache-ready
        if: ${{ always() && !cancelled() }}
        run: |
          python - <<'PYFIXTURES'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          import triad_perf_cases as fixtures
          root = Path('build/triad-performance/triad-performance-fixtures/triad-physical-fixtures')
          binary = Path('candidate/build/dev-cli/triad_long').resolve()
          candidate = Path('candidate').resolve()
          configured = fixtures._config()
          cases = {row['id']: row for row in fixtures.scenarios('ci')}
          entries = list(root.glob('*/*')) if root.is_dir() else []
          valid = bool(entries) and binary.is_file()
          for directory in entries:
              try:
                  case = cases[directory.parent.name]
                  _, selected = fixtures._plan(case, configured)
                  source_hashes = fixtures._source_hashes(candidate, selected['path'])
                  argv = fixtures._native_argv(binary, case, selected, Path('{WORKSPACE}'), 'export-sampled', configured['limits'])
                  identity = {'schema': configured['schema'], 'binary_sha256': fixtures._sha256(binary),
                              'native_args': fixtures._normalize_args(argv), 'source_hashes': source_hashes,
                              'source_case': selected['row']['case'], 'fixture_id': case['id']}
                  key = fixtures._json_hash(identity)
                  valid = valid and directory.name == key and fixtures._valid_cache(directory, key, source_hashes) is not None
              except (OSError, ValueError, KeyError, TypeError):
                  valid = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'ready={str(bool(valid)).lower()}\n')
          print(f'Fixture ancillary cache eligible: {bool(valid)}; receiver qualification is separate.')
          PYFIXTURES

      # Only identity-validated ancillary inputs from trusted runs are cached.
      # Pull requests can restore but never promote; inputs do not certify receivers.
      - name: Save validated sampled fixtures from a trusted default-branch run
        if: ${{ always() && !cancelled() && steps.fixture-cache-ready.outputs.ready == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache v6.1.0
        with:
          path: build/triad-performance/triad-performance-fixtures/triad-physical-fixtures
          key: triad-fixtures-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.binary-key.outputs.candidate }}-${{ hashFiles('tools/triad_perf_cases.py', 'tools/triad-performance-*.json', 'candidate/tools/triad-long.cpp', 'candidate/src/triad_modem_v3.cpp', 'candidate/src/triad_simulation_stream.cpp', 'candidate/src/triad_gaussian_fading.hpp', 'candidate/src/channel_perturbation.hpp', 'candidate/src/channel_spread.hpp', 'candidate/include/datapump/triad_modem_v3.hpp', 'candidate/include/datapump/pattern_pulse.hpp', 'candidate/include/datapump/clock_sync.hpp') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summarize the result
        if: always()
        env:
          REPORT: ${{ inputs.qualify && 'build/triad-performance/complete/summary.json' || 'build/triad-performance/guard/summary.json' }}
        run: |
          python - <<'PYSUMMARY'
          import json, os
          from pathlib import Path
          report = Path(os.environ['REPORT'])
          qualification_requested = os.environ['QUALIFICATION_REQUESTED'] == 'true'
          lines = [f"Candidate source: {os.environ['CANDIDATE_REF']}"]
          if not report.is_file():
              lines.append('Performance report was not produced; setup/timeout remains unresolved.')
          else:
              value = json.loads(report.read_text())
              if qualification_requested:
                  lines += [f"Explicit qualification status: {value.get('status')}; complete scope qualification: {value.get('complete_scope_qualification')}",
                            f"Requested regression profile: {value.get('regression_profile')}; core decision profile active: {value.get('core_decision_profile_active')}",
                            f"Warm target decisions complete: {value.get('warm_target_decisions_complete')}; elapsed: {value.get('wall_seconds')} s; budget: {value.get('budget_seconds')} s",
                            f"Maintained workload scope complete: {value.get('maintained_workload_scope_complete')}; release review requirements: {value.get('release_review_requirements', [])}"]
                  lines += [f"{name}: {row.get('status')}" for name, row in value.get('outcomes', {}).items()]
                  lines += [f"Extension {name}: {row.get('status')}; validated gap IDs: {row.get('gap_ids', [])}" for name, row in value.get('extension_outcomes', {}).items()]
                  lines += [f"Blocking scope: {reason}" for reason in value.get('scope_blockers', [])]
              else:
                  lines += [f"Fast CI guard status: {value.get('status')}; performance decision: {value.get('performance_status')}; elapsed: {value.get('wall_seconds')} s",
                            f"Limited assurance: {value.get('limited_assurance')}; qualification: {value.get('qualification_status')}",
                            f"Nominal workflow performance false-block budget: {value.get('suite_alpha')}; jobs: {value.get('workflow_job_count')}; frozen hypotheses: {value.get('hypothesis_count')}"]
                  decision = value.get('guard_decision') or {}
                  lines.append(f"Blocking estimand: {decision.get('blocking_estimand', 'median paired full-runtime ratio')}; test: {decision.get('blocking_test', 'not evaluated')}")
                  lines += [f"Statistical assumption: {assumption}" for assumption in decision.get('statistical_assumptions', [])]
                  lines += [f"Confirmed regression: {reason}" for reason in value.get('confirmed_regressions', [])]
                  lines += [f"Functional/integrity failure: {reason}" for reason in value.get('functional_failures', [])]
                  lines += [f"Assurance limitation (advisory): {reason}" for reason in value.get('assurance_limitations', [])]
              lines += [f"Failure: {reason}" for reason in value.get('errors', [])]
          bootstrap = Path('build/triad-performance/bootstrap/summary.json')
          if bootstrap.is_file():
              qualification = json.loads(bootstrap.read_text())
              lines.append(f"Qualification artifacts: {qualification.get('status')}; independently cacheable: {qualification.get('cache_ready')}; separate qualification elapsed: {qualification.get('wall_seconds')} s")
              lines += [f"Qualification issue: {reason}" for reason in qualification.get('errors', [])]
          if qualification_requested:
              lines.append('Unresolved combined scope blocks explicit qualification. Cached hardware/fixtures do not certify receiver performance.')
          else:
              lines.append('A green CI guard means no confirmed regression; it does not establish complete qualification, absence of a slowdown, or release certification. The nominal statistical budget concerns the median paired full-runtime ratio and is conditional on independent confirmation pairs and the declared test assumptions; it is not a universal machine guarantee and does not cover deterministic test or infrastructure failures.')
          print('\n'.join(lines))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n\n' + '\n\n'.join(lines) + '\n')
          PYSUMMARY

      - name: Retain report and process log, including failed attempts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Triad-performance-${{ env.CANDIDATE_REF }}-attempt-${{ github.run_attempt }}
          path: |
            build/triad-performance/**/*.json
            build/triad-performance/**/*.jsonl
            build/triad-performance/**/*.gz
            build/triad-performance/**/*.log
            build/triad-performance/*.json
            build/triad-performance/*.log
          if-no-files-found: warn
          retention-days: 14
