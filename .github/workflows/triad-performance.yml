name: Isolated three-carrier performance regression

on:
  workflow_call:
    inputs:
      candidate_ref:
        description: 'Immutable application source commit to build and measure'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: 'Optional immutable application source commit; defaults to this workflow revision'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  performance:
    name: CPU receiver performance regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASELINE_REF: 242ea15fa032ee117b9113a7f3cd07cc6e9f0254
      CANDIDATE_REF: ${{ inputs.candidate_ref || github.sha }}
      # Exercise AVX2 fallback dispatch even when a hosted CPU offers AVX512.
      # This does not emulate older caches/clocks or constrain every vendor path.
      ATEN_CPU_CAPABILITY: avx2
      OPENBLAS_CORETYPE: HASWELL
      MKL_ENABLE_INSTRUCTIONS: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2
      NPY_DISABLE_CPU_FEATURES: AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR
    steps:
      # The current checkout is the harness. Keep it separate from the exact
      # application revision under test so historical release sources cannot
      # silently be replaced by the harness revision.
      - name: Checkout performance harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout immutable candidate application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_REF }}
          path: candidate

      - name: Validate candidate and benchmark baseline identities
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REF" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] || {
            echo '::error::candidate_ref must be a complete immutable Git object ID.'
            exit 2
          }
          actual=$(git -C candidate rev-parse HEAD)
          [[ "$actual" == "$CANDIDATE_REF" ]] || {
            echo '::error::Candidate checkout does not match the requested source ID.'
            exit 2
          }
          git cat-file -e "$BASELINE_REF^{commit}"
          printf 'candidate_sha=%s\nbaseline_sha=%s\n' "$actual" "$BASELINE_REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Install narrow native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build g++ libssl-dev

      - name: Set up pinned Python and pip cache
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/triad-performance.py

      - name: Install pinned CPU numerical stack
        run: |
          python -m pip install --disable-pip-version-check 'numpy==2.3.5' 'scipy==1.16.3'
          python -m pip install --disable-pip-version-check 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu

      - name: Verify requested portable numerical dispatch
        run: |
          mkdir -p build/triad-performance
          python - <<'PYVERIFY'
          import contextlib, io, json, os, platform
          from pathlib import Path
          flags = Path('/proc/cpuinfo').read_text().lower().split()
          if platform.machine().lower() not in ('x86_64', 'amd64') or not {'avx2', 'fma'}.issubset(flags):
              raise RuntimeError('AVX2 fallback profile requires a physically capable x86 AVX2/FMA CPU')
          import numpy as np
          import scipy.linalg
          import torch
          if torch.backends.cpu.get_cpu_capability() != 'AVX2':
              raise RuntimeError('ATen did not report the requested AVX2 dispatch')
          selected = np.lib.introspect.opt_func_info()
          def current_values(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if key == 'current':
                          yield str(item)
                      else:
                          yield from current_values(item)
          choices = list(current_values(selected))
          if not choices or any('AVX512' in choice.upper() for choice in choices):
              raise RuntimeError('NumPy selected-dispatch verification failed')
          runtime = io.StringIO()
          with contextlib.redirect_stdout(runtime):
              np.show_runtime()
          data = {'requested_profile': 'AVX2 fallback', 'aten_reported': 'AVX2',
                  'numpy_selected': sorted(set(choices)), 'numpy_runtime': runtime.getvalue(),
                  'requested_controls': {k: os.environ[k] for k in ('ATEN_CPU_CAPABILITY', 'OPENBLAS_CORETYPE', 'MKL_ENABLE_INSTRUCTIONS', 'ONEDNN_MAX_CPU_ISA', 'NPY_DISABLE_CPU_FEATURES')},
                  'scope': 'ATen and NumPy selection checked; vendor ceilings requested, not a complete ISA quarantine or old-CPU performance emulation'}
          Path('build/triad-performance/dispatch.json').write_text(json.dumps(data, indent=2) + '\n')
          PYVERIFY

      - name: Check performance harness contracts
        run: python -m unittest discover -s tests -p 'test_triad_perf*.py'

      - name: Configure candidate CLI and isolated receiver fixture
        working-directory: candidate
        run: ./build.sh configure --cli --build-dir build/dev-cli -- -DBUILD_TESTING=ON -DDATAPUMP_COMPILER_CACHE=OFF

      - name: Build the focused native transmitter fixture
        working-directory: candidate
        run: cmake --build build/dev-cli --config Release --target triad_long --parallel 2

      - name: Compare the fixed baseline and candidate receiver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/triad-performance
          python tools/triad-performance.py \
            --output build/triad-performance/report.json \
            --binary candidate/build/dev-cli/triad_long \
            --device cpu \
            --budget-seconds 600 \
            --stress-seconds 5 \
            --threads 2 \
            --baseline-ref "$BASELINE_REF" \
            --candidate-root candidate 2>&1 | tee build/triad-performance/stdout.log

      - name: Summarize the result
        if: always()
        env:
          REPORT: build/triad-performance/report.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ['REPORT'])
          if not report.is_file():
              print('Performance report was not produced; see the job log for the setup or timeout failure.')
          else:
              value = json.loads(report.read_text())
              backends = value.get('backends', [])
              lines = [f"Triad performance status: {value.get('status')}; complete required coverage: {value.get('complete_required_coverage')}",
                       f"Candidate source: {os.environ['CANDIDATE_REF']}",
                       f"Backends: {len(backends)}; cases: {sum(len(b.get('cases', [])) for b in backends)}; failures: {len(value.get('failures', []))}; warnings: {len(value.get('warnings', []))}"]
              if value.get('status') == 'warning':
                  lines.append('Warning is a non-blocking inconclusive result, not a supported performance pass.')
              print('\n'.join(lines))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('\n\n' + '\n\n'.join(lines) + '\n')
          PY

      - name: Retain report and process log, including failed attempts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Triad-performance-${{ env.CANDIDATE_REF }}-attempt-${{ github.run_attempt }}
          path: |
            build/triad-performance/*.json
            build/triad-performance/*.log
            build/triad-performance/*.work/*.log
          if-no-files-found: warn
          retention-days: 14
