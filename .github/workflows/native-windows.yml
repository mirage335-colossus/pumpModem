name: Native Windows validation shard

on:
  workflow_dispatch:
    inputs:
      windows_runner:
        description: 'Windows x64 runner for this validation shard'
        type: choice
        options: [windows-2022, windows-latest-l, windows-latest-h]
        default: windows-2022
      scope:
        description: 'Run the selected unchanged native scope'
        type: choice
        options: [core, fast, live, calibration, frontends, web, package]
        default: live
      calibration_section:
        description: 'Calibration section; used only by the calibration scope'
        type: choice
        options: [all, shaped, matrix, 'null', default-window]
        default: all
  workflow_call:
    inputs:
      windows_runner:
        type: string
        default: windows-2022
      scope:
        description: 'core, fast, live, calibration, frontends, web, or package'
        type: string
        required: true
      calibration_section:
        type: string
        default: all

permissions:
  contents: read

jobs:
  native:
    name: Windows Release / ${{ inputs.scope }} / ${{ inputs.calibration_section }}
    runs-on: ${{ inputs.windows_runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      DATAPUMP_CI_SMOKE_WARNINGS_DIR: ${{ github.workspace }}/build/ci-smoke-results
      DATAPUMP_CI_SMOKE_RUNNER: ${{ github.workspace }}/tools/run-gui-smoke.py
      DATAPUMP_SMOKE_TARGET: windows-x86_64-fltk
      DATAPUMP_SMOKE_SCOPE: published/native-package
      DATAPUMP_SMOKE_SOURCE_SHA: ${{ github.sha }}
      DATAPUMP_SMOKE_INVENTORY_SHA256: ''
      VCPKG_DISABLE_METRICS: "1"
      UseMultiToolTask: 'true'
      EnforceProcessCountAcrossBuilds: 'true'
      CI_SCOPE: ${{ inputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reuse verified static dependencies from base
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/use-windows-base.ps1 -Repository "$env:GITHUB_REPOSITORY" -Destination "$PWD/build/windows-base"
      - name: Configure native application and selected test scope
        run: >-
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:DATAPUMP_WINDOWS_TOOLCHAIN"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DDATAPUMP_PORTABLE=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DBUILD_TESTING=${{ inputs.scope == 'package' && 'OFF' || 'ON' }}
          -DDATAPUMP_BUILD_TUI=${{ (inputs.scope == 'package' || inputs.scope == 'frontends') && 'ON' || 'OFF' }}
          -DDATAPUMP_BUILD_FB=${{ (inputs.scope == 'package' || inputs.scope == 'frontends') && 'ON' || 'OFF' }}
          -DDATAPUMP_CALIBRATION_SECTION=${{ inputs.calibration_section }}
          -DDART_TESTING_TIMEOUT=3600
          -DCMAKE_DISABLE_FIND_PACKAGE_Python3=${{ inputs.scope == 'frontends' && 'FALSE' || 'TRUE' }}
      - name: Build this shard's prerequisites
        run: |
          switch ($env:CI_SCOPE) {
            'calibration' { $targets = @('test_differential_receiver_probability') }
            'package' { $targets = @('datapump-apps') }
            'frontends' { $targets = @('datapump-tests-frontends') }
            'web' { $targets = @('datapump-tests-web') }
            'core' { $targets = @('datapump-apps', 'datapump-tests-ci-core') }
            'fast' { $targets = @('datapump-tests-fast') }
            'live' { $targets = @('datapump-tests-ci-live') }
            default { throw "Unknown native scope: $env:CI_SCOPE" }
          }
          $env:CL_MPCount = python -B tools/build_capacity.py
          if ($LASTEXITCODE -ne 0 -or $env:CL_MPCount -notmatch '^[1-9][0-9]*$') { $env:CL_MPCount = '1' }
          cmake --build build --config Release --target @targets --parallel $env:CL_MPCount
          if ($LASTEXITCODE -ne 0) { throw "Native shard build failed" }
      - name: Run the selected native tests
        if: inputs.scope != 'package'
        # Separate runners supply parallelism; preserve per-runner live budgets.
        run: python tools/run-ci-tests.py --build-dir build --scope "$env:CI_SCOPE" --jobs 1 --config Release --report build/ci-test-report.json
      - name: Verify Windows GUI and relocation with an empty PATH
        if: inputs.scope == 'package'
        env:
          DATAPUMP_SMOKE_SCOPE: published/relocation
        run: |
          cmake -DBUILD_DIR="$PWD/build" -DCONFIG=Release -DGUI_SMOKE=ON -DGUI_SMOKE_TIMEOUT=600 -P tests/package_native.cmake 2>&1 | Tee-Object -FilePath build/package-relocation.log
          if ($LASTEXITCODE -ne 0) { throw "Native relocation failed" }
      - name: Create and verify both native archives
        if: inputs.scope == 'package'
        env:
          DATAPUMP_SMOKE_SCOPE: published/native-archives
        run: |
          $env:CL_MPCount = python -B tools/build_capacity.py
          if ($LASTEXITCODE -ne 0 -or $env:CL_MPCount -notmatch '^[1-9][0-9]*$') { $env:CL_MPCount = '1' }
          cmake --build build --config Release --target package --parallel $env:CL_MPCount
          if ($LASTEXITCODE -ne 0) { throw "Native packaging failed" }
          cmake -DARCHIVE_DIR="$PWD/build/releases" -DBUILD_DIR="$PWD/build" -DGUI_SMOKE=ON -DGUI_SMOKE_TIMEOUT=600 -DREQUIRE_MANUALS=ON -DREQUIRE_FRONTENDS=ON -P tools/verify-native-archives.cmake 2>&1 | Tee-Object -FilePath build/package-archives.log
          if ($LASTEXITCODE -ne 0) { throw "Archive verification failed" }
          'Portable Release relocation, corruption and both archive GUI checks completed; any incomplete smoke coverage is listed in the retained reports. Independent regression/calibration jobs still determine the overall workflow result.' >> $env:GITHUB_STEP_SUMMARY
      - name: Upload Windows offline bundles
        if: inputs.scope == 'package'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DataPump-Windows-x86_64
          path: |
            build/releases/*.tar.gz
            build/releases/*.zip
            build/releases/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Retain shard reports and failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CI-Windows-Release-${{ inputs.scope }}-${{ inputs.calibration_section }}-attempt-${{ github.run_attempt }}
          path: |
            build/ci-test-report.*
            build/Testing/Temporary/
            build/package-*.log
            ${{ github.workspace }}/build/ci-smoke-results/
          if-no-files-found: warn
          retention-days: 7
