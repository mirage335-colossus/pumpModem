name: Native Windows validation shard
'on':
  workflow_dispatch:
    inputs:
      windows_runner:
        description: Windows runner for native scopes; the clock functional probe uses windows-2022
        type: choice
        options:
        - windows-2022
        - windows-latest-l
        - windows-latest-h
        default: windows-2022
      scope:
        description: Select the retained application test or package scope
        type: choice
        options:
        - core
        - fast
        - legacy
        - frontends
        - web
        - gui
        - package
        default: core
  workflow_call:
    inputs:
      windows_runner:
        type: string
        default: windows-2022
      scope:
        description: Select the retained application test or package scope
        type: string
        required: true
permissions:
  contents: read
jobs:
  native:
    name: Windows Release / ${{ inputs.scope }}
    runs-on: ${{ inputs.windows_runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      DATAPUMP_CI_SMOKE_WARNINGS_DIR: ${{ github.workspace }}/build/ci-smoke-results
      DATAPUMP_CI_SMOKE_RUNNER: ${{ github.workspace }}/tools/run-gui-smoke.py
      DATAPUMP_SMOKE_TARGET: windows-x86_64-fltk
      DATAPUMP_SMOKE_SCOPE: published/native-package
      DATAPUMP_SMOKE_SOURCE_SHA: ${{ github.sha }}
      DATAPUMP_SMOKE_INVENTORY_SHA256: ''
      VCPKG_DISABLE_METRICS: '1'
      UseMultiToolTask: 'true'
      EnforceProcessCountAcrossBuilds: 'true'
      CI_SCOPE: ${{ inputs.scope }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Reuse verified static dependencies from base
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./tools/use-windows-base.ps1 -Repository "$env:GITHUB_REPOSITORY" -Destination "$PWD/build/windows-base"
    - name: Configure the retained native scope
      run: |
        cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:DATAPUMP_WINDOWS_TOOLCHAIN" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DDATAPUMP_PORTABLE=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DBUILD_TESTING=${{ inputs.scope == 'package' && 'OFF' || 'ON' }} -DDATAPUMP_BUILD_TUI=${{ (inputs.scope == 'package' || inputs.scope == 'frontends') && 'ON' || 'OFF' }} -DDATAPUMP_BUILD_FB=${{ (inputs.scope == 'package' || inputs.scope == 'frontends') && 'ON' || 'OFF' }} -DDATAPUMP_BUILD_WEB_WORKER=${{ inputs.scope == 'web' && 'ON' || 'OFF' }}
    - name: Build scope prerequisites
      run: |
        switch ($env:CI_SCOPE) {
          'package' { $target = 'datapump-apps' }
          'core' { $target = 'datapump-tests-regular' }
          { $_ -in 'fast','legacy','frontends','web','gui' } { $target = "datapump-tests-$env:CI_SCOPE" }
          default { throw "Unknown native scope: $env:CI_SCOPE" }
        }
        $env:CL_MPCount = python -B tools/build_capacity.py
        if ($LASTEXITCODE -ne 0 -or $env:CL_MPCount -notmatch '^[1-9][0-9]*$') { $env:CL_MPCount = '1' }
        cmake --build build --config Release --target $target --parallel $env:CL_MPCount
        if ($LASTEXITCODE -ne 0) { throw 'Native scope build failed' }
    - name: Run selected native tests
      if: inputs.scope != 'package'
      run: |
        python tools/run-ci-tests.py --build-dir build --scope "$env:CI_SCOPE" --jobs 1 --config Release --timeout 1800 --report build/ci-test-report.json
    - name: Verify Windows GUI and relocation with an empty PATH
      if: inputs.scope == 'package'
      env:
        DATAPUMP_SMOKE_SCOPE: published/relocation
      run: |
        cmake -DBUILD_DIR="$PWD/build" -DCONFIG=Release -DGUI_SMOKE=ON -DGUI_SMOKE_TIMEOUT=600 -P tests/package_native.cmake 2>&1 | Tee-Object -FilePath build/package-relocation.log
        if ($LASTEXITCODE -ne 0) { throw "Native relocation failed" }
    - name: Create and verify both native archives
      if: inputs.scope == 'package'
      env:
        DATAPUMP_SMOKE_SCOPE: published/native-archives
      run: |
        $env:CL_MPCount = python -B tools/build_capacity.py
        if ($LASTEXITCODE -ne 0 -or $env:CL_MPCount -notmatch '^[1-9][0-9]*$') { $env:CL_MPCount = '1' }
        cmake --build build --config Release --target package --parallel $env:CL_MPCount
        if ($LASTEXITCODE -ne 0) { throw "Native packaging failed" }
        cmake -DARCHIVE_DIR="$PWD/build/releases" -DBUILD_DIR="$PWD/build" -DGUI_SMOKE=ON -DGUI_SMOKE_TIMEOUT=600 -DREQUIRE_MANUALS=ON -DREQUIRE_FRONTENDS=ON -P tools/verify-native-archives.cmake 2>&1 | Tee-Object -FilePath build/package-archives.log
        if ($LASTEXITCODE -ne 0) { throw "Archive verification failed" }
        'Portable Release relocation, corruption and both archive GUI checks completed; any incomplete smoke coverage is listed in the retained reports. Independent regression jobs still determine the overall workflow result.' >> $env:GITHUB_STEP_SUMMARY
    - name: Upload Windows offline bundles
      if: inputs.scope == 'package'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: DataPump-Windows-x86_64
        path: |
          build/releases/*.tar.gz
          build/releases/*.zip
          build/releases/SHA256SUMS.txt
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
    - name: Retain test and package logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: CI-Windows-Release-${{ inputs.scope }}-attempt-${{ github.run_attempt }}
        path: |
          build/ci-test-report.*
          build/Testing/Temporary/
          build/package-*.log
          build/ci-smoke-results/
        if-no-files-found: warn
        retention-days: 7
