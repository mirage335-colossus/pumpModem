name: Copied Help fixed-input receiver replay

on:
  workflow_call:
    inputs:
      diagnostic:
        type: string
        default: replay

permissions:
  contents: read
  actions: read

jobs:
  copied-help-replay:
    name: ${{ inputs.diagnostic == 'session' && 'Ubuntu 24.04 published SDK / source37 fresh Session raw32' || 'Ubuntu 24.04 published SDK / source37 four sealed receiver prefixes' }}
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '1'
      BASE_SOURCE_SHA: '37f4315c553b9fc3807f2f173d9a0fae3f239ebc'
      EXPECTED_SDK_MANIFEST_SHA256: 4fdcc4b8d57e0a67eeb2ce7fac70667b75f40f01215105de95b771c77c5303c3
      DIAGNOSTIC_KIND: ${{ inputs.diagnostic }}
    steps:
      - name: Bootstrap current APT helper before installing Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .ci-bootstrap
          sparse-checkout: tools/ci-apt.sh
          sparse-checkout-cone-mode: false
      - name: Install Ubuntu container prerequisites
        run: |
          cp .ci-bootstrap/tools/ci-apt.sh "$RUNNER_TEMP/ci-apt.sh"
          sh "$RUNNER_TEMP/ci-apt.sh" install ca-certificates git gh python3 file binutils make 2>&1 | tee "$RUNNER_TEMP/sdk-rev-apt.log"
      - name: Checkout diagnostic tools and the exact source baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize failure evidence directory
        run: |
          mkdir -p evidence/metadata
          cp "$RUNNER_TEMP/sdk-rev-apt.log" evidence/prerequisites.log
      - name: Validate immutable diagnostic inputs
        run: |
          python3 - <<'PY'
          import os
          assert os.environ['BASE_SOURCE_SHA'] == '37f4315c553b9fc3807f2f173d9a0fae3f239ebc'
          assert os.environ['DIAGNOSTIC_KIND'] in ('replay', 'session')
          PY
      - name: Checkout pinned source into an isolated tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.BASE_SOURCE_SHA }}
          path: source-base
      - name: Fetch the exact published SDK from base
        id: sdk
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sdk-release.py fetch --binary-only --repo "$GITHUB_REPOSITORY" --directory downloaded-sdk --github-output "$GITHUB_OUTPUT" 2>&1 | tee evidence/sdk-rev-fetch.log
      - name: Install and verify the published SDK
        run: |
          if [ '${{ steps.sdk.outputs.found }}' != true ]; then
            echo '::error::The base release has no SDK matching this recipe.'
            exit 1
          fi
          set -- downloaded-sdk/datapump-sdk-*-linux-x86_64.tar.gz
          test "$#" -eq 1
          python3 tools/build-sdk.py install --archive "$1" --destination "$GITHUB_WORKSPACE/source-base/build/sdk"
          python3 tools/build-sdk.py verify "$GITHUB_WORKSPACE/source-base/build/sdk" --max-host-glibc 2.36
      - name: Verify relocated SDK tools and private runtimes
        run: |
          python3 - <<'PY'
          import json
          import hashlib
          import os
          from pathlib import Path
          import subprocess

          root = (Path(os.environ['GITHUB_WORKSPACE']) / 'source-base/build/sdk').resolve()
          manifest = json.loads((root / 'share/datapump-sdk/manifest.json').read_text())
          manifest_path = root / 'share/datapump-sdk/manifest.json'
          if hashlib.sha256(manifest_path.read_bytes()).hexdigest() != os.environ['EXPECTED_SDK_MANIFEST_SHA256']:
              raise SystemExit('published SDK manifest differs from the pinned capture configuration')
          runtimes = {'libstdc++.so.6', 'libgcc_s.so.1'}
          for name in runtimes:
              if not (root / 'lib' / name).is_file():
                  raise SystemExit('SDK host runtime is missing: ' + name)
          env = os.environ.copy()
          for name in ('LD_LIBRARY_PATH', 'LD_PRELOAD', 'LD_AUDIT', 'LD_DEBUG'):
              env.pop(name, None)
          compiler = root / manifest['target']['cxx_compiler']
          cc1plus = subprocess.check_output([str(compiler), '-print-prog-name=cc1plus'], env=env, text=True).strip()
          python = root / 'bin/python3'
          tools = [root / 'bin/cmake', root / 'bin/ninja', Path(cc1plus), python]
          if (root / 'bin/patchelf').is_file():
              tools.append(root / 'bin/patchelf')
          for tool in tools:
              if not tool.is_absolute() or not tool.is_file() or root not in tool.resolve().parents:
                  raise SystemExit('SDK host tool missing/outside root: ' + str(tool))
              result = subprocess.run(['ldd', str(tool)], env=env, text=True, capture_output=True, check=True)
              if 'not found' in result.stdout:
                  raise SystemExit('SDK host dependency missing: ' + result.stdout)
              for line in result.stdout.splitlines():
                  fields = line.split()
                  if fields and fields[0] in runtimes:
                      expected = (root / 'lib' / fields[0]).resolve()
                      if len(fields) < 3 or fields[1] != '=>' or Path(fields[2]).resolve() != expected:
                          raise SystemExit('SDK tool selected non-SDK C++ runtime: ' + str(tool) + '\n' + line)
          python_paths = json.loads(subprocess.check_output([str(python), '-c',
              'import json, pathlib, sys, sysconfig; print(json.dumps([sys.executable, sys.prefix, sys.base_prefix, sysconfig.get_path("stdlib")]))'], env=env, text=True))
          for location in python_paths:
              resolved = Path(location).resolve()
              if resolved != root and root not in resolved.parents:
                  raise SystemExit('SDK Python selected path outside installation: ' + location)
          print('Verified relocated SDK Python and private C++ runtimes')
          PY
      - name: Compare original and matched precomputed controls with two push partitions
        if: inputs.diagnostic == 'replay'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/copied-help-replay/run.py --tool-root "$GITHUB_WORKSPACE" \
            --source-root "$GITHUB_WORKSPACE/source-base" --sdk "$GITHUB_WORKSPACE/source-base/build/sdk" \
            --evidence "$GITHUB_WORKSPACE/replay-evidence" --scratch "$GITHUB_WORKSPACE/.copied-help-replay"
      - name: Measure default-clock raw32 through the Live bank and production GUI reducer
        if: inputs.diagnostic == 'session'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/copied-help-session/run.py --tool-root "$GITHUB_WORKSPACE" \
            --source-root "$GITHUB_WORKSPACE/source-base" --sdk "$GITHUB_WORKSPACE/source-base/build/sdk" \
            --evidence "$GITHUB_WORKSPACE/replay-evidence" --scratch "$GITHUB_WORKSPACE/.copied-help-replay"
      - name: Check bounded evidence without deleting failures
        if: always()
        id: upload-bound
        run: |
          python3 - <<'PY_BUDGET'
          import os, json
          from pathlib import Path
          paths = list(Path('replay-evidence').rglob('*')) + list(Path('evidence').rglob('*')) + [Path(os.environ['RUNNER_TEMP']) / 'sdk-rev-apt.log']
          size = sum(p.stat().st_size for p in paths if p.is_file() and not p.is_symlink())
          reports = list(Path('replay-evidence').glob('*.process.json')) + list(Path('.copied-help-replay').glob('*.process.json'))
          closed = all(json.loads(p.read_text()).get('process_group_closed') is True for p in reports)
          allowed = closed and size <= 300 * 1024 * 1024 and not any(p.is_symlink() for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('allowed=' + str(allowed).lower() + '\n')
          if not allowed:
              raise SystemExit('Replay evidence exceeds upload bound or contains symlink; preserved on runner')
          PY_BUDGET
      - name: Retain exact inputs references, native outputs, first difference and process closure
        if: always() && steps.upload-bound.outputs.allowed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copied-help-${{ inputs.diagnostic }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            replay-evidence/
            evidence/
            ${{ runner.temp }}/sdk-rev-apt.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
          include-hidden-files: true
      - name: State diagnostic limits
        if: always()
        run: |
          echo 'Diagnostic only: fixed-input receiver replay or bounded fresh raw32 Session measurement. No old failure attribution, GUI qualification or release claim. Fresh Session omits prior smoke history; replay variants hold projected input and original processing/drain boundaries fixed.' >> "$GITHUB_STEP_SUMMARY"
