name: Focused certification regressions
'on':
  workflow_call:
    inputs:
      scope:
        description: Focused platform adapter checks
        type: string
        default: all
      source_ref:
        description: Optional immutable source tag/ref for ARM adapter diagnostics
        type: string
        default: ''
      linux_runner:
        type: string
        default: ubuntu-24.04
      windows_runner:
        type: string
        default: windows-2022
      arm_runner:
        type: string
        default: ubuntu-24.04-arm
permissions:
  contents: read
jobs:
  linux-adapter:
    if: inputs.scope == 'all'
    name: Linux ${{ matrix.backend }} adapter (not certification)
    runs-on: ${{ inputs.linux_runner }}
    container: debian:bookworm-slim
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend:
        - fltk
        - rev
    env:
      DEBIAN_FRONTEND: noninteractive
      GH_TOKEN: ${{ github.token }}
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '1'
      GUI_BACKEND: ${{ matrix.backend }}
      DIAGNOSTIC_SCOPE: ${{ inputs.scope }}
    steps:
    - name: Load current package-fetch helper before installing Git
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        path: .ci-bootstrap
        sparse-checkout: |
          tools/ci-apt.sh
          tools/build_capacity.py
        sparse-checkout-cone-mode: false
    - name: Install download and display prerequisites
      run: |
        cp .ci-bootstrap/tools/ci-apt.sh "$RUNNER_TEMP/ci-apt.sh"
        cp .ci-bootstrap/tools/build_capacity.py "$RUNNER_TEMP/build_capacity.py"
        sh "$RUNNER_TEMP/ci-apt.sh" install ca-certificates git gh python3 file binutils make xvfb xauth fonts-dejavu-core fontconfig-config libxtst6 libgl1 libopengl0 libgl1-mesa-dri
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Reuse the exact prepared SDK
      id: sdk
      run: python3 tools/sdk-release.py fetch --binary-only --repo "$GITHUB_REPOSITORY" --directory downloaded-sdk
        --github-output "$GITHUB_OUTPUT"
    - name: Install and verify the SDK without rebuilding it
      env:
        SDK_FOUND: ${{ steps.sdk.outputs.found }}
      run: |
        if [ "$SDK_FOUND" != true ]; then echo 'Run Maintain base SDK for this recipe first.' >&2; exit 1; fi
        set -- downloaded-sdk/datapump-sdk-*-linux-x86_64.tar.gz
        test "$#" -eq 1
        python3 tools/build-sdk.py install --archive "$1" --destination "$GITHUB_WORKSPACE/build/sdk"
        python3 tools/build-sdk.py verify "$GITHUB_WORKSPACE/build/sdk" --max-host-glibc 2.36
    - name: Build only the selected regression prerequisites
      run: |
        ./build.sh configure --sdk "$GITHUB_WORKSPACE/build/sdk" --backend "$GUI_BACKEND" --build-dir build/adapter-diagnostic -- -DDATAPUMP_TEST_NATIVE_GUI=ON
        build/sdk/bin/cmake --build build/adapter-diagnostic --target "test_${GUI_BACKEND}_adapter" --parallel "$(python3 -B tools/build_capacity.py)"
    - name: Run the existing native adapter assertions under a private display
      if: inputs.scope == 'all'
      run: |
        if [ "$GUI_BACKEND" = rev ]; then selector=--inline-document; else selector=--estimate-colors; fi
        xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' \
          "build/adapter-diagnostic/test_${GUI_BACKEND}_adapter" "$selector"
        xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' \
          build/sdk/bin/ctest --test-dir build/adapter-diagnostic --output-on-failure \
          -R '^gui_adapter_conformance$' --parallel 1 --stop-on-failure --no-tests=error
        echo "Linux $GUI_BACKEND adapter passed for $GITHUB_SHA. This focused result does not qualify a release." >> "$GITHUB_STEP_SUMMARY"
  windows-regressions:
    if: inputs.scope == 'all' || inputs.scope == 'windows'
    name: Windows FLTK adapter and Fast regressions (not certification)
    runs-on: ${{ inputs.windows_runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      DIAGNOSTIC_SCOPE: ${{ inputs.scope }}
      UseMultiToolTask: 'true'
      EnforceProcessCountAcrossBuilds: 'true'
    steps:
    - name: Validate the focused selection
      run: |
        if ($env:DIAGNOSTIC_SCOPE -notin @('all', 'windows')) { throw 'Diagnostic scope must be all or windows' }
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Reuse the exact Windows dependency base
      run: ./tools/use-windows-base.ps1 -Repository "$env:GITHUB_REPOSITORY" -Destination "$PWD/build/windows-base"
    - name: Build only the retained regression prerequisites
      run: |
        cmake -S . -B build/certification-diagnostic -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:DATAPUMP_WINDOWS_TOOLCHAIN" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DDATAPUMP_GUI_BACKEND=fltk -DDATAPUMP_TEST_NATIVE_GUI=ON -DDATAPUMP_PORTABLE=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
        if ($LASTEXITCODE -ne 0) { throw 'Focused configuration failed' }
        $env:CL_MPCount = python -B tools/build_capacity.py
        if ($LASTEXITCODE -ne 0 -or $env:CL_MPCount -notmatch '^[1-9][0-9]*$') { $env:CL_MPCount = '1' }
        cmake --build build/certification-diagnostic --config Release --target test_fltk_adapter test_fast_low_rate --parallel $env:CL_MPCount
        if ($LASTEXITCODE -ne 0) { throw 'Focused build failed' }
    - name: Run unchanged focused assertions without smoke sequences
      run: |
        & ./build/certification-diagnostic/Release/test_fltk_adapter.exe --estimate-colors
        if ($LASTEXITCODE -ne 0) { throw 'Focused Windows estimate-color regression failed' }
        & ./build/certification-diagnostic/Release/test_fltk_adapter.exe --layout-lifecycle
        if ($LASTEXITCODE -ne 0) { throw 'Focused Windows layout lifecycle regression failed' }
        ctest --test-dir build/certification-diagnostic -C Release --output-on-failure -R '^(gui_adapter_conformance|fast_low_rate)$' --parallel 1 --stop-on-failure --no-tests=error
        if ($LASTEXITCODE -ne 0) { throw 'Focused Windows regression failed' }
        "Windows adapter and DSP regressions passed for $env:GITHUB_SHA. Full platform regression remains required." >> $env:GITHUB_STEP_SUMMARY
  arm-rev-adapter:
    if: inputs.scope == 'arm-rev-adapter'
    name: ARM64 complete Rev adapter workload (not certification)
    runs-on: ${{ inputs.arm_runner }}
    container: ubuntu:22.04
    timeout-minutes: ${{ inputs.arm_runner == 'ubuntu-24.04-arm' && 25 || 20 }}
    env:
      DEBIAN_FRONTEND: noninteractive
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: ${{ inputs.arm_runner == 'ubuntu-24.04-arm' && '1' || '2' }}
      ADAPTER_DIAGNOSTIC_LIMIT: ${{ inputs.arm_runner == 'ubuntu-24.04-arm' && '900' || '600' }}
    steps:
    - name: Load current package-fetch helper before installing Git
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        path: .ci-bootstrap
        sparse-checkout: |
          tools/ci-apt.sh
          tools/build_capacity.py
        sparse-checkout-cone-mode: false
    - name: Install the same native baseline as ARM64 Rev certification
      run: |
        cp .ci-bootstrap/tools/ci-apt.sh "$RUNNER_TEMP/ci-apt.sh"
        cp .ci-bootstrap/tools/build_capacity.py "$RUNNER_TEMP/build_capacity.py"
        sh "$RUNNER_TEMP/ci-apt.sh" install ca-certificates curl git python3 file binutils make cmake ninja-build g++-11 libssl-dev libasound2-dev libx11-dev libxft-dev libxext-dev libxrender-dev libxcursor-dev libxfixes-dev libxinerama-dev xvfb xauth fonts-dejavu-core fontconfig-config libxtst6 libgl1 libopengl0 libgl1-mesa-dri
    - name: Check out the requested source without changing its tests
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ inputs.source_ref || github.sha }}
    - name: Prepare the same pinned compiler tools; do not build a source SDK
      run: |
        sh tools/install-release-cmake.sh "$GITHUB_WORKSPACE/build/ci-cmake"
        python3 tools/install-release-rev.py "$GITHUB_WORKSPACE/build/ci-rev-tools"
        echo "$GITHUB_WORKSPACE/build/ci-cmake/bin" >> "$GITHUB_PATH"
        echo "$GITHUB_WORKSPACE/build/ci-rev-tools/bin" >> "$GITHUB_PATH"
    - name: Build only the unchanged complete native adapter executable
      run: |
        cmake -S . -B build/arm-adapter-diagnostic -G Ninja \
          -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 \
          -DCMAKE_BUILD_TYPE=Release -DDATAPUMP_PORTABLE=ON \
          -DDATAPUMP_GUI_BACKEND=rev -DDATAPUMP_TEST_NATIVE_GUI=ON
        cmake --build build/arm-adapter-diagnostic --target test_rev_adapter --parallel "$(python3 -B "$RUNNER_TEMP/build_capacity.py")"
    - name: Measure all native adapter assertions with a bounded diagnostic allowance
      run: |
        source_revision=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)
        echo "ARM Rev adapter diagnostic source=$source_revision LP_NUM_THREADS=$LP_NUM_THREADS ordinary_limit=330s diagnostic_limit=${ADAPTER_DIAGNOSTIC_LIMIT}s"
        started=$(date +%s)
        result=0
        timeout --kill-after=10s "${ADAPTER_DIAGNOSTIC_LIMIT}s" xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' \
          build/arm-adapter-diagnostic/test_rev_adapter || result=$?
        elapsed=$(( $(date +%s) - started ))
        echo "ARM Rev complete adapter elapsed=${elapsed}s exit=$result source=$source_revision"
        if [ "$result" -ne 0 ]; then exit "$result"; fi
        if [ "$elapsed" -gt 330 ]; then
          echo "::warning title=Rev adapter diagnostic workload::All native adapter assertions completed in ${elapsed}s, exceeding the ordinary 330s CTest allowance. This diagnostic does not certify a release."
        fi
        echo "ARM Rev complete adapter assertions passed for $source_revision in ${elapsed}s with a ${ADAPTER_DIAGNOSTIC_LIMIT}s diagnostic cap. The ordinary 330s CTest limit is unchanged; full certification remains required." >> "$GITHUB_STEP_SUMMARY"
