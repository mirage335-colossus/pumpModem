name: SDK application qualification scope

on:
  workflow_call:
    inputs:
      scope:
        description: 'packages builds and verifies archives; tests runs source qualification'
        type: string
        required: true
      backend:
        type: string
        required: true
      image:
        type: string
        required: true
      linux_runner:
        type: string
        default: ubuntu-latest-h

permissions:
  contents: read

jobs:
  application:
    name: SDK ${{ inputs.scope }} / ${{ inputs.backend }} / ${{ inputs.image }}
    runs-on: ${{ inputs.linux_runner }}
    container: ${{ inputs.image }}
    timeout-minutes: 120
    env:
      DATAPUMP_CI_SMOKE_WARNINGS_DIR: ${{ github.workspace }}/build/ci-smoke-results
      DATAPUMP_CI_SMOKE_RUNNER: ${{ github.workspace }}/tools/run-gui-smoke.py
      DATAPUMP_SMOKE_TARGET: linux-x86_64-${{ inputs.backend }}
      DATAPUMP_SMOKE_SCOPE: published/sdk-archives
      DATAPUMP_SMOKE_SOURCE_SHA: ${{ github.sha }}
      DATAPUMP_SMOKE_INVENTORY_SHA256: ''
      DEBIAN_FRONTEND: noninteractive
      LIBGL_ALWAYS_SOFTWARE: '1'
      # Reserve CPU time for sampled DSP and GUI polling on standard runners.
      LP_NUM_THREADS: ${{ inputs.linux_runner == 'ubuntu-24.04' && '1' || '2' }}
      SDK_SCOPE: ${{ inputs.scope }}
      SDK_BACKEND: ${{ inputs.backend }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate qualification scope and prepare logs
        run: |
          case "$SDK_SCOPE" in packages|tests) ;; *) echo '::error::Invalid SDK qualification scope'; exit 2 ;; esac
          case "$SDK_BACKEND" in fltk|rev) ;; *) echo '::error::Invalid GUI backend'; exit 2 ;; esac
          SDK_LOG_DIR="$RUNNER_TEMP/datapump-sdk-$SDK_SCOPE-$SDK_BACKEND"
          mkdir -p "$SDK_LOG_DIR"
          printf 'SDK_LOG_DIR=%s\n' "$SDK_LOG_DIR" >> "$GITHUB_ENV"
      # No host compiler or development packages: the downloaded SDK supplies
      # all application headers/libraries, GCC, CMake, Ninja and pkg-config.
      - name: Load current package-fetch helper before installing Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .ci-bootstrap
          sparse-checkout: tools/ci-apt.sh
          sparse-checkout-cone-mode: false
      - name: Install checkout and runtime test prerequisites
        run: |
          cp .ci-bootstrap/tools/ci-apt.sh "$RUNNER_TEMP/ci-apt.sh"
          sh "$RUNNER_TEMP/ci-apt.sh" install ca-certificates git gh python3 file binutils make xvfb xauth fonts-dejavu-core fontconfig-config libgl1 libopengl0 libgl1-mesa-dri libxtst6 2>&1 | tee "$SDK_LOG_DIR/prerequisites.log"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the exact published SDK from base
        id: sdk
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sdk-release.py fetch --binary-only --repo "$GITHUB_REPOSITORY" --directory downloaded-sdk --github-output "$GITHUB_OUTPUT" 2>&1 | tee "$SDK_LOG_DIR/sdk-fetch.log"
      - name: Install and verify the same SDK on this host
        run: |
          if [ '${{ steps.sdk.outputs.found }}' != true ]; then
            echo '::error::The base release has no SDK matching this recipe. Run the SDK base workflow first.'
            exit 1
          fi
          set -- downloaded-sdk/datapump-sdk-*-linux-x86_64.tar.gz
          test "$#" -eq 1
          python3 tools/build-sdk.py install --archive "$1" --destination "$GITHUB_WORKSPACE/build/sdk"
          python3 tools/build-sdk.py verify "$GITHUB_WORKSPACE/build/sdk" --max-host-glibc 2.36
      - name: Verify relocated SDK tools and their private runtimes
        run: |
          python3 - <<'PY' 2>&1 | tee "$SDK_LOG_DIR/sdk-runtime.log"
          import json
          import os
          from pathlib import Path
          import subprocess

          root = (Path(os.environ['GITHUB_WORKSPACE']) / 'build/sdk').resolve()
          manifest = json.loads((root / 'share/datapump-sdk/manifest.json').read_text())
          runtimes = {'libstdc++.so.6', 'libgcc_s.so.1'}
          for name in runtimes:
              if not (root / 'lib' / name).is_file():
                  raise SystemExit('SDK host runtime is missing: ' + name)
          env = os.environ.copy()
          for name in ('LD_LIBRARY_PATH', 'LD_PRELOAD', 'LD_AUDIT', 'LD_DEBUG'):
              env.pop(name, None)
          compiler = root / manifest['target']['cxx_compiler']
          cc1plus = subprocess.check_output([str(compiler), '-print-prog-name=cc1plus'], env=env, text=True).strip()
          python = root / 'bin/python3'
          tools = [root / 'bin/cmake', root / 'bin/ninja', Path(cc1plus), python]
          if (root / 'bin/patchelf').is_file():
              tools.append(root / 'bin/patchelf')
          for tool in tools:
              if not tool.is_absolute() or not tool.is_file() or root not in tool.resolve().parents:
                  raise SystemExit('SDK host tool is missing or outside its root: ' + str(tool))
              result = subprocess.run(['ldd', str(tool)], env=env, text=True, capture_output=True, check=True)
              if 'not found' in result.stdout:
                  raise SystemExit('SDK host dependency is missing: ' + result.stdout)
              for line in result.stdout.splitlines():
                  fields = line.split()
                  if fields and fields[0] in runtimes:
                      expected = (root / 'lib' / fields[0]).resolve()
                      if len(fields) < 3 or fields[1] != '=>' or Path(fields[2]).resolve() != expected:
                          raise SystemExit('SDK tool selected a non-SDK C++ runtime: ' + str(tool) + '\n' + line)
              print('Verified SDK host runtime resolution:', tool.relative_to(root))
          python_paths = json.loads(subprocess.check_output([str(python), '-c',
              'import argparse, json, pathlib, re, sys, sysconfig; print(json.dumps([sys.executable, sys.prefix, sys.base_prefix, sysconfig.get_path("stdlib")]))'], env=env, text=True))
          for location in python_paths:
              resolved = Path(location).resolve()
              if resolved != root and root not in resolved.parents:
                  raise SystemExit('SDK Python selected a path outside its installation: ' + location)
          print('Verified relocated SDK Python and Rev resource-builder imports:', python_paths[0])
          PY
      - name: Build and verify portable application archives
        if: inputs.scope == 'packages'
        run: |
          {
            ./build.sh package --sdk "$GITHUB_WORKSPACE/build/sdk" --backend "$SDK_BACKEND" --build-dir build/sdk-application --jobs 2 --build-jobs "$(nproc)"
            xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' build/sdk/bin/cmake -DARCHIVE_DIR="$PWD/build/sdk-application/releases" -DGUI_SMOKE=ON -DGUI_SMOKE_TIMEOUT=600 -DMAX_GLIBC=2.36 -P tools/verify-native-archives.cmake
          } 2>&1 | tee "$SDK_LOG_DIR/packages.log"
      - name: Run build and packaging isolation regressions
        if: inputs.scope == 'tests'
        run: |
          {
            ./build.sh test build --sdk "$GITHUB_WORKSPACE/build/sdk" --backend "$SDK_BACKEND" --build-dir build/sdk-application --jobs 2 --build-jobs "$(nproc)" -- -DDATAPUMP_PORTABLE=ON
            ./build.sh test packaging --sdk "$GITHUB_WORKSPACE/build/sdk" --backend "$SDK_BACKEND" --build-dir build/sdk-application --jobs 2 --build-jobs "$(nproc)" -- -DDATAPUMP_PORTABLE=ON
          } 2>&1 | tee "$SDK_LOG_DIR/build-packaging-tests.log"
      - name: Preserve wire and shared GUI contracts with the SDK toolchain
        if: inputs.scope == 'tests' && inputs.backend == 'fltk'
        run: |
          {
            # The preceding build/packaging groups configured this exact SDK
            # tree. Keep the full contract while isolating functional Live work.
            build/sdk/bin/cmake -S . -B build/sdk-application -DDART_TESTING_TIMEOUT=3600
            build/sdk/bin/cmake --build build/sdk-application --target datapump-tests-contract --parallel "$(nproc)"
            build/sdk/bin/ctest --test-dir build/sdk-application -C Release --output-on-failure --stop-on-failure --no-tests=error -L '^contract$' -LE native_gui -R '^(live|live_profiles)$' --parallel 1
            build/sdk/bin/ctest --test-dir build/sdk-application -C Release --output-on-failure --stop-on-failure --no-tests=error -L '^contract$' -LE native_gui -E '^(live|live_profiles)$' --parallel 2
          } 2>&1 | tee "$SDK_LOG_DIR/contract.log"
      - name: Run Rev native conformance separately under a private display
        if: inputs.scope == 'tests' && inputs.backend == 'rev'
        # Full validation includes the complete workflow; devfast never runs it.
        # A validated progressing workload limit records incomplete coverage.
        env:
          DATAPUMP_SMOKE_SCOPE: source/native
        run: |
          {
            ./build.sh --sdk "$GITHUB_WORKSPACE/build/sdk" --backend rev --build-dir build/sdk-application --jobs 2 --build-jobs "$(nproc)" -- -DDATAPUMP_PORTABLE=ON -DDATAPUMP_TEST_NATIVE_GUI=ON -DGUI_SMOKE_TIMEOUT=600
            build/sdk/bin/cmake --build build/sdk-application --target datapump-tests-native --parallel "$(nproc)"
            xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' python3 tools/run-native-tests.py --allow-budget-exhaustion --build-dir build/sdk-application --ctest "$GITHUB_WORKSPACE/build/sdk/bin/ctest" --report-dir "$DATAPUMP_CI_SMOKE_WARNINGS_DIR"
          } 2>&1 | tee "$SDK_LOG_DIR/native.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.scope == 'packages'
        with:
          name: DataPump-SDK-${{ inputs.backend }}-Linux-x86_64-glibc-2.36
          path: |
            build/sdk-application/releases/*.tar.gz
            build/sdk-application/releases/*.zip
            build/sdk-application/releases/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Preserve qualification logs and incomplete coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DataPump-SDK-${{ inputs.scope }}-${{ inputs.backend }}-qualification-logs
          path: |
            ${{ env.SDK_LOG_DIR }}/*.log
            build/sdk-application/Testing/Temporary/*.log
            build/sdk-application/CMakeFiles/CMakeConfigureLog.yaml
            build/sdk-application/build-info.txt
            ${{ github.workspace }}/build/ci-smoke-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Summarize this qualification scope
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          {
            printf 'SDK **%s / %s**: **%s**.\n\n' "$SDK_SCOPE" "$SDK_BACKEND" "$RESULT"
            if [ "$SDK_SCOPE" = packages ]; then
              echo 'This scope builds and verifies both portable archives, including copied GUI smoke with any incomplete coverage recorded, and supplies the compatibility matrix.'
            else
              echo 'This scope runs build/packaging regressions plus the FLTK preservation contract or Rev native conformance. Source qualification runs independently of package delivery.'
            fi
            echo 'The complete SDK workflow requires both source scopes, both package scopes and every copied-runtime check; a partial scope is not full qualification.'
          } >> "$GITHUB_STEP_SUMMARY"
