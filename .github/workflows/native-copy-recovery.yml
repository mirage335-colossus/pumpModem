name: Native copied-package recovery

on:
  workflow_call:
    inputs:
      source_run_id:
        description: Exact successful native-linux.yml workflow run containing the package
        type: string
        required: true
      source_sha:
        description: Exact 40-character source commit of that native workflow run
        type: string
        required: true
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact successful native-linux.yml workflow run containing the package
        type: string
        required: true
      source_sha:
        description: Exact 40-character source commit of that native workflow run
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: native-copy-recovery-${{ inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  copy-inputs:
    name: Validate exact native package producer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact_id: ${{ steps.validate.outputs.artifact_id }}
      source_sha: ${{ steps.validate.outputs.source_sha }}
      source_run_id: ${{ steps.validate.outputs.source_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: |
            tools/ci-native-copy-inputs.py
            tools/ci-sdk-copy-inputs.py
          sparse-checkout-cone-mode: false
      - name: Validate exact successful native package
        id: validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 tools/ci-native-copy-inputs.py
      - name: Retain exact producer receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Native-copied-inputs
          path: build/native-copy-inputs.json
          if-no-files-found: warn
          retention-days: 7

  compatibility-recovery:
    name: Native copied package on Ubuntu ${{ matrix.ubuntu }}
    needs: copy-inputs
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
    env:
      DATAPUMP_CI_SMOKE_CAPTURE_FIXTURES: '1'
      DATAPUMP_SMOKE_TARGET: linux-x86_64-fltk
      DATAPUMP_SMOKE_SCOPE: published/ubuntu-${{ matrix.ubuntu }}
      DATAPUMP_SMOKE_SOURCE_SHA: ${{ needs.copy-inputs.outputs.source_sha }}
      DATAPUMP_SMOKE_INVENTORY_SHA256: ''
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Load current package-fetch helper before installing Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .ci-bootstrap
          sparse-checkout: tools/ci-apt.sh
          sparse-checkout-cone-mode: false
      - name: Prepare copied archive checks
        run: |
          cp .ci-bootstrap/tools/ci-apt.sh "$RUNNER_TEMP/ci-apt.sh"
          if [ '${{ matrix.ubuntu }}' = '24.04' ]; then export CI_APT_DOWNLOAD_TIMEOUT=180; fi
          sh "$RUNNER_TEMP/ci-apt.sh" install ca-certificates curl git python3 cmake binutils xvfb xauth fontconfig-config fonts-dejavu-core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.copy-inputs.outputs.source_sha }}
      - name: Set container-local smoke evidence paths
        run: |
          printf 'DATAPUMP_CI_SMOKE_WARNINGS_DIR=%s/build/ci-smoke-results\n' "$PWD" >> "$GITHUB_ENV"
          printf 'DATAPUMP_CI_SMOKE_RUNNER=%s/tools/run-gui-smoke.py\n' "$PWD" >> "$GITHUB_ENV"
      - name: Install the pinned dependency scanner
        run: |
          sh tools/install-release-cmake.sh "$GITHUB_WORKSPACE/build/ci-cmake"
          echo "$GITHUB_WORKSPACE/build/ci-cmake/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.copy-inputs.outputs.artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.copy-inputs.outputs.source_run_id }}
          digest-mismatch: error
          path: downloaded
      - name: Run copied archives with isolated runtime paths
        shell: bash
        run: xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' cmake -DARCHIVE_DIR="$PWD/downloaded" -DGUI_SMOKE=ON -DGUI_SMOKE_TIMEOUT=600 -DMAX_GLIBC=2.35 -DREQUIRE_MANUALS=ON -DREQUIRE_FRONTENDS=ON -P tools/verify-native-archives.cmake 2>&1 | tee "$RUNNER_TEMP/native-compatibility.log"
      - name: Preserve copied-runtime logs and smoke coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Native-compatibility-${{ matrix.ubuntu }}-attempt-${{ github.run_attempt }}-logs
          path: |
            ${{ runner.temp }}/native-compatibility.log
            build/ci-smoke-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Summarize copied-package-only result
        if: always()
        env:
          RESULT: ${{ job.status }}
          UBUNTU: ${{ matrix.ubuntu }}
          SOURCE_SHA: ${{ needs.copy-inputs.outputs.source_sha }}
          SOURCE_RUN: ${{ needs.copy-inputs.outputs.source_run_id }}
        run: |
          {
            printf 'Native copied package recovery on Ubuntu %s from run %s at `%s`: **%s**.\n\n' "$UBUNTU" "$SOURCE_RUN" "$SOURCE_SHA" "$RESULT"
            echo 'This copied-package result does not establish full native CI qualification or release eligibility.'
          } >> "$GITHUB_STEP_SUMMARY"
