          --compiled-source "$PWD/build/first-transition-source"
          --adapter "$PWD/tools/framed-first-transition-diagnostic/prepare.py"
          --binary "$PWD/build/test_live"
          --report "$PWD/build/simulation-first-transition-diagnostics/framed-4e-census"
