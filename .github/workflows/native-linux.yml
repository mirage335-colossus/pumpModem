name: Native Linux validation shard

on:
  workflow_dispatch:
    inputs:
      linux_runner:
        description: 'Linux x86_64 runner for this validation shard'
        type: choice
        options: [ubuntu-24.04, ubuntu-latest-m, ubuntu-latest-l, ubuntu-latest-h]
        default: ubuntu-24.04
      build_type:
        description: 'Debug includes ASan and UBSan'
        type: choice
        options: [Release, Debug]
        default: Release
      scope:
        description: 'Run one complete native scope without repeating the other shards'
        type: choice
        options: [core, fast, live, calibration, frontends, web, package, cli, eme-diagnostic, receiver, native-peak-lease-diagnostic, startup-guide, sched-hop-diagnostic, sched-hop-radius-control, alsa-diagnostic, alsa-radius-diagnostic, preparation-diagnostic, gui-core-diagnostic, gui-stop-diagnostic, fft-diagnostic, planner-diagnostic, eme-probability-diagnostic, gui-stop-differential, fft-kernel-diagnostic, simulation-clock-diagnostic, continuation-carrier-diagnostic, simulation-clock-trace-diagnostic, simulation-clock-geometry-diagnostic, simulation-clock-raw-component-diagnostic, simulation-clock-chain-score-diagnostic, simulation-owner-census-diagnostic, simulation-capacity-shape-diagnostic, simulation-acquisition-partition-diagnostic, fft-normalization-diagnostic]
        default: core
      stop_group:
        description: Temporary matched stop experiment group; diagnostic only
        type: choice
        options: [original, eu, fcc, eu-offset, eu-guard, eu-position, eu-o0-san-on, eu-o1-san-off, eu-o0-san-off, eu-focus-o1-san-on, eu-focus-o0-san-on, eu-focus-o1-san-off, eu-focus-o0-san-off, eu-kernel-o1-san-on, eu-kernel-o1-san-off, eu-clock-o1-san-on, eu-worker-one-o1-san-on]
        default: original
      calibration_section:
        description: 'Calibration section; used only by the calibration scope'
        type: choice
        options: [all, shaped, matrix, 'null', default-window]
        default: all
      sanitizer_realtime:
        description: 'Include real-time Fast RX checks in instrumented Debug coverage'
        type: boolean
        default: false
  workflow_call:
    inputs:
      linux_runner:
        type: string
        default: ubuntu-24.04
      build_type:
        type: string
        default: Release
      scope:
        description: 'core, fast, live, calibration, calibration-aggregate, frontends, web, package, cli, sanitizer-gui, eme-diagnostic, receiver, startup-guide, sched-hop-diagnostic, sched-hop-radius-control, alsa-diagnostic, alsa-radius-diagnostic, preparation-diagnostic, gui-core-diagnostic, gui-stop-diagnostic, fft-diagnostic, planner-diagnostic, eme-probability-diagnostic, gui-stop-differential, fft-kernel-diagnostic, simulation-clock-diagnostic, continuation-carrier-diagnostic, simulation-clock-trace-diagnostic, simulation-clock-geometry-diagnostic, simulation-clock-raw-component-diagnostic, simulation-clock-chain-score-diagnostic, simulation-owner-census-diagnostic, simulation-capacity-shape-diagnostic, simulation-acquisition-partition-diagnostic, or fft-normalization-diagnostic'
        type: string
        required: true
      stop_group:
        description: Temporary matched stop experiment group; diagnostic only
        type: string
        default: original
      calibration_section:
        type: string
        default: all
      calibration_shard:
        description: 'Optional shaped capture part: 0 or 1; requires the separate aggregate job'
        type: string
        default: ''
      sanitizer_realtime:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fft-kernel:
    if: inputs.scope == 'fft-kernel-diagnostic'
    uses: ./.github/workflows/fft-kernel-diagnostic.yml
  fft-normalization:
    if: inputs.scope == 'fft-normalization-diagnostic'
    uses: ./.github/workflows/fft-normalization-diagnostic.yml
  native:
    if: inputs.scope != 'fft-kernel-diagnostic' && inputs.scope != 'fft-normalization-diagnostic'
    name: Linux ${{ inputs.build_type }} / ${{ inputs.scope }} / ${{ inputs.calibration_section }}${{ inputs.calibration_shard != '' && format(' / part {0}', inputs.calibration_shard) || '' }}${{ inputs.scope == 'gui-stop-differential' && format(' / {0}', inputs.stop_group) || '' }}
    runs-on: ${{ inputs.linux_runner }}
    # Preserve the portable application's glibc 2.35 baseline in every shard.
    container: ubuntu:22.04
    # Standard runners need room for the full instrumented suite after compilation.
    # Explicit test limits and physical deadlines remain unchanged.
    timeout-minutes: ${{ inputs.build_type == 'Debug' && (inputs.scope == 'core' || inputs.scope == 'calibration' || inputs.scope == 'preparation-diagnostic') && 240 || 120 }}
    defaults:
      run:
        shell: bash
    env:
      DATAPUMP_CI_SMOKE_WARNINGS_DIR: ${{ github.workspace }}/build/ci-smoke-results
      DATAPUMP_CI_SMOKE_RUNNER: ${{ github.workspace }}/tools/run-gui-smoke.py
      DATAPUMP_SMOKE_TARGET: linux-x86_64-fltk
      DATAPUMP_SMOKE_SCOPE: source/native
      DATAPUMP_SMOKE_SOURCE_SHA: ${{ github.sha }}
      DATAPUMP_SMOKE_INVENTORY_SHA256: ''
      DEBIAN_FRONTEND: noninteractive
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      CC: gcc-11
      CXX: g++-11
      CI_SCOPE: ${{ inputs.scope }}
      CI_STOP_GROUP: ${{ inputs.stop_group }}
      DATAPUMP_SANITIZERS: ${{ inputs.scope == 'gui-stop-differential' && (inputs.stop_group == 'eu-o1-san-off' || inputs.stop_group == 'eu-o0-san-off' || inputs.stop_group == 'eu-focus-o1-san-off' || inputs.stop_group == 'eu-focus-o0-san-off' || inputs.stop_group == 'eu-kernel-o1-san-off') && 'OFF' || ((inputs.build_type == 'Debug' || (inputs.scope == 'simulation-clock-trace-diagnostic' || inputs.scope == 'simulation-clock-geometry-diagnostic' || (inputs.scope == 'simulation-clock-raw-component-diagnostic' || inputs.scope == 'simulation-clock-chain-score-diagnostic' || inputs.scope == 'simulation-owner-census-diagnostic' || inputs.scope == 'simulation-capacity-shape-diagnostic' || inputs.scope == 'simulation-acquisition-partition-diagnostic' || inputs.scope == 'continuation-carrier-diagnostic'))) && 'ON' || 'OFF') }}
      SANITIZER_REALTIME: ${{ inputs.sanitizer_realtime }}
    steps:
      - name: Restrict the temporary graceful-stop diagnostic
        if: inputs.scope == 'gui-stop-diagnostic' && (github.event_name != 'workflow_dispatch' || inputs.build_type != 'Debug' || inputs.linux_runner != 'ubuntu-24.04')
        run: |
          echo '::error::The temporary stop diagnostic requires manual Debug on ubuntu-24.04.'
          exit 2
      - name: Restrict the native peak lease diagnostic
        if: inputs.scope == 'native-peak-lease-diagnostic' && (github.event_name != 'workflow_dispatch' || inputs.build_type != 'Debug' || inputs.linux_runner != 'ubuntu-24.04')
        run: |
          echo '::error::The native peak lease diagnostic requires manual Debug on ubuntu-24.04.'
          exit 2
      - name: Restrict the acquisition partition diagnostic
        if: inputs.scope == 'simulation-acquisition-partition-diagnostic' && (github.event_name != 'workflow_dispatch' || inputs.build_type != 'Debug' || inputs.linux_runner != 'ubuntu-24.04')
        run: |
          echo '::error::The acquisition partition diagnostic requires manual Debug on ubuntu-24.04.'
          exit 2
      - name: Validate manual package configuration
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'package' && inputs.build_type != 'Release'
        run: |
          echo '::error::The package scope requires build_type=Release.'
          exit 2
      - name: Load current package-fetch helper before installing Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .ci-bootstrap
          sparse-checkout: tools/ci-apt.sh
          sparse-checkout-cone-mode: false
      - name: Restrict the matched stop differential diagnostic
        if: inputs.scope == 'gui-stop-differential' && (github.event_name != 'workflow_dispatch' || inputs.build_type != 'Debug' || inputs.linux_runner != 'ubuntu-24.04')
        run: |
          echo '::error::The matched stop diagnostic requires manual Debug on ubuntu-24.04.'
          exit 2
      - name: Prepare build dependencies
        run: |
          cp .ci-bootstrap/tools/ci-apt.sh "$RUNNER_TEMP/ci-apt.sh"
          sh "$RUNNER_TEMP/ci-apt.sh" install ca-certificates curl git cmake ninja-build make g++-11 binutils libssl-dev libasound2-dev libx11-dev libxft-dev libxext-dev libxrender-dev libxcursor-dev libxfixes-dev libxinerama-dev libncurses-dev libsdl2-dev xvfb xauth fontconfig-config fonts-dejavu-core python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ (inputs.scope == 'simulation-capacity-shape-diagnostic' || inputs.scope == 'simulation-acquisition-partition-diagnostic') && 16 || 1 }}
      - name: Install the pinned dependency scanner
        run: |
          sh tools/install-release-cmake.sh "$GITHUB_WORKSPACE/build/ci-cmake"
          echo "$GITHUB_WORKSPACE/build/ci-cmake/bin" >> "$GITHUB_PATH"
      - name: Prepare the pinned CPU framebuffer host
        if: inputs.scope == 'package' || inputs.scope == 'frontends'
        run: |
          python3 -B tools/prepare-native-sdl.py "$GITHUB_WORKSPACE/build/native-sdl" --cc gcc-11 --cxx g++-11 --jobs "$(python3 -B tools/build_capacity.py)"
          echo "DATAPUMP_NATIVE_SDL_ROOT=$GITHUB_WORKSPACE/build/native-sdl/install" >> "$GITHUB_ENV"
      - name: Prepare the JavaScript test host
        if: inputs.scope == 'web'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Prepare the exact isolated graceful-stop source variant
        if: inputs.scope == 'gui-stop-diagnostic'
        env:
          APPLY_GUI_STOP_VARIANT: '1'
        run: |
          python3 -B - <<'PY_STOP_PREPARE'
          if not __debug__: raise RuntimeError("optimized diagnostic preparation is forbidden")
          from pathlib import Path
          import difflib, hashlib, json, os
          import subprocess
          root=Path.cwd()
          git=['git','-c','safe.directory='+str(root)]
          assert subprocess.check_output(git+['status','--porcelain=v1','--untracked-files=all'],text=True)=='', 'diagnostic requires clean checkout'
          report=Path('build/gui-stop-diagnostic');report.mkdir(parents=True,exist_ok=False)
          (report/'source.txt').write_text(subprocess.check_output(git+['rev-parse','HEAD'],text=True))

          read_dependencies = {'src/live.cpp': '789735690478e9c7331487740c475e862293df69a49ce7a44b6793a3909415ac', 'tests/test_gui_controller.cpp': '3730678e53ef37e295adc319b757b527ffb6a6505bc5424955958658df56ce0f', 'src/pattern_receiver.cpp': 'a5860a8130a9e6d851c7b8c68bced746c2c12a9a6ad7c0bc15c8062b6ecd52c8', 'include/datapump/pattern_receiver.hpp': '7da6a7ab2aa261fd65b5be1a31f81c3b22f6efc9517cd819dd2907fefe022b13', 'src/pattern_fft_batch.cpp': '241e2493c5ad5426c177d500c8a0514e64645c81a384176a4760a06323d62e0e', 'src/pattern_fft_batch.hpp': 'b1a0c6f4653216b1ab04a1df5e123282abb94f46333ba270a98817212ddb5dbb', 'src/search_fft.cpp': '26c325d914f5fdede92715b89627832d36faf374c65aaac05e63682a9f221f95', 'src/search_fft.hpp': '97451e9d1e2a83be320f1f36ad7a67ea212900298a8821665504ab1c614fb2e9', 'src/search_parallel.cpp': '4aa3270515e0e8aaf6f6f146588c40fbff83627af615c85f95897e1af9132f4b', 'src/search_parallel.hpp': '4da8151e4dc0c030100c2d2aecfe17bfc4f3e9ca50b72c46b58c6de7a3096887', 'src/scheduled_work_profile.hpp': '87a701a4ed853685e4250805a8665fdd0f10b15347ab0f4f8be1fcc8148b7acf', 'src/audio_trace.hpp': '2e476953b87dbb555e5734357a7de68873709070a97986b6b48fa82397bc52d9', 'src/channel.cpp': '1d484160f58b0955a4683096dc756fdd3086a28197dcb54ab2ce6861384c2515', 'src/pattern_code.cpp': '3e837e010ee937136b0cca72e2200b2c3de938bec344e0292478d5e1cde05cd4', 'include/datapump/pattern_code.hpp': '3f42d8076a1cab65ebc27760313d3e577dae84696b21dd172f9abdcdbb6f80e4', 'src/gui/link_planner_model.hpp': '5ba50225282272e09a975afb2cf1169bc403c31e09a907eb45e1e00a97820c08', 'src/gui/link_planner_model.cpp': '4e90d238bb621fb374bff9369ea9c36ff922a772d73d71d7f7753ff2b5c7a4cb', 'src/gui/controller.cpp': '035744048b5532f367d565c20511f768a49951d6a7cc7e5e4b842ff7061d7891', 'tests/test_gui_link_planner.cpp': '12236b31fa0c8ca0103ee697b4b3ddc78219260a8e0e09335b32e1b1626d9df6', 'src/gui/controller.hpp': '720ed78afbc0b6ad00ec1a7e27f019641ff65f235db565d82dd8f39a0ca9bd4c'}
          for path,digest in read_dependencies.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path

          expected = {'src/live.cpp': '789735690478e9c7331487740c475e862293df69a49ce7a44b6793a3909415ac', 'tests/test_gui_controller.cpp': '3730678e53ef37e295adc319b757b527ffb6a6505bc5424955958658df56ce0f', 'src/pattern_receiver.cpp': 'a5860a8130a9e6d851c7b8c68bced746c2c12a9a6ad7c0bc15c8062b6ecd52c8', 'src/pattern_fft_batch.cpp': '241e2493c5ad5426c177d500c8a0514e64645c81a384176a4760a06323d62e0e', 'src/scheduled_work_profile.hpp': '87a701a4ed853685e4250805a8665fdd0f10b15347ab0f4f8be1fcc8148b7acf'}
          original = {p: Path(p).read_text() for p in expected}
          for p in expected:
              assert hashlib.sha256(original[p].encode()).hexdigest() == expected[p], p
          changed = dict(original)

          def replace(p, a, b):
              assert changed[p].count(a) == 1, (p, a[:100], changed[p].count(a))
              changed[p] = changed[p].replace(a, b)

          p = "src/live.cpp"
          replace(p, """            wave.transmitter->request_finish();wave.graceful=true;""",
          """            const auto diagnostic_endpoint_before=wave.transmitter->total_samples();
                      const auto diagnostic_generated_before=wave.transmitter->samples_emitted();
                      wave.transmitter->request_finish();wave.graceful=true;
                      audio::trace::record("diagnostic_finish_ack",[&](auto& f) {
                          f.add("generation",wave.generation);f.add("transmission_id",wave.serial);
                          f.add("noise",wave.noise);f.add("sample_rate",wave.modem.sample_rate);
                          f.add("traversed_physical_samples",wave.transmitted_samples);
                          f.add("generated_physical_samples_before",diagnostic_generated_before);
                          f.add("generated_physical_samples_after",wave.transmitter->samples_emitted());
                          f.add("endpoint_physical_samples_before",diagnostic_endpoint_before);
                          f.add("endpoint_physical_samples_after",wave.transmitter->total_samples());
                          f.add("stop_requested",wave.stop.stop_requested());
                      });""")
          replace(p, """                        if (!count) { complete_tx(*wave); wave.reset(); continue; }""",
          """                        if (!count) {
                                      audio::trace::record("diagnostic_noise_read_eof",[&](auto& f) {
                                          f.add("generation",wave->generation);f.add("transmission_id",wave->serial);
                                          f.add("sample_rate",wave->modem.sample_rate);f.add("graceful",wave->graceful);
                                          f.add("stop_requested",wave->stop.stop_requested());
                                          f.add("traversed_physical_samples",wave->transmitted_samples);
                                          f.add("generated_physical_samples",wave->transmitter->samples_emitted());
                                          f.add("endpoint_physical_samples",wave->transmitter->total_samples());
                                      });
                                      complete_tx(*wave); wave.reset(); continue;
                                  }""")
          p = "tests/test_gui_controller.cpp"
          replace(p, '#include "cpu_work_budget.hpp"\n',
              '#include "cpu_work_budget.hpp"\n#include "../src/audio_trace.hpp"\n#include <exception>\n')
          replace(p, 'void fake_hop_display() {',
              'void fake_hop_display(bool stop_diagnostic=false,bool abort_only=false) {')
          replace(p, '    for(const auto* preference:{"fake-fcc","fake-eu","fake-list"}) {\n',
          '''    for(const auto* preference:{"fake-fcc","fake-eu","fake-list"}) {
              if(abort_only&&std::string_view(preference)!="fake-list")continue;
          ''')
          replace(p,
          '''    const auto protected_tail_seconds=double(modem::transmit_stop_sample_count(stop_config))/stop_config.sample_rate;
              controller.activate(C::cancel);''',
          '''    const auto protected_tail_seconds=double(modem::transmit_stop_sample_count(stop_config))/stop_config.sample_rate;
              const auto diagnostic_request_started=std::chrono::steady_clock::now();
              const auto diagnostic_transmission_id=controller.snapshot().transmission_id;
              const auto diagnostic_snapshot=[&](const char* phase) {
                  if(!stop_diagnostic||!delayed_arrival)return;
                  const auto& s=controller.snapshot();
                  const auto& h=s.receiver_health;
          #if defined(__linux__)
                  const auto cpu=std::clock();
          #else
                  const auto cpu=std::clock_t(-1);
          #endif
                  audio::trace::record("diagnostic_stop_snapshot",[&](auto& f) {
                      f.add("phase",phase);f.add("preference",preference);
                      f.add("wall_since_request",std::chrono::duration<double>(
                          std::chrono::steady_clock::now()-diagnostic_request_started).count());
                      f.add("transmission_id",s.transmission_id);f.add("request_transmission_id",diagnostic_transmission_id);
                      f.add("transmission_seconds",s.transmission_seconds);f.add("virtual_seconds",s.virtual_seconds);
                      f.add("transmitting",s.transmitting);f.add("noise",s.transmitting_noise);
                      f.add("stopping",s.transmission_stopping);f.add("finished",s.transmission_finished);
                      f.add("transmission_failed",s.transmission_failed);
                      f.add("process_cpu_available",cpu!=std::clock_t(-1));
                      f.add("process_cpu_seconds",cpu!=std::clock_t(-1)?double(cpu)/CLOCKS_PER_SEC:0.);
                      f.add("receiver_bank_builds",s.receiver_bank_builds);
                      f.add("receiver_admissions",s.receiver_admissions);f.add("receiver_retirements",s.receiver_retirements);
                      f.add("receiver_instances",s.receiver_instances);f.add("input_revision",s.receiver_input_revision);
                      f.add("received_samples",s.samples_received);f.add("processed_physical_samples",s.processed_physical_samples);
                      f.add("queued_physical_samples",s.queued_physical_samples);
                      f.add("decoding_physical_samples",s.decoding_physical_samples);
                      f.add("receiver_failed",h.failed());f.add("dropped_samples",h.dropped_samples);
                      f.add("input_overruns",h.input_overruns);f.add("receiver_reset",h.receiver_reset);
                      f.add("input_interrupted",h.input_interrupted);f.add("search_limited",h.search_limited);
                      f.add("receiver_behind",s.receiver_behind);f.add("backlog_seconds",s.receiver_backlog_seconds);
                      f.add("oldest_input_seconds",s.receiver_oldest_input_seconds);
                      f.add("error",s.error.substr(0,256));f.add("receiver_error",s.receiver_error.substr(0,256));
                      f.add("status",s.status.substr(0,256));
                  });
              };
              diagnostic_snapshot("before_first_cancel");
              controller.activate(C::cancel);
              diagnostic_snapshot("after_first_cancel");''')
          replace(p, '    const auto source_at_deadline=controller.snapshot().transmission_seconds;\n',
          '''    const auto source_at_deadline=controller.snapshot().transmission_seconds;
              diagnostic_snapshot("ordinary_stop_window_end");
          ''')
          replace(p, '    const auto source_since_request=controller.snapshot().transmission_seconds-requested_source_seconds;\n',
          '''    const auto source_since_request=controller.snapshot().transmission_seconds-requested_source_seconds;
              diagnostic_snapshot("bounded_stop_window_end");
          ''')
          replace(p,
          """        controller.activate(C::cancel); // Preserve this fixture's immediate cancellation deadline.
          """,
          """        if(abort_only)audio::trace::record("diagnostic_immediate_abort_invoked",[&](auto& f) {
                      f.add("transmission_id",controller.snapshot().transmission_id);
                  });
                  controller.activate(C::cancel); // Preserve this fixture's immediate cancellation deadline.
          """)
          first = '    check(short_list||source_since_request<=source_allowance,\n'
          last = '    if(delayed_arrival) {\n        // Preview has a bounded sampled-work allowance.'
          i = changed[p].index(first)
          j = changed[p].index(last, i)
          strict = changed[p][i:j]
          catch = '''    } catch(const Error& strict_error) {
                  if(!stop_diagnostic||!delayed_arrival)throw;
                  const auto strict_failure=std::current_exception();
                  std::cout<<"GUI_STOP_STRICT_RESULT status=FAILED reason="<<std::quoted(strict_error.what())
                           <<" original_stop_wall_seconds="<<stop_wall_seconds<<std::endl;
                  try {
                  // Observation only: never retry/cancel or turn the original failure into a pass.
                  const auto observation_end=diagnostic_request_started+std::chrono::seconds(45);
                  auto next_observation=std::chrono::steady_clock::now();
                  unsigned observations=0;
                  while(controller.snapshot().transmitting&&std::chrono::steady_clock::now()<observation_end) {
                      controller.poll();
                      const auto now=std::chrono::steady_clock::now();
                      if(now>=next_observation&&observations<46) {
                          diagnostic_snapshot("post_failure_observation");
                          ++observations;next_observation=now+std::chrono::seconds(1);
                      }
                      std::this_thread::sleep_for(std::chrono::milliseconds(5));
                  }
                  const auto observation_finished=std::chrono::steady_clock::now();
                  diagnostic_snapshot("observation_end_before_cleanup");
                  const auto& s=controller.snapshot();
                  const auto& t=s.transmit_trace;
                  const bool same_id=s.transmission_id==diagnostic_transmission_id&&
                      arrival_transmission_id&&s.transmission_id==*arrival_transmission_id&&s.transmission_id!=prior_transmission_id;
                  const bool healthy=!s.transmission_failed&&s.error.empty()&&s.receiver_error.empty()&&
                      !s.receiver_health.failed()&&!s.receiver_health.dropped_samples;
                  const bool restored=!s.transmitting&&s.transmission_finished&&!s.transmission_stopping&&
                      controller.field(F::carrier).disabled_text.empty()&&controller.field(F::rf_shift).disabled_text.empty()&&
                      controller.field(F::carrier).text==carrier&&controller.field(F::rf_shift).text==shift&&
                      controller.field(F::fhss).display_text.find("Fake: hop ")==std::string::npos;
                  const bool traversed=same_id&&healthy&&t.fhss_available&&t.fhss_arrival_available&&
                      t.fhss_arrival_offset_seconds==2.564&&std::isfinite(s.transmission_seconds)&&
                      s.transmission_seconds>=t.fhss_arrival_offset_seconds;
                  const bool source_cap=std::isfinite(s.transmission_seconds)&&
                      s.transmission_seconds>=requested_source_seconds&&
                      s.transmission_seconds-requested_source_seconds<=source_allowance;
                  std::cout<<"GUI_STOP_OBSERVATION strict_result=FAILED same_id="<<same_id
                           <<" healthy="<<healthy<<" restored="<<restored<<" traversed="<<traversed
                           <<" source_cap="<<source_cap<<" source_since_request="
                           <<s.transmission_seconds-requested_source_seconds<<" source_allowance="<<source_allowance
                           <<" within_45_seconds="<<(observation_finished<=observation_end)
                           <<" wall_since_request="<<std::chrono::duration<double>(
                              observation_finished-diagnostic_request_started).count()<<std::endl;
                  // Cleanup only after the bounded observation, never evidence of natural EOF.
                  if(controller.snapshot().transmitting) {
