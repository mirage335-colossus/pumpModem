          root=pathlib.Path.cwd(); report=root/'build/alsa-radius-diagnostic';report.mkdir()
          header=root/'include/datapump/pattern_pulse.hpp'; original=header.read_bytes()
          assert hashlib.sha256(original).hexdigest()=='21f2e598edafc01871409655c96941bb3e0df7cbfffb4c62c0361b5fa1683a14'
          before=b'inline constexpr double pattern_pcm_radius_limit = .992;'
