                  std::rethrow_exception(strict_failure);
              }
          '''
          changed[p] = changed[p][:i] + '    try {\n' + strict + catch + '''    if(abort_only)audio::trace::record("diagnostic_immediate_abort_completed",[&](auto& f) {
