          assert report.get('omitted') == [], report.get('omitted')
          assert report.get('ctest_returncode') == 0, report.get('ctest_returncode')
          cases = report.get('tests', [])
          assert [case.get('name') for case in cases] == expected, cases
          assert all(case.get('status') == 'passed' for case in cases), cases
          assert report.get('result_counts', {}).get('passed') == 2, report.get('result_counts')
          limits = report.get('coverage_limits', [])
          assert all(item.get('test') == 'live' and item.get('limit_seconds') == 120 for item in limits), limits
          assert report.get('status') in ('passed', 'passed_with_warnings'), report.get('status')
          assert pathlib.Path(sys.argv[1]).with_suffix('.xml').is_file()
