      - name: Observe graceful completion and independently check immediate abort
        if: inputs.scope == 'gui-stop-diagnostic'
        run: |
          python3 -B - <<'PY_STOP_RUN'
          if not __debug__: raise RuntimeError("optimized diagnostic execution is forbidden")
          import hashlib,json,os,pathlib,subprocess,time
          root=pathlib.Path.cwd();report=root/'build/gui-stop-diagnostic'
          binary=root/'build/test_gui_controller'
          assert binary.is_file(), 'diagnostic executable missing'
          executable_sha256=hashlib.sha256(binary.read_bytes()).hexdigest()
          cases=[('stop5',['--diagnose-full-stop',str(report/'stop5.jsonl'),'5'],480,'coarse',5),
                 ('abort',['--fake-hop-display','--diagnose-abort',str(report/'abort.jsonl')],240,'disabled',5)]
          results=[]
          for name,args,limit,profile_mode,stop_observer_ms in cases:
              command=[str(binary),*args];started=time.monotonic()
              case_env=os.environ.copy()
              case_env['DATAPUMP_RX_CPU_PROFILE']=profile_mode
              with (report/(name+'.log')).open('wb') as log:
                  try:
                      completed=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,timeout=limit,env=case_env)
                      code=completed.returncode;timed_out=False
                  except subprocess.TimeoutExpired:
                      code=124;timed_out=True
              item={'name':name,'command':command,'cwd':str(root),'timeout_seconds':limit,
                    'profile_mode':profile_mode,'stop_observer_ms':stop_observer_ms,
                    'exit_code':code,'timed_out':timed_out,'elapsed_seconds':time.monotonic()-started,
                    'executable_sha256':executable_sha256,
                    'classification':'temporary source variant; diagnostic only, never qualification'}
              results.append(item)
              (report/'commands-and-exits.json').write_text(json.dumps(results,indent=2)+'\n')
              print(json.dumps(item),flush=True)
          # Always run both independent processes, preserving every actual nonzero exit.
          raise SystemExit(1 if any(r['exit_code']!=0 for r in results) else 0)
          PY_STOP_RUN
      - name: Run the selected native tests
        if: inputs.scope == 'core' || inputs.scope == 'fast' || inputs.scope == 'live' || inputs.scope == 'calibration' || inputs.scope == 'frontends' || inputs.scope == 'web'
