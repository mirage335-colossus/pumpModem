name: Native Linux validation shard

on:
  workflow_dispatch:
    inputs:
      linux_runner:
        description: 'Linux x86_64 runner for this validation shard'
        type: choice
        options: [ubuntu-24.04, ubuntu-latest-m, ubuntu-latest-l, ubuntu-latest-h]
        default: ubuntu-24.04
      build_type:
        description: 'Debug includes ASan and UBSan'
        type: choice
        options: [Release, Debug]
        default: Release
      scope:
        description: 'Run one complete native scope without repeating the other shards'
        type: choice
        options: [core, fast, live, calibration, frontends, web, package, cli, eme-diagnostic, receiver, startup-guide, sched-hop-diagnostic, sched-hop-radius-control, alsa-diagnostic, alsa-radius-diagnostic, preparation-diagnostic, gui-core-diagnostic, gui-stop-diagnostic]
        default: core
      calibration_section:
        description: 'Calibration section; used only by the calibration scope'
        type: choice
        options: [all, shaped, matrix, 'null', default-window]
        default: all
      sanitizer_realtime:
        description: 'Include real-time Fast RX checks in instrumented Debug coverage'
        type: boolean
        default: false
  workflow_call:
    inputs:
      linux_runner:
        type: string
        default: ubuntu-24.04
      build_type:
        type: string
        default: Release
      scope:
        description: 'core, fast, live, calibration, calibration-aggregate, frontends, web, package, cli, sanitizer-gui, eme-diagnostic, receiver, startup-guide, sched-hop-diagnostic, sched-hop-radius-control, alsa-diagnostic, alsa-radius-diagnostic, preparation-diagnostic, gui-core-diagnostic, or gui-stop-diagnostic'
        type: string
        required: true
      calibration_section:
        type: string
        default: all
      calibration_shard:
        description: 'Optional shaped capture part: 0 or 1; requires the separate aggregate job'
        type: string
        default: ''
      sanitizer_realtime:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    name: Linux ${{ inputs.build_type }} / ${{ inputs.scope }} / ${{ inputs.calibration_section }}${{ inputs.calibration_shard != '' && format(' / part {0}', inputs.calibration_shard) || '' }}
    runs-on: ${{ inputs.linux_runner }}
    # Preserve the portable application's glibc 2.35 baseline in every shard.
    container: ubuntu:22.04
    # Standard runners need room for the full instrumented suite after compilation.
    # Explicit test limits and physical deadlines remain unchanged.
    timeout-minutes: ${{ inputs.build_type == 'Debug' && (inputs.scope == 'core' || inputs.scope == 'calibration' || inputs.scope == 'preparation-diagnostic') && 240 || 120 }}
    defaults:
      run:
        shell: bash
    env:
      DATAPUMP_CI_SMOKE_WARNINGS_DIR: ${{ github.workspace }}/build/ci-smoke-results
      DATAPUMP_CI_SMOKE_RUNNER: ${{ github.workspace }}/tools/run-gui-smoke.py
      DATAPUMP_SMOKE_TARGET: linux-x86_64-fltk
      DATAPUMP_SMOKE_SCOPE: source/native
      DATAPUMP_SMOKE_SOURCE_SHA: ${{ github.sha }}
      DATAPUMP_SMOKE_INVENTORY_SHA256: ''
      DEBIAN_FRONTEND: noninteractive
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      CC: gcc-11
      CXX: g++-11
      CI_SCOPE: ${{ inputs.scope }}
      DATAPUMP_SANITIZERS: ${{ inputs.build_type == 'Debug' && 'ON' || 'OFF' }}
      SANITIZER_REALTIME: ${{ inputs.sanitizer_realtime }}
    steps:
      - name: Restrict the temporary graceful-stop diagnostic
        if: inputs.scope == 'gui-stop-diagnostic' && (github.event_name != 'workflow_dispatch' || inputs.build_type != 'Debug' || inputs.linux_runner != 'ubuntu-24.04')
        run: |
          echo '::error::The temporary stop diagnostic requires manual Debug on ubuntu-24.04.'
          exit 2
      - name: Validate manual package configuration
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'package' && inputs.build_type != 'Release'
        run: |
          echo '::error::The package scope requires build_type=Release.'
          exit 2
      - name: Load current package-fetch helper before installing Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .ci-bootstrap
          sparse-checkout: tools/ci-apt.sh
          sparse-checkout-cone-mode: false
      - name: Prepare build dependencies
        run: |
          cp .ci-bootstrap/tools/ci-apt.sh "$RUNNER_TEMP/ci-apt.sh"
          sh "$RUNNER_TEMP/ci-apt.sh" install ca-certificates curl git cmake ninja-build make g++-11 binutils libssl-dev libasound2-dev libx11-dev libxft-dev libxext-dev libxrender-dev libxcursor-dev libxfixes-dev libxinerama-dev libncurses-dev libsdl2-dev xvfb xauth fontconfig-config fonts-dejavu-core python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned dependency scanner
        run: |
          sh tools/install-release-cmake.sh "$GITHUB_WORKSPACE/build/ci-cmake"
          echo "$GITHUB_WORKSPACE/build/ci-cmake/bin" >> "$GITHUB_PATH"
      - name: Prepare the pinned CPU framebuffer host
        if: inputs.scope == 'package' || inputs.scope == 'frontends'
        run: |
          python3 -B tools/prepare-native-sdl.py "$GITHUB_WORKSPACE/build/native-sdl" --cc gcc-11 --cxx g++-11 --jobs "$(python3 -B tools/build_capacity.py)"
          echo "DATAPUMP_NATIVE_SDL_ROOT=$GITHUB_WORKSPACE/build/native-sdl/install" >> "$GITHUB_ENV"
      - name: Prepare the JavaScript test host
        if: inputs.scope == 'web'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Prepare the exact isolated graceful-stop source variant
        if: inputs.scope == 'gui-stop-diagnostic'
        env:
          APPLY_GUI_STOP_VARIANT: '1'
        run: |
          python3 -B - <<'PY_STOP_PREPARE'
          if not __debug__: raise RuntimeError("optimized diagnostic preparation is forbidden")
          from pathlib import Path
          import difflib, hashlib, json, os

          import subprocess
          root=Path.cwd()
          git=['git','-c','safe.directory='+str(root)]
          assert subprocess.check_output(git+['status','--porcelain=v1','--untracked-files=all'],text=True)=='', 'diagnostic requires clean checkout'
          report=Path('build/gui-stop-diagnostic');report.mkdir(parents=True,exist_ok=False)
          (report/'source.txt').write_text(subprocess.check_output(git+['rev-parse','HEAD'],text=True))

          expected = {
              "src/live.cpp":
                  "789735690478e9c7331487740c475e862293df69a49ce7a44b6793a3909415ac",
              "tests/test_gui_controller.cpp":
                  "3730678e53ef37e295adc319b757b527ffb6a6505bc5424955958658df56ce0f",
          }
          original = {p: Path(p).read_text() for p in expected}
          for p in expected:
              assert hashlib.sha256(original[p].encode()).hexdigest() == expected[p], p
          changed = dict(original)

          def replace(p, a, b):
              assert changed[p].count(a) == 1, (p, a[:100], changed[p].count(a))
              changed[p] = changed[p].replace(a, b)

          p = "src/live.cpp"
          replace(p, """            wave.transmitter->request_finish();wave.graceful=true;""",
          """            const auto diagnostic_endpoint_before=wave.transmitter->total_samples();
                      const auto diagnostic_generated_before=wave.transmitter->samples_emitted();
                      wave.transmitter->request_finish();wave.graceful=true;
                      audio::trace::record("diagnostic_finish_ack",[&](auto& f) {
                          f.add("generation",wave.generation);f.add("transmission_id",wave.serial);
                          f.add("noise",wave.noise);f.add("sample_rate",wave.modem.sample_rate);
                          f.add("traversed_physical_samples",wave.transmitted_samples);
                          f.add("generated_physical_samples_before",diagnostic_generated_before);
                          f.add("generated_physical_samples_after",wave.transmitter->samples_emitted());
                          f.add("endpoint_physical_samples_before",diagnostic_endpoint_before);
                          f.add("endpoint_physical_samples_after",wave.transmitter->total_samples());
                          f.add("stop_requested",wave.stop.stop_requested());
                      });""")
          replace(p, """                        if (!count) { complete_tx(*wave); wave.reset(); continue; }""",
          """                        if (!count) {
                                      audio::trace::record("diagnostic_noise_read_eof",[&](auto& f) {
                                          f.add("generation",wave->generation);f.add("transmission_id",wave->serial);
                                          f.add("sample_rate",wave->modem.sample_rate);f.add("graceful",wave->graceful);
                                          f.add("stop_requested",wave->stop.stop_requested());
                                          f.add("traversed_physical_samples",wave->transmitted_samples);
                                          f.add("generated_physical_samples",wave->transmitter->samples_emitted());
                                          f.add("endpoint_physical_samples",wave->transmitter->total_samples());
                                      });
                                      complete_tx(*wave); wave.reset(); continue;
                                  }""")
          p = "tests/test_gui_controller.cpp"
          replace(p, '#include "cpu_work_budget.hpp"\n',
              '#include "cpu_work_budget.hpp"\n#include "../src/audio_trace.hpp"\n#include <exception>\n')
          replace(p, 'void fake_hop_display() {',
              'void fake_hop_display(bool stop_diagnostic=false,bool abort_only=false) {')
          replace(p, '    for(const auto* preference:{"fake-fcc","fake-eu","fake-list"}) {\n',
          '''    for(const auto* preference:{"fake-fcc","fake-eu","fake-list"}) {
              if(abort_only&&std::string_view(preference)!="fake-list")continue;
          ''')
          replace(p,
          '''    const auto protected_tail_seconds=double(modem::transmit_stop_sample_count(stop_config))/stop_config.sample_rate;
              controller.activate(C::cancel);''',
          '''    const auto protected_tail_seconds=double(modem::transmit_stop_sample_count(stop_config))/stop_config.sample_rate;
              const auto diagnostic_request_started=std::chrono::steady_clock::now();
              const auto diagnostic_transmission_id=controller.snapshot().transmission_id;
              const auto diagnostic_snapshot=[&](const char* phase) {
                  if(!stop_diagnostic||!delayed_arrival)return;
                  const auto& s=controller.snapshot();
                  const auto& h=s.receiver_health;
          #if defined(__linux__)
                  const auto cpu=std::clock();
          #else
                  const auto cpu=std::clock_t(-1);
          #endif
                  audio::trace::record("diagnostic_stop_snapshot",[&](auto& f) {
                      f.add("phase",phase);f.add("preference",preference);
                      f.add("wall_since_request",std::chrono::duration<double>(
                          std::chrono::steady_clock::now()-diagnostic_request_started).count());
                      f.add("transmission_id",s.transmission_id);f.add("request_transmission_id",diagnostic_transmission_id);
                      f.add("transmission_seconds",s.transmission_seconds);f.add("virtual_seconds",s.virtual_seconds);
                      f.add("transmitting",s.transmitting);f.add("noise",s.transmitting_noise);
                      f.add("stopping",s.transmission_stopping);f.add("finished",s.transmission_finished);
                      f.add("transmission_failed",s.transmission_failed);
                      f.add("process_cpu_available",cpu!=std::clock_t(-1));
                      f.add("process_cpu_seconds",cpu!=std::clock_t(-1)?double(cpu)/CLOCKS_PER_SEC:0.);
                      f.add("receiver_bank_builds",s.receiver_bank_builds);
                      f.add("receiver_admissions",s.receiver_admissions);f.add("receiver_retirements",s.receiver_retirements);
                      f.add("receiver_instances",s.receiver_instances);f.add("input_revision",s.receiver_input_revision);
                      f.add("received_samples",s.samples_received);f.add("processed_physical_samples",s.processed_physical_samples);
                      f.add("queued_physical_samples",s.queued_physical_samples);
                      f.add("decoding_physical_samples",s.decoding_physical_samples);
                      f.add("receiver_failed",h.failed());f.add("dropped_samples",h.dropped_samples);
                      f.add("input_overruns",h.input_overruns);f.add("receiver_reset",h.receiver_reset);
                      f.add("input_interrupted",h.input_interrupted);f.add("search_limited",h.search_limited);
                      f.add("receiver_behind",s.receiver_behind);f.add("backlog_seconds",s.receiver_backlog_seconds);
                      f.add("oldest_input_seconds",s.receiver_oldest_input_seconds);
                      f.add("error",s.error.substr(0,256));f.add("receiver_error",s.receiver_error.substr(0,256));
                      f.add("status",s.status.substr(0,256));
                  });
              };
              diagnostic_snapshot("before_first_cancel");
              controller.activate(C::cancel);
              diagnostic_snapshot("after_first_cancel");''')
          replace(p, '    const auto source_at_deadline=controller.snapshot().transmission_seconds;\n',
          '''    const auto source_at_deadline=controller.snapshot().transmission_seconds;
              diagnostic_snapshot("ordinary_stop_window_end");
          ''')
          replace(p, '    const auto source_since_request=controller.snapshot().transmission_seconds-requested_source_seconds;\n',
          '''    const auto source_since_request=controller.snapshot().transmission_seconds-requested_source_seconds;
              diagnostic_snapshot("bounded_stop_window_end");
          ''')
          replace(p,
          """        controller.activate(C::cancel); // Preserve this fixture's immediate cancellation deadline.
          """,
          """        if(abort_only)audio::trace::record("diagnostic_immediate_abort_invoked",[&](auto& f) {
                      f.add("transmission_id",controller.snapshot().transmission_id);
                  });
                  controller.activate(C::cancel); // Preserve this fixture's immediate cancellation deadline.
          """)
          first = '    check(short_list||source_since_request<=source_allowance,\n'
          last = '    if(delayed_arrival) {\n        // Preview has a bounded sampled-work allowance.'
          i = changed[p].index(first)
          j = changed[p].index(last, i)
          strict = changed[p][i:j]
          catch = '''    } catch(const Error& strict_error) {
                  if(!stop_diagnostic||!delayed_arrival)throw;
                  const auto strict_failure=std::current_exception();
                  std::cout<<"GUI_STOP_STRICT_RESULT status=FAILED reason="<<std::quoted(strict_error.what())
                           <<" original_stop_wall_seconds="<<stop_wall_seconds<<std::endl;
                  try {
                  // Observation only: never retry/cancel or turn the original failure into a pass.
                  const auto observation_end=diagnostic_request_started+std::chrono::seconds(45);
                  auto next_observation=std::chrono::steady_clock::now();
                  unsigned observations=0;
                  while(controller.snapshot().transmitting&&std::chrono::steady_clock::now()<observation_end) {
                      controller.poll();
                      const auto now=std::chrono::steady_clock::now();
                      if(now>=next_observation&&observations<46) {
                          diagnostic_snapshot("post_failure_observation");
                          ++observations;next_observation=now+std::chrono::seconds(1);
                      }
                      std::this_thread::sleep_for(std::chrono::milliseconds(5));
                  }
                  const auto observation_finished=std::chrono::steady_clock::now();
                  diagnostic_snapshot("observation_end_before_cleanup");
                  const auto& s=controller.snapshot();
                  const auto& t=s.transmit_trace;
                  const bool same_id=s.transmission_id==diagnostic_transmission_id&&
                      arrival_transmission_id&&s.transmission_id==*arrival_transmission_id&&s.transmission_id!=prior_transmission_id;
                  const bool healthy=!s.transmission_failed&&s.error.empty()&&s.receiver_error.empty()&&
                      !s.receiver_health.failed()&&!s.receiver_health.dropped_samples;
                  const bool restored=!s.transmitting&&s.transmission_finished&&!s.transmission_stopping&&
                      controller.field(F::carrier).disabled_text.empty()&&controller.field(F::rf_shift).disabled_text.empty()&&
                      controller.field(F::carrier).text==carrier&&controller.field(F::rf_shift).text==shift&&
                      controller.field(F::fhss).display_text.find("Fake: hop ")==std::string::npos;
                  const bool traversed=same_id&&healthy&&t.fhss_available&&t.fhss_arrival_available&&
                      t.fhss_arrival_offset_seconds==2.564&&std::isfinite(s.transmission_seconds)&&
                      s.transmission_seconds>=t.fhss_arrival_offset_seconds;
                  const bool source_cap=std::isfinite(s.transmission_seconds)&&
                      s.transmission_seconds>=requested_source_seconds&&
                      s.transmission_seconds-requested_source_seconds<=source_allowance;
                  std::cout<<"GUI_STOP_OBSERVATION strict_result=FAILED same_id="<<same_id
                           <<" healthy="<<healthy<<" restored="<<restored<<" traversed="<<traversed
                           <<" source_cap="<<source_cap<<" source_since_request="
                           <<s.transmission_seconds-requested_source_seconds<<" source_allowance="<<source_allowance
                           <<" within_45_seconds="<<(observation_finished<=observation_end)
                           <<" wall_since_request="<<std::chrono::duration<double>(
                              observation_finished-diagnostic_request_started).count()<<std::endl;
                  // Cleanup only after the bounded observation, never evidence of natural EOF.
                  if(controller.snapshot().transmitting) {
                      controller.activate(C::cancel);
                      const auto abort_end=std::chrono::steady_clock::now()+std::chrono::seconds(5);
                      do {controller.poll();std::this_thread::sleep_for(std::chrono::milliseconds(5));}
                      while(controller.snapshot().transmitting&&std::chrono::steady_clock::now()<abort_end);
                      diagnostic_snapshot("post_45_second_cleanup_abort");
                  }
                  } catch(const std::exception& observation_error) {
                      std::cout<<"GUI_STOP_OBSERVATION_ERROR "<<std::quoted(observation_error.what())<<std::endl;
                  } catch(...) {
                      std::cout<<"GUI_STOP_OBSERVATION_ERROR unknown"<<std::endl;
                  }
                  std::rethrow_exception(strict_failure);
              }
          '''
          changed[p] = changed[p][:i] + '    try {\n' + strict + catch + '''    if(abort_only)audio::trace::record("diagnostic_immediate_abort_completed",[&](auto& f) {
                  f.add("transmission_id",controller.snapshot().transmission_id);
                  f.add("stop_wall_seconds",stop_wall_seconds);
                  f.add("stopped_within_deadline",stopped_within_deadline);
              });
          ''' + changed[p][j:]
          replace(p,
          '        if(argc>1&&std::string_view(argv[1])=="--fake-hop-display") {fake_hop_display();std::cout<<"Fake hop display passed\\n";return 0;}\n',
          '''        if(argc==4&&std::string_view(argv[1])=="--fake-hop-display"&&
                     (std::string_view(argv[2])=="--diagnose-stop"||std::string_view(argv[2])=="--diagnose-abort")) {
                      datapump::audio::trace::Scope trace(argv[3]);
                      const bool abort_only=std::string_view(argv[2])=="--diagnose-abort";
                      std::cout<<"GUI_STOP_VARIANT diagnostic_only=1 abort_only="<<abort_only<<std::endl;
                      fake_hop_display(!abort_only,abort_only);
                      std::cout<<"GUI_STOP_VARIANT completed; diagnostic only, not qualification\\n";return 0;
                  }
                  if(argc>1&&std::string_view(argv[1])=="--fake-hop-display") {fake_hop_display();std::cout<<"Fake hop display passed\\n";return 0;}
          ''')
          replace(p, '        fake_hop_display();\n',
          '''        if(argc==3&&std::string_view(argv[1])=="--diagnose-full-stop") {
                      datapump::audio::trace::Scope trace(argv[2]);
                      std::cout<<"GUI_STOP_VARIANT diagnostic_only=1 full_prefix=1"<<std::endl;
                      fake_hop_display(true,false);
                  } else fake_hop_display();
          ''')
          assert hashlib.sha256(changed["src/live.cpp"].encode()).hexdigest() == \
              "916092bdc052643b392209d78440c3c1a272a1abac1c79cc2c4ade27e30cef78"
          assert hashlib.sha256(changed["tests/test_gui_controller.cpp"].encode()).hexdigest() == \
              "18128942cdf3bf5f28a011a4d3f66aafda33c504a50eec5076bf5e23f2f66931"
          manifest = {p: {"pre_sha256": expected[p],
              "post_sha256": hashlib.sha256(changed[p].encode()).hexdigest()} for p in expected}
          patch = ''.join(''.join(difflib.unified_diff(
              original[p].splitlines(True), changed[p].splitlines(True),
              fromfile='a/'+p, tofile='b/'+p)) for p in expected)
          assert hashlib.sha256(patch.encode()).hexdigest() == \
              "0fa86a54f671d40364b8a5d453448191013c82b79b391193a135120737c6a2d9"
          print(json.dumps({"files": manifest,"patch_sha256":hashlib.sha256(patch.encode()).hexdigest(),
                            "patch_bytes":len(patch)}, indent=2))
          if os.environ.get("APPLY_GUI_STOP_VARIANT") == "1":
              assert os.environ.get("CI") == "true", "apply only in the isolated CI checkout"
              report = Path("build/gui-stop-diagnostic")
              report.mkdir(parents=True, exist_ok=True)
              (report/"source-variant.patch").write_text(patch)
              (report/"source-variant-manifest.json").write_text(json.dumps(manifest, indent=2)+"\n")
              for p in expected:
                  (report/("original-"+p.replace("/", "__"))).write_text(original[p])
                  Path(p).write_text(changed[p])

          assert os.environ.get('APPLY_GUI_STOP_VARIANT')=='1'
          actual=subprocess.check_output(git+['diff','--binary','HEAD','--'])
          (report/'actual-source-variant.patch').write_bytes(actual)
          names=subprocess.check_output(git+['diff','--name-only','HEAD','--'],text=True).splitlines()
          assert sorted(names)==sorted(expected), names
          for p in expected:
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==manifest[p]['post_sha256']
              (report/('variant-'+p.replace('/','__'))).write_bytes(Path(p).read_bytes())
          PY_STOP_PREPARE
      - name: Configure native application and selected test scope
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=gcc-11 -DCMAKE_CXX_COMPILER=g++-11
          -DCMAKE_BUILD_TYPE=${{ inputs.build_type }}
          -DDATAPUMP_SANITIZERS=${{ inputs.build_type == 'Debug' && 'ON' || 'OFF' }}
          -DDATAPUMP_PORTABLE=${{ inputs.build_type == 'Release' && 'ON' || 'OFF' }}
          -DBUILD_TESTING=${{ inputs.scope == 'package' && 'OFF' || 'ON' }}
          -DDATAPUMP_BUILD_TUI=${{ (inputs.scope == 'package' || inputs.scope == 'frontends') && 'ON' || 'OFF' }}
          -DDATAPUMP_BUILD_FB=${{ (inputs.scope == 'package' || inputs.scope == 'frontends') && 'ON' || 'OFF' }}
          -DDATAPUMP_BUILD_WEB_WORKER=${{ (inputs.scope == 'package' || inputs.scope == 'web') && 'ON' || 'OFF' }}
          -DDATAPUMP_CALIBRATION_SECTION=${{ inputs.calibration_section }}
          -DDATAPUMP_CALIBRATION_SHARD=${{ inputs.calibration_shard }}
          -DDART_TESTING_TIMEOUT=3600
          -DCMAKE_DISABLE_FIND_PACKAGE_Python3=${{ (inputs.scope == 'frontends' || inputs.scope == 'web') && 'FALSE' || 'TRUE' }}
      - name: Build this shard's prerequisites
        id: build_prerequisites
        if: inputs.scope != 'sched-hop-radius-control'
        run: |
          case "$CI_SCOPE" in
            calibration|calibration-aggregate) targets=(test_differential_receiver_probability) ;;
            package) targets=(datapump-apps) ;;
            frontends) targets=(datapump-tests-frontends) ;;
            web) targets=(datapump-tests-web) ;;
            preparation-diagnostic) targets=(test_scheduled_parallel_preparation) ;;
            gui-core-diagnostic) targets=(test_gui_timing_advice test_gui_controller) ;;
            gui-stop-diagnostic) targets=(test_gui_controller) ;;
            sanitizer-gui) targets=(datapump-apps test_gui_smoke_budget test_gui_launch_command) ;;
            core) targets=(datapump-apps datapump-tests-ci-core) ;;
            cli) targets=(pump) ;;
            eme-diagnostic) targets=(test_frequency_axis_probability) ;;
            alsa-diagnostic|alsa-radius-diagnostic) targets=(test_alsa_audio) ;;
            receiver) targets=(test_pattern_correlator test_pattern_drift test_receiver_differential test_clock_sync test_pattern_startup_guide) ;;
            startup-guide) targets=(test_pattern_startup_guide) ;;
            sched-hop-diagnostic) targets=(test_sched_hop_transmit test_sched_hop_receiver) ;;
            fast) targets=(datapump-tests-fast) ;;
            live) targets=(datapump-tests-ci-live) ;;
            *) echo "Unknown native scope: $CI_SCOPE" >&2; exit 2 ;;
          esac
          cmake --build build --target "${targets[@]}" --parallel "$(python3 -B tools/build_capacity.py)"
      - name: Run a one-constant former-radius scheduled-hop control
        if: inputs.scope == 'sched-hop-radius-control'
        timeout-minutes: 30
        run: |
          python3 -B - <<'PYCONTROL'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path.cwd(); report=root/'build/sched-hop-radius-control';report.mkdir()
          git=['git','-c','safe.directory='+str(root)]
          subprocess.run(git+['diff','--exit-code'],check=True)
          header=root/'include/datapump/pattern_pulse.hpp';original=header.read_bytes()
          assert hashlib.sha256(original).hexdigest()=='f3053ed41fa5cbca182ae4dcf5ff4796b030a3cb15527f617d7a765e7f989312'
          source_hashes={'tests/test_sched_hop_transmit.cpp':'18c1a2305c9bb1267c1c755c6f118cd631968b4666eb5d714b63ec0e881e773b',
              'tests/test_sched_hop_receiver.cpp':'995a6ed3f68080157b40b75314eca973a16f4d827c56ff5a881863ee07b11527'}
          for path,digest in source_hashes.items():assert hashlib.sha256((root/path).read_bytes()).hexdigest()==digest
          before=b'inline constexpr double pattern_pcm_radius_limit = .988;'
          assert original.count(before)==1
          changed=original.replace(before,b'inline constexpr double pattern_pcm_radius_limit = .992;')
          changed_hash=hashlib.sha256(changed).hexdigest()
          source=subprocess.check_output(git+['rev-parse','HEAD'],text=True).strip()
          (report/'original-pattern-pulse.hpp').write_bytes(original)
          assert not (root/'build/test_sched_hop_transmit').exists() and not (root/'build/test_sched_hop_receiver').exists()
          result={'source':source,'scope':'one-constant .992 diagnostic control of current code; not pre-feature baseline or current-radius qualification',
              'only_source_change':'pattern_pcm_radius_limit .988 -> .992','original_header_sha256':hashlib.sha256(original).hexdigest(),
              'control_header_sha256':changed_hash,'test_source_sha256':source_hashes}
          exit_code=1
          try:
              header.write_bytes(changed)
              (report/'control.patch').write_bytes(subprocess.check_output(git+['diff','--binary','--',str(header)]))
              jobs=subprocess.check_output(['python3','-B','tools/build_capacity.py'],text=True).strip()
              subprocess.run(['cmake','--build','build','--target','test_sched_hop_transmit','test_sched_hop_receiver','--parallel',jobs],check=True)
              result['binary_sha256']={name:hashlib.sha256((root/'build'/name).read_bytes()).hexdigest()
                  for name in ['test_sched_hop_transmit','test_sched_hop_receiver']}
              selector='^(sched_hop_transmit|sched_hop_receiver)$'
              with (report/'inventory.json').open('w') as inventory:
                  subprocess.run(['ctest','--test-dir','build','--show-only=json-v1','-R',selector],stdout=inventory,check=True)
              names=[test['name'] for test in json.loads((report/'inventory.json').read_text())['tests']]
              assert len(names)==2 and set(names)=={'sched_hop_transmit','sched_hop_receiver'},names
              with (report/'control.log').open('w') as log:
                  run=subprocess.run(['ctest','--test-dir','build','--output-on-failure','--no-tests=error','--parallel','1','--timeout','3600',
                      '--output-junit',str(report/'results.xml'),'-R',selector],stdout=log,stderr=subprocess.STDOUT)
              exit_code=run.returncode;result['test_exit']=exit_code
          finally:
              assert hashlib.sha256(header.read_bytes()).hexdigest()==changed_hash,'unexpected control-header mutation; preserve evidence'
              header.write_bytes(original)
              subprocess.run(git+['diff','--exit-code'],check=True)
              result['original_source_restored']=True
              (report/'result.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result),flush=True)
          raise SystemExit(exit_code)
          PYCONTROL
      - name: Diagnose one strict EME continuation capture without changing its gates
        if: inputs.scope == 'eme-diagnostic'
        timeout-minutes: 30
        run: |
          set -o pipefail
          git -c safe.directory="$PWD" rev-parse HEAD | tee build/eme-diagnostic-source.txt
          ./build/test_frequency_axis_probability --strict-end 128 30 3 3 2>&1 | tee build/eme-diagnostic.log
          echo 'One paired strict capture: exact content, immutable pending identity, backend parity and independent physical end are required. Full regression and calibration remain separate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Measure original V1 reconstruction before its unchanged strict gate
        if: inputs.scope == 'alsa-diagnostic'
        timeout-minutes: 30
        run: |
          set -o pipefail
