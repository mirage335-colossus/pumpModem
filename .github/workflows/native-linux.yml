      - name: Run the original no-argument Symbol Burst Live qualification test
        if: inputs.scope == 'symbol-burst-live' && !inputs.paced_callback_focus && !inputs.paced_mutex_focus && !inputs.paced_snapshot_focus && !cancelled() && steps.build_prerequisites.outcome == 'success'
        timeout-minutes: 125
        run: |
          set -uo pipefail
          report="$PWD/build/symbol-burst-live-qualification"
          selector='^(symbol_burst_live)$'
          command=(ctest --test-dir build --output-on-failure --verbose --no-tests=error --parallel 1 --timeout 7200 --output-junit "$report/results.xml" -R "$selector")
          printf '%s\n' "${command[@]}" > "$report/ctest-command.txt"
          started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          started=$(date +%s)
          "${command[@]}" > "$report/ctest.log" 2>&1
          ctest_exit=$?
          ended_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          elapsed=$(($(date +%s) - started))
          cp build/Testing/Temporary/LastTest.log "$report/LastTest.log"
          python3 -B - "$PWD" "$report" "$ctest_exit" "$started_utc" "$ended_utc" "$elapsed" <<'PY_BURST_RESULT'
          import hashlib, json, pathlib, sys, xml.etree.ElementTree as ET

          root, report = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          ctest_exit = int(sys.argv[3])
          output = (report / 'ctest.log').read_text(errors='replace')
          junit = ET.parse(report / 'results.xml').getroot()
          cases = junit.findall('.//testcase')
          failures, errors, skipped = junit.findall('.//failure'), junit.findall('.//error'), junit.findall('.//skipped')
          marker = 'Symbol_Burst Live integration passed' in output
          workload_budget_lines = [
              line[line.index('TEST_WORKLOAD_BUDGET:'):].strip()
              for line in output.splitlines() if 'TEST_WORKLOAD_BUDGET:' in line
          ]
          checks = {
              'ctest_exit_zero': ctest_exit == 0,
              'one_original_case': len(cases) == 1 and [case.get('name') for case in cases] == ['symbol_burst_live'],
              'no_junit_failures_errors_or_skips': not failures and not errors and not skipped,
              'original_success_marker': marker,
          }
          passed = all(checks.values())
          completed_pass_warnings = workload_budget_lines if passed else []
          run = {
              'source_commit': (report / 'source.txt').read_text().strip(),
              'source_tree': (report / 'source-tree.txt').read_text().strip(),
              'scope': 'symbol-burst-live',
              'test': 'symbol_burst_live',
              'test_target': 'test_symbol_burst_live',
              'test_command': [str(root / 'build/test_symbol_burst_live')],
              'ctest_command': ['ctest', '--test-dir', 'build', '--output-on-failure', '--verbose',
                  '--no-tests=error', '--parallel', '1', '--timeout', '7200', '--output-junit',
                  str(report / 'results.xml'), '-R', '^(symbol_burst_live)$'],
              'ctest_exit': ctest_exit,
              'started_utc': sys.argv[4], 'ended_utc': sys.argv[5], 'elapsed_seconds': int(sys.argv[6]),
              'test_count': len(cases), 'test_names': [case.get('name') for case in cases],
              'failures': len(failures), 'errors': len(errors), 'skipped': len(skipped),
              'success_marker_present': marker,
              'completed_pass_workload_budget_warnings': completed_pass_warnings,
              'checks': checks,
              'result': 'PASS' if passed else 'FATAL',
              'ctest_output_sha256': hashlib.sha256((report / 'ctest.log').read_bytes()).hexdigest(),
              'junit_sha256': hashlib.sha256((report / 'results.xml').read_bytes()).hexdigest(),
              'last_test_sha256': hashlib.sha256((report / 'LastTest.log').read_bytes()).hexdigest(),
              'cmake_cache_sha256': hashlib.sha256((report / 'CMakeCache.txt').read_bytes()).hexdigest(),
              'binary_sha256': hashlib.sha256((root / 'build/test_symbol_burst_live').read_bytes()).hexdigest(),
          }
          (report / 'run.json').write_text(json.dumps(run, indent=2) + '\n')
          summary = pathlib.Path(__import__('os').environ['GITHUB_STEP_SUMMARY'])
          if passed:
              message = 'Original no-argument `symbol_burst_live` completed and passed all assertions.\n'
              if completed_pass_warnings:
                  message += '\nCompleted-pass `TEST_WORKLOAD_BUDGET` warnings:\n'
                  message += ''.join(f'- `{warning}`\n' for warning in completed_pass_warnings)
          else:
              message = 'FATAL: original no-argument `symbol_burst_live` did not complete successfully; see retained CTest/JUnit/LastTest evidence.\n'
          with summary.open('a') as stream:
              stream.write(message)
          if not passed:
              raise SystemExit(f'FATAL: Symbol Burst Live qualification checks failed: {checks}')
          print('Original no-argument Symbol Burst Live test completed with all assertions.')
          for warning in completed_pass_warnings:
              print('Completed-pass warning: ' + warning)
          PY_BURST_RESULT
