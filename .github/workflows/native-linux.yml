name: Native Linux validation shard
'on':
  workflow_dispatch:
    inputs:
      linux_runner:
        description: Linux x86_64 runner for this validation shard
        type: choice
        options:
        - ubuntu-24.04
        - ubuntu-latest-m
        - ubuntu-latest-l
        - ubuntu-latest-h
        default: ubuntu-24.04
      build_type:
        description: Debug includes ASan and UBSan
        type: choice
        options:
        - Release
        - Debug
        default: Release
      scope:
        description: Select the retained application test or package scope
        type: choice
        options:
        - core
        - fast
        - legacy
        - frontends
        - web
        - gui
        - package
        default: core
      sanitizer_realtime:
        description: Include real-time Fast RX checks in instrumented Debug coverage
        type: boolean
        default: false
  workflow_call:
    inputs:
      linux_runner:
        type: string
        default: ubuntu-24.04
      build_type:
        type: string
        default: Release
      scope:
        description: Select the retained application test or package scope
        type: string
        required: true
      sanitizer_realtime:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    name: Linux ${{ inputs.build_type }} / ${{ inputs.scope }}
    runs-on: ${{ inputs.linux_runner }}
    container: ubuntu:22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      DATAPUMP_SMOKE_TARGET: linux-x86_64-fltk
      DATAPUMP_SMOKE_SCOPE: source/native
      DATAPUMP_SMOKE_SOURCE_SHA: ${{ github.sha }}
      DATAPUMP_SMOKE_INVENTORY_SHA256: ''
      DEBIAN_FRONTEND: noninteractive
      CI_APT_DOWNLOAD_TIMEOUT: '180'
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      CC: gcc-11
      CXX: g++-11
      CI_SCOPE: ${{ inputs.scope }}
      DATAPUMP_SANITIZERS: ${{ inputs.build_type == 'Debug' && 'ON' || 'OFF' }}
      SANITIZER_REALTIME: ${{ inputs.sanitizer_realtime }}
    steps:
    - name: Validate manual package configuration
      if: github.event_name == 'workflow_dispatch' && inputs.scope == 'package' && inputs.build_type != 'Release'
      run: |
        echo '::error::The package scope requires build_type=Release.'
        exit 2
    - name: Load current package-fetch helper before installing Git
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        path: .ci-bootstrap
        sparse-checkout: tools/ci-apt.sh
        sparse-checkout-cone-mode: false
    - name: Prepare build dependencies
      run: |
        cp .ci-bootstrap/tools/ci-apt.sh "$RUNNER_TEMP/ci-apt.sh"
        sh "$RUNNER_TEMP/ci-apt.sh" install ca-certificates curl git cmake ninja-build make g++-11 binutils libssl-dev libasound2-dev libx11-dev libxft-dev libxext-dev libxrender-dev libxcursor-dev libxfixes-dev libxinerama-dev libncurses-dev libsdl2-dev xvfb xauth fontconfig-config fonts-dejavu-core python3
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set container-local smoke evidence paths
      run: |
        printf 'DATAPUMP_CI_SMOKE_WARNINGS_DIR=%s/build/ci-smoke-results\n' "$PWD" >> "$GITHUB_ENV"
        printf 'DATAPUMP_CI_SMOKE_RUNNER=%s/tools/run-gui-smoke.py\n' "$PWD" >> "$GITHUB_ENV"
    - name: Install the pinned dependency scanner
      run: |
        sh tools/install-release-cmake.sh "$GITHUB_WORKSPACE/build/ci-cmake"
        echo "$GITHUB_WORKSPACE/build/ci-cmake/bin" >> "$GITHUB_PATH"
    - name: Prepare the pinned CPU framebuffer host
      if: inputs.scope == 'package' || inputs.scope == 'frontends'
      run: |
        python3 -B tools/prepare-native-sdl.py "$GITHUB_WORKSPACE/build/native-sdl" --cc gcc-11 --cxx g++-11 --jobs "$(python3 -B tools/build_capacity.py)"
        echo "DATAPUMP_NATIVE_SDL_ROOT=$GITHUB_WORKSPACE/build/native-sdl/install" >> "$GITHUB_ENV"
    - name: Prepare the JavaScript test host
      if: inputs.scope == 'web'
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 24.19.0
    - name: Configure the retained native scope
      run: |
        ./build.sh configure --build-dir build --jobs 2 -- -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} -DDATAPUMP_SANITIZERS="$DATAPUMP_SANITIZERS" -DDATAPUMP_PORTABLE=${{ inputs.build_type == 'Release' && 'ON' || 'OFF' }} -DBUILD_TESTING=${{ inputs.scope == 'package' && 'OFF' || 'ON' }} -DDATAPUMP_BUILD_TUI=${{ (inputs.scope == 'package' || inputs.scope == 'frontends') && 'ON' || 'OFF' }} -DDATAPUMP_BUILD_FB=${{ (inputs.scope == 'package' || inputs.scope == 'frontends') && 'ON' || 'OFF' }} -DDATAPUMP_BUILD_WEB_WORKER=${{ (inputs.scope == 'package' || inputs.scope == 'web') && 'ON' || 'OFF' }}
    - name: Build scope prerequisites
      run: |
        case "$CI_SCOPE" in
          package) target=datapump-apps ;;
          core) target=datapump-tests-regular ;;
          fast|legacy|frontends|web|gui) target=datapump-tests-$CI_SCOPE ;;
          *) echo "Unknown native scope: $CI_SCOPE" >&2; exit 2 ;;
        esac
        cmake --build build --target "$target" --parallel "$(python3 -B tools/build_capacity.py)"
    - name: Run the selected native tests
      if: inputs.scope != 'package'
      run: |
        options=()
        if [ "$DATAPUMP_SANITIZERS" = ON ]; then options+=(--sanitizers); fi
        if [ "$SANITIZER_REALTIME" = true ]; then options+=(--sanitizer-realtime); fi
        python3 tools/run-ci-tests.py --build-dir build --scope "$CI_SCOPE" --jobs 2 --timeout 1800 "${options[@]}" --report build/ci-test-report.json
    - name: Exercise native desktop workflow
      if: inputs.scope == 'package'
      run: |
        xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' python3 tools/run-gui-smoke.py --report "$DATAPUMP_CI_SMOKE_WARNINGS_DIR/source-gui.json" --log "build/gui-smoke-${{ inputs.build_type }}-${{ github.run_attempt }}.log" --summary "$GITHUB_STEP_SUMMARY" -- ./build/datapump-gui --smoke-test --smoke-timeout 600
    - name: Verify relocated native GUI and package inventory
      if: inputs.scope == 'package'
      env:
        DATAPUMP_SMOKE_SCOPE: published/relocation
      run: |
        xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' cmake -DBUILD_DIR="$PWD/build" -DCONFIG=Release -DGUI_SMOKE=ON -DGUI_SMOKE_TIMEOUT=600 -P tests/package_native.cmake 2>&1 | tee build/package-relocation.log
    - name: Create and verify both native archives
      if: inputs.scope == 'package'
      env:
        DATAPUMP_SMOKE_SCOPE: published/native-archives
      run: |
        cmake --build build --target package --parallel "$(python3 -B tools/build_capacity.py)"
        xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' cmake -DARCHIVE_DIR="$PWD/build/releases" -DBUILD_DIR="$PWD/build" -DGUI_SMOKE=ON -DGUI_SMOKE_TIMEOUT=600 -DMAX_GLIBC=2.35 -DREQUIRE_MANUALS=ON -DREQUIRE_FRONTENDS=ON -P tools/verify-native-archives.cmake 2>&1 | tee build/package-archives.log
        echo 'Portable Release desktop, relocation, corruption, both archive formats and ABI checks completed; any incomplete smoke coverage is listed in the retained reports. Independent regression jobs still determine the overall workflow result.' >> "$GITHUB_STEP_SUMMARY"
    - name: Upload Linux offline bundles
      if: inputs.scope == 'package'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: DataPump-Linux-x86_64-glibc-2.35
        path: |
          build/releases/*.tar.gz
          build/releases/*.zip
          build/releases/SHA256SUMS.txt
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
    - name: Retain test and package logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: CI-Linux-${{ inputs.build_type }}-${{ inputs.scope }}-attempt-${{ github.run_attempt }}
        path: |
          build/ci-test-report.*
          build/Testing/Temporary/
          build/package-*.log
          build/ci-smoke-results/
        if-no-files-found: warn
        retention-days: 7
