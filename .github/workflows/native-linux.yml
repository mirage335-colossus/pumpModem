          p = "tests/test_gui_controller.cpp"
          assert hashlib.sha256(Path("src/scheduled_work_profile.hpp").read_bytes()).hexdigest() == "87a701a4ed853685e4250805a8665fdd0f10b15347ab0f4f8be1fcc8148b7acf"
          replace(p, '#include "../src/audio_trace.hpp"\n',
