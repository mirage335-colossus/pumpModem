name: Native Linux validation shard

on:
  workflow_call:
    inputs:
      linux_runner:
        type: string
        default: ubuntu-latest-h
      build_type:
        type: string
        default: Release
      scope:
        description: 'core, fast, live, calibration, calibration-aggregate, package, or sanitizer-gui'
        type: string
        required: true
      calibration_section:
        type: string
        default: all
      calibration_shard:
        description: 'Optional shaped capture part: 0 or 1; requires the separate aggregate job'
        type: string
        default: ''
      sanitizer_realtime:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    name: Linux ${{ inputs.build_type }} / ${{ inputs.scope }} / ${{ inputs.calibration_section }}${{ inputs.calibration_shard != '' && format(' / part {0}', inputs.calibration_shard) || '' }}
    runs-on: ${{ inputs.linux_runner }}
    # Preserve the portable application's glibc 2.35 baseline in every shard.
    container: ubuntu:22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      DATAPUMP_CI_SMOKE_WARNINGS_DIR: ${{ github.workspace }}/build/ci-smoke-results
      DATAPUMP_CI_SMOKE_RUNNER: ${{ github.workspace }}/tools/run-gui-smoke.py
      DATAPUMP_SMOKE_TARGET: linux-x86_64-fltk
      DATAPUMP_SMOKE_SCOPE: source/native
      DATAPUMP_SMOKE_SOURCE_SHA: ${{ github.sha }}
      DATAPUMP_SMOKE_INVENTORY_SHA256: ''
      DEBIAN_FRONTEND: noninteractive
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      CC: gcc-11
      CXX: g++-11
      CI_SCOPE: ${{ inputs.scope }}
      DATAPUMP_SANITIZERS: ${{ inputs.build_type == 'Debug' && 'ON' || 'OFF' }}
      SANITIZER_REALTIME: ${{ inputs.sanitizer_realtime }}
    steps:
      - name: Load current package-fetch helper before installing Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .ci-bootstrap
          sparse-checkout: tools/ci-apt.sh
          sparse-checkout-cone-mode: false
      - name: Prepare build dependencies
        run: |
          cp .ci-bootstrap/tools/ci-apt.sh "$RUNNER_TEMP/ci-apt.sh"
          sh "$RUNNER_TEMP/ci-apt.sh" install ca-certificates curl git cmake ninja-build make g++-11 binutils libssl-dev libasound2-dev libx11-dev libxft-dev libxext-dev libxrender-dev libxcursor-dev libxfixes-dev libxinerama-dev xvfb xauth fontconfig-config fonts-dejavu-core python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned dependency scanner
        run: |
          sh tools/install-release-cmake.sh "$GITHUB_WORKSPACE/build/ci-cmake"
          echo "$GITHUB_WORKSPACE/build/ci-cmake/bin" >> "$GITHUB_PATH"
      - name: Configure native application without Python
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=gcc-11 -DCMAKE_CXX_COMPILER=g++-11
          -DCMAKE_BUILD_TYPE=${{ inputs.build_type }}
          -DDATAPUMP_SANITIZERS=${{ inputs.build_type == 'Debug' && 'ON' || 'OFF' }}
          -DDATAPUMP_PORTABLE=${{ inputs.build_type == 'Release' && 'ON' || 'OFF' }}
          -DBUILD_TESTING=${{ inputs.scope == 'package' && 'OFF' || 'ON' }}
          -DDATAPUMP_CALIBRATION_SECTION=${{ inputs.calibration_section }}
          -DDATAPUMP_CALIBRATION_SHARD=${{ inputs.calibration_shard }}
          -DDART_TESTING_TIMEOUT=3600
          -DCMAKE_DISABLE_FIND_PACKAGE_Python3=TRUE
      - name: Build this shard's prerequisites
        run: |
          case "$CI_SCOPE" in
            calibration|calibration-aggregate) targets=(test_differential_receiver_probability) ;;
            package) targets=(datapump-apps) ;;
            sanitizer-gui) targets=(datapump-apps test_gui_smoke_budget test_gui_launch_command) ;;
            core) targets=(datapump-apps datapump-tests-ci-core) ;;
            fast) targets=(datapump-tests-fast) ;;
            live) targets=(datapump-tests-ci-live) ;;
            *) echo "Unknown native scope: $CI_SCOPE" >&2; exit 2 ;;
          esac
          cmake --build build --target "${targets[@]}" --parallel "$(nproc)"
      - name: Run the selected native tests
        if: inputs.scope == 'core' || inputs.scope == 'fast' || inputs.scope == 'live' || inputs.scope == 'calibration'
        run: |
          options=()
          if [ "$DATAPUMP_SANITIZERS" = ON ]; then
            options+=(--sanitizers)
          fi
          if [ "$SANITIZER_REALTIME" = true ]; then
            options+=(--sanitizer-realtime)
          fi
          jobs=2
          if [ "$CI_SCOPE" = live ]; then jobs=1; fi
          python3 tools/run-ci-tests.py --build-dir build --scope "$CI_SCOPE" --jobs "$jobs" --report build/ci-test-report.json "${options[@]}"
      - name: Record partial capture scope
        if: inputs.calibration_shard != ''
        run: |
          echo 'This job completed half of the fixed shaped captures. It is not full calibration qualification: the required aggregate job checks complete seed coverage and the original per-case and joined statistical assertions.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the completed capture part for required aggregation
        if: inputs.calibration_shard != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Stable within this exact-source run, so rerunning only a failed
          # part can reuse its successful sibling from an earlier attempt.
          name: Shaped-Debug-captures-part-${{ inputs.calibration_shard }}
          path: build/shaped-result.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Download shaped capture part zero
        if: inputs.scope == 'calibration-aggregate'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Shaped-Debug-captures-part-0
          path: build/calibration-results/0
      - name: Download shaped capture part one
        if: inputs.scope == 'calibration-aggregate'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Shaped-Debug-captures-part-1
          path: build/calibration-results/1
      - name: Require every shaped capture and the unchanged aggregate assertions
        if: inputs.scope == 'calibration-aggregate'
        timeout-minutes: 5
        run: |
          ./build/test_differential_receiver_probability --aggregate-shaped build/calibration-results/0/shaped-result.txt build/calibration-results/1/shaped-result.txt 2>&1 | tee build/calibration-aggregate.log
          echo 'All 64 original seeds for each shaped case are present exactly once. The original per-case probability and combined RMS assertions passed using the instrumented capture results.' >> "$GITHUB_STEP_SUMMARY"
      - name: Record separate instrumented desktop coverage
        if: always() && inputs.scope == 'core' && inputs.build_type == 'Debug'
        run: |
          echo '::notice::Instrumented desktop smoke is a separate opt-in job. Its omission is not a smoke pass; Release/package desktop workflows remain required.'
          echo 'Instrumented desktop smoke is outside this regression shard. Select sanitizer_smoke=true or the focused sanitizer-gui diagnostic to run it. Omitted instrumented desktop coverage is not a pass.' >> "$GITHUB_STEP_SUMMARY"
      - name: Check the focused smoke budget policy
        if: inputs.scope == 'sanitizer-gui'
        run: |
          python3 tests/test_gui_smoke_runner.py
          ctest --test-dir build --output-on-failure --no-tests=error -R '^(gui_smoke_budget|gui_launch_command)$'
          echo 'Focused instrumented GUI workflow and budget-policy checks only; no general regression or calibration is claimed by this job.' >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise native desktop workflow
        if: inputs.scope == 'package' || inputs.scope == 'sanitizer-gui'
        run: |
          xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' python3 tools/run-gui-smoke.py --allow-budget-exhaustion --report "$DATAPUMP_CI_SMOKE_WARNINGS_DIR/source-gui.json" --log "build/gui-smoke-${{ inputs.build_type }}-${{ github.run_attempt }}.log" --summary "$GITHUB_STEP_SUMMARY" -- ./build/datapump-gui --smoke-test --smoke-timeout 600
      - name: Developer CLI regressions (Python is not packaged)
        if: inputs.scope == 'core'
        run: python3 tests/test_cli.py build/pump
      - name: Verify relocated native GUI and package inventory
        if: inputs.scope == 'package'
        env:
          DATAPUMP_SMOKE_SCOPE: published/relocation
        run: |
          xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' cmake -DBUILD_DIR="$PWD/build" -DCONFIG=Release -DGUI_SMOKE=ON -DGUI_SMOKE_TIMEOUT=600 -P tests/package_native.cmake 2>&1 | tee build/package-relocation.log
      - name: Create and verify both native archives
        if: inputs.scope == 'package'
        env:
          DATAPUMP_SMOKE_SCOPE: published/native-archives
        run: |
          cmake --build build --target package --parallel "$(nproc)"
          xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' cmake -DARCHIVE_DIR="$PWD/build/releases" -DBUILD_DIR="$PWD/build" -DGUI_SMOKE=ON -DGUI_SMOKE_TIMEOUT=600 -DMAX_GLIBC=2.35 -DREQUIRE_MANUALS=ON -P tools/verify-native-archives.cmake 2>&1 | tee build/package-archives.log
          echo 'Portable Release desktop, relocation, corruption, both archive formats and ABI checks completed; any incomplete smoke coverage is listed in the retained reports. Independent regression/calibration jobs still determine the overall workflow result.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Linux offline bundles
        if: inputs.scope == 'package'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DataPump-Linux-x86_64-glibc-2.35
          path: |
            build/releases/*.tar.gz
            build/releases/*.zip
            build/releases/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Retain shard reports and failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CI-Linux-${{ inputs.build_type }}-${{ inputs.scope }}-${{ inputs.calibration_section }}${{ inputs.calibration_shard != '' && format('-part-{0}', inputs.calibration_shard) || '' }}-attempt-${{ github.run_attempt }}
          path: |
            build/ci-test-report.*
            build/Testing/Temporary/
            build/gui-smoke-*.log
            build/package-*.log
            build/shaped-result.txt
            build/calibration-aggregate.log
            ${{ github.workspace }}/build/ci-smoke-results/
          if-no-files-found: warn
          retention-days: 7
