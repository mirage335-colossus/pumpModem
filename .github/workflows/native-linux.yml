      - name: Prepare the matched stop differential source variant
        if: inputs.scope == 'gui-stop-differential'
        run: |
          git -c safe.directory="$PWD" fetch --no-tags --depth=1 origin 789fb91e351f9c2ecd3ef72b9881f74d7a4796fd
          python3 -B tools/gui-stop-differential.py prepare --root "$PWD" --report "$PWD/build/stop-differential" --group "$CI_STOP_GROUP"
      - name: Prepare isolated raw chain score source
        if: inputs.scope == 'simulation-clock-chain-score-diagnostic'
        run: |
          python3 -B - <<'PY_RAW_CHAIN_PREPARE'
          from pathlib import Path
          import hashlib, json, shutil, subprocess, tarfile
          root = Path.cwd().resolve()
          source = root / "build/raw-chain-source"
          source.mkdir(parents=True, exist_ok=False)
          archive = root / "build/raw-chain-source.tar"
          with archive.open("xb") as output:
              subprocess.run(["git", "-c", "safe.directory=" + str(root), "archive", "HEAD"],
                             cwd=root, stdout=output, check=True)
          with tarfile.open(archive) as captured:
              for member in captured.getmembers():
                  path = Path(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise ValueError("unsafe isolated source archive member")
                  if member.issym() or member.islnk():
                      target = (source / path.parent / member.linkname).resolve()
                      if not target.is_relative_to(source):
                          raise ValueError("isolated source archive link escapes source")
              captured.extractall(source)
          evidence = root / "build/simulation-clock-trace-diagnostics/overlay-evidence"
          subprocess.run(["python3", "-B", str(root / "tools/raw-chain-score-diagnostic/prepare.py"),
                          "--source-root", str(source), "--output-dir", str(evidence)], check=True)
          for name in ("pattern_receiver.cpp", "raw_chain_score_probe.hpp"):
              shutil.copyfile(evidence / name, source / "src" / name)
          (evidence / "source-archive.json").write_text(json.dumps({
              "launcher_source_commit": subprocess.check_output([
                  "git", "-c", "safe.directory=" + str(root), "rev-parse", "HEAD"], text=True).strip(),
              "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "compiled_source_directory": str(source),
              "classification": "private reversible diagnostic overlay; not qualification"
          }, indent=2) + "\n")
          PY_RAW_CHAIN_PREPARE
