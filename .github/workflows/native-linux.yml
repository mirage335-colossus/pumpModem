      - name: Run focused preparation or GUI core diagnostics
        if: (success() && (inputs.scope == 'preparation-diagnostic' || inputs.scope == 'gui-core-diagnostic')) || (inputs.scope == 'symbol-burst-live' && inputs.paced_backlog && !inputs.paced_callback_focus && !inputs.paced_mutex_focus && !inputs.paced_snapshot_focus && !inputs.paced_context_focus && !cancelled() && steps.build_prerequisites.outcome == 'success')
        run: |
          set -euo pipefail
          report="$PWD/build/core-diagnostics"
          mkdir -p "$report"
          git -c safe.directory="$PWD" rev-parse HEAD > "$report/source.txt"

          if [ "$CI_SCOPE" = preparation-diagnostic ]; then
            selector='^scheduled_parallel_preparation$'
            inventory="$report/preparation-inventory.json"
            expected='{"scheduled_parallel_preparation":"test_scheduled_parallel_preparation"}'
          else
            focus_selector='^(search_fft|pattern_fft_batch)$'
            focus_inventory="$report/fft-inventory.json"
            focus_expected='{"search_fft":"test_search_fft","pattern_fft_batch":"test_pattern_fft_batch"}'
            selector='^(gui_timing_advice|gui_controller)$'
            inventory="$report/gui-inventory.json"
            expected='{"gui_timing_advice":"test_gui_timing_advice","gui_controller":"test_gui_controller"}'
          fi

          if [ "$CI_SCOPE" != preparation-diagnostic ]; then
            ctest --test-dir build --show-only=json-v1 -R "$focus_selector" > "$focus_inventory"
            python3 - "$focus_inventory" "$focus_expected" <<'PY_FFT_INVENTORY'
          import json
          import pathlib
          import sys

          inventory = json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected = json.loads(sys.argv[2])
          tests = inventory.get("tests", [])
          names = [test.get("name") for test in tests]
          assert len(names) == len(expected), f"wrong inventory count: {names}"
          assert len(set(names)) == len(expected), f"duplicate inventory names: {names}"
          assert set(names) == set(expected), f"wrong inventory names: {names}"
          for test in tests:
              command = test.get("command")
              assert isinstance(command, list) and len(command) == 1, (
                  f"test command must contain only its executable: {test}"
              )
              assert pathlib.Path(command[0]).name == expected[test["name"]], (
                  f"unexpected executable or test arguments: {test}"
              )
          PY_FFT_INVENTORY
            if ctest --test-dir build --output-on-failure --no-tests=error \
              --parallel 1 --timeout 7200 \
              --output-junit "$report/fft-results.xml" -R "$focus_selector" \
              > "$report/fft.log" 2>&1; then
              focus_status=0
            else
              focus_status=$?
            fi
            cp build/Testing/Temporary/LastTest.log "$report/fft-LastTest.log"
            if [ "$focus_status" -ne 0 ]; then
              exit "$focus_status"
            fi
          fi

          ctest --test-dir build --show-only=json-v1 -R "$selector" > "$inventory"
          python3 - "$inventory" "$expected" <<'PY'
          import json
          import pathlib
          import sys

          inventory = json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected = json.loads(sys.argv[2])
          tests = inventory.get("tests", [])
          names = [test.get("name") for test in tests]
          assert len(names) == len(expected), f"wrong inventory count: {names}"
          assert len(set(names)) == len(expected), f"duplicate inventory names: {names}"
          assert set(names) == set(expected), f"wrong inventory names: {names}"
          for test in tests:
              command = test.get("command")
              assert isinstance(command, list) and len(command) == 1, (
                  f"test command must contain only its executable: {test}"
              )
              assert pathlib.Path(command[0]).name == expected[test["name"]], (
                  f"unexpected executable or test arguments: {test}"
              )
          PY

          if [ "$CI_SCOPE" = preparation-diagnostic ]; then
            ctest --test-dir build --output-on-failure --no-tests=error \
              --parallel 1 --timeout 7200 \
              --output-junit "$report/preparation-results.xml" -R "$selector" \
              > "$report/preparation.log" 2>&1
            echo 'Focused scheduled parallel preparation diagnostic completed. This is not full native matrix qualification.' >> "$GITHUB_STEP_SUMMARY"
          else
            ctest --test-dir build --output-on-failure --no-tests=error \
              --parallel 1 --timeout 7200 \
              --output-junit "$report/gui-serial-results.xml" -R "$selector" \
              > "$report/gui-serial.log" 2>&1
            cp build/Testing/Temporary/LastTest.log "$report/gui-serial-LastTest.log"
            ctest --test-dir build --output-on-failure --no-tests=error \
              --parallel 2 --timeout 7200 \
              --output-junit "$report/gui-parallel-results.xml" -R "$selector" \
              > "$report/gui-parallel.log" 2>&1
            cp build/Testing/Temporary/LastTest.log "$report/gui-parallel-LastTest.log"
            echo 'Focused GUI core diagnostic completed serially and in parallel. This is not full native matrix qualification.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Mark paced original-context omissions
        if: always() && inputs.paced_context_focus
        run: echo 'The original-context route requires successful original storage unit checks and no-argument qualification, followed by all nine paced selectors in order; the optional callback probe applies only to selector nine. Temporal/FFT component reruns, focused FFT plus GUI serial/parallel reruns, and the standalone matched callback comparison are omitted in this route and are not passes. Per-step results identify which required prefix checks ran and passed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Capture matched held keyed-On callback timing
        if: inputs.paced_callback_probe && inputs.scope == 'symbol-burst-live' && inputs.paced_backlog && !inputs.paced_context_focus && !cancelled() && steps.build_prerequisites.outcome == 'success'
        timeout-minutes: 45
        env:
          PACED_MUTEX_FOCUS: ${{ inputs.paced_mutex_focus }}
          PACED_SNAPSHOT_FOCUS: ${{ inputs.paced_snapshot_focus }}
          PACED_CALLBACK_FOCUS: ${{ inputs.paced_callback_focus }}
        run: |
          python3 -B - "$PWD" <<'PY_CALLBACK_PROBE'
          import datetime, hashlib, json, os, pathlib, signal, subprocess, sys, time

          root = pathlib.Path(sys.argv[1]).resolve()
          parent = root / 'build/symbol-burst-live-qualification'
          report = parent / 'callback-probe'
          report.mkdir(parents=True, exist_ok=True)
          binary = root / 'build/test_symbol_burst_live'
          identity = {
              'source_commit': (parent / 'source.txt').read_text().strip(),
              'source_tree': (parent / 'source-tree.txt').read_text().strip(),
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
              'test_source_sha256': hashlib.sha256((root / 'tests/test_symbol_burst_live.cpp').read_bytes()).hexdigest(),
              'probe_source_sha256': hashlib.sha256((root / 'tests/paced_capture_probe.hpp').read_bytes()).hexdigest(),
              'mutex_probe_source_sha256': hashlib.sha256((root / 'src/live_mutex_probe.hpp').read_bytes()).hexdigest() if os.environ.get('PACED_MUTEX_FOCUS') == 'true' else None,
              'cache_sha256': hashlib.sha256((root / 'build/CMakeCache.txt').read_bytes()).hexdigest(),
              'snapshot_probe_source_sha256': hashlib.sha256((root / 'src/live_snapshot_probe.hpp').read_bytes()).hexdigest() if os.environ.get('PACED_SNAPSHOT_FOCUS') == 'true' else None,
              'os_sampler_source_sha256': hashlib.sha256((root / 'tests/snapshot_holder_os_probe.hpp').read_bytes()).hexdigest(),
              'live_source_sha256': hashlib.sha256((root / 'src/live.cpp').read_bytes()).hexdigest(),
              'monitor_source_sha256': hashlib.sha256((root / 'src/live_capture_monitor_probe.hpp').read_bytes()).hexdigest(),
              'signal_view_source_sha256': hashlib.sha256((root / 'src/signal_view.cpp').read_bytes()).hexdigest(),
              'comparison': 'sequential matched baseline/probe pairs; same binary, selector, PCM and original pacing bound',
              'qualification': False,
              'diagnostic_route': 'paced-plain-callback-focus' if os.environ.get('PACED_CALLBACK_FOCUS') == 'true' else 'paced-snapshot-focus' if os.environ.get('PACED_SNAPSHOT_FOCUS') == 'true' else 'paced-mutex-focus' if os.environ.get('PACED_MUTEX_FOCUS') == 'true' else 'paced-callback-probe',
          }
          results = []
          focus = os.environ.get('PACED_MUTEX_FOCUS') == 'true'
          snapshot_focus = os.environ.get('PACED_SNAPSHOT_FOCUS') == 'true'
          callback_focus = os.environ.get('PACED_CALLBACK_FOCUS') == 'true'
          cache_text = (root / 'build/CMakeCache.txt').read_text()
          if callback_focus and ('DATAPUMP_LIVE_MUTEX_PROBE:BOOL=OFF' not in cache_text or 'DATAPUMP_LIVE_SNAPSHOT_PROBE:BOOL=OFF' not in cache_text):
              raise SystemExit('plain callback focus requires both compile-time observers disabled; no qualification run is implied')
          if focus and 'DATAPUMP_LIVE_MUTEX_PROBE:BOOL=ON' not in cache_text:
              raise SystemExit('mutex focus requires the compile-time observer; no qualification run is implied')
          if snapshot_focus and ('DATAPUMP_LIVE_SNAPSHOT_PROBE:BOOL=ON' not in cache_text or 'DATAPUMP_LIVE_MUTEX_PROBE:BOOL=OFF' not in cache_text):
              raise SystemExit('Snapshot focus must retain the ordinary mutex and enable only named phase hooks')
          pairs = (False, True, False, True, False, True) if (snapshot_focus or callback_focus) else (False, True, False, True)
          for index, enabled in enumerate(pairs, 1):
              stem = f'{index:02d}-' + ('probe' if enabled else 'baseline')
              command = [str(binary), '--paced-held-keyed-on']
              if enabled:
                  command.append('--pacing-probe')
                  if focus:
                      command.append('--mutex-probe')
                  if snapshot_focus:
                      command.append('--snapshot-probe')
              out, err = report / (stem + '.stdout.log'), report / (stem + '.stderr.log')
              started = datetime.datetime.now(datetime.timezone.utc).isoformat()
              start = time.monotonic()
              process, code, timed_out, launch_error = None, None, False, None
              with out.open('wb') as stdout, err.open('wb') as stderr:
                  try:
                      process = subprocess.Popen(command, cwd=root, stdout=stdout, stderr=stderr, start_new_session=True)
                      try:
                          code = process.wait(timeout=600)
                      except subprocess.TimeoutExpired:
                          timed_out = True
                          os.killpg(process.pid, signal.SIGTERM)
                          try:
                              code = process.wait(timeout=10)
                          except subprocess.TimeoutExpired:
                              os.killpg(process.pid, signal.SIGKILL)
                              code = process.wait(timeout=5)
                  except Exception as error:
                      launch_error = repr(error)
                  finally:
                      if process is not None:
                          try:
                              os.killpg(process.pid, signal.SIGKILL)
                          except ProcessLookupError:
                              pass
                          if process.poll() is None:
                              code = process.wait(timeout=5)
              process_elapsed = time.monotonic() - start
              summaries, parse_errors = [], []
              for line in out.read_text(errors='replace').splitlines():
                  prefix = 'PACED_BURST_JSON '
                  if not line.startswith(prefix):
                      continue
                  try:
                      row = json.loads(line[len(prefix):])
                      if row.get('selector') == '--paced-held-keyed-on':
                          summaries.append(row)
                  except (ValueError, AttributeError) as error:
                      parse_errors.append(str(error))
              summary = summaries[0] if len(summaries) == 1 else None
              mutex_mapping = None
              if focus and enabled:
                  probe = summary.get('mutex_probe') if isinstance(summary, dict) else None
                  mutex_mapping = {'complete': False, 'error': None, 'mapped': [], 'unmapped': []}
                  try:
                      if not isinstance(probe, dict) or probe.get('enabled') is not True:
                          raise ValueError('mutex_probe.enabled is not true')
                      anchor_runtime = int(probe['address_anchor'], 0) if isinstance(probe['address_anchor'], str) else int(probe['address_anchor'])
                      records = probe.get('records')
                      if not isinstance(records, list):
                          raise ValueError('mutex_probe.records is not an array')
                      event_limit = 4096
                      selected_records = records[:event_limit]
                      nm = subprocess.run(['nm', '-an', '--demangle', str(binary)], cwd=root, text=True,
                                          stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=True, timeout=30)
                      anchor_name = 'datapump::live::mutex_probe::address_anchor'
                      anchors = []
                      for line in nm.stdout.splitlines():
                          fields = line.split(None, 2)
                          if len(fields) == 3 and fields[2] in (anchor_name, anchor_name + '()'):
                              anchors.append(int(fields[0], 16))
                      if len(anchors) != 1:
                          raise ValueError(f'expected one nm symbol {anchor_name}, found {len(anchors)}')
                      link_anchor = anchors[0]
                      unique_sites = sorted({int(row['call_site'], 0) if isinstance(row.get('call_site'), str) else int(row['call_site'])
                                             for row in selected_records if isinstance(row, dict) and row.get('call_site') not in (None, 0, '0')})
                      mapping_rows = []
                      for runtime_site in unique_sites:
                          link_site = runtime_site - anchor_runtime + link_anchor - 1
                          mapped = subprocess.run(['addr2line', '-C', '-f', '-i', '-p', '-e', str(binary), hex(link_site)],
                                                  cwd=root, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                                  check=False, timeout=30)
                          mapping_rows.append({'runtime_call_site': hex(runtime_site), 'link_call_site': hex(link_site),
                                               'source': mapped.stdout.strip() if mapped.returncode == 0 else None,
                                               'source_resolved': mapped.returncode == 0 and '??' not in mapped.stdout,
                                               'returncode': mapped.returncode,
                                               'stderr': mapped.stderr.strip() or None})
                      mutex_mapping.update(complete=True, address_anchor_runtime=hex(anchor_runtime),
                                           address_anchor_link=hex(link_anchor), selected=probe.get('selected'),
                                           dropped=probe.get('dropped'), capacity=probe.get('capacity'),
                                           threshold_ns=probe.get('threshold_ns'), event_count=len(records),
                                           mapped_event_count=len(selected_records), omitted_event_count=max(0, len(records)-event_limit),
                                           mapped=mapping_rows,
                                           unmapped=[{'record_index': i, 'record': row} for i, row in enumerate(selected_records)
                                                     if not isinstance(row, dict) or row.get('call_site') in (None, 0, '0')])
                  except Exception as error:
                      mutex_mapping['error'] = f'{type(error).__name__}: {error}'
                  (report / f'{stem}.mutex-mapping.json').write_text(json.dumps(mutex_mapping, indent=2) + '\n')
              mapping_ok = (not focus or not enabled or
                            (mutex_mapping is not None and mutex_mapping.get('complete') is True and
                             not mutex_mapping.get('error') and mutex_mapping.get('dropped') == 0 and
                             mutex_mapping.get('omitted_event_count') == 0 and not mutex_mapping.get('unmapped') and
                             all(row.get('source_resolved') is True for row in mutex_mapping.get('mapped', []))))
              snapshot_value = summary.get('snapshot_probe', {}) if summary else {}
              snapshot_os = summary.get('snapshot_os_probe', {}) if summary else {}
              # Capacity misses close their ownership interval before unlocked
              # reservation. Only those attempts omit the copy/replay phases.
              retry_mask = sum(1 << i for i in (0, 1, 2, 3, 4, 7, 8))
              snapshot_ok = (not snapshot_focus or not enabled or
                             (snapshot_value.get('enabled') is True and snapshot_value.get('dropped') == 0 and
                              all(row.get('present') in (retry_mask, 511) for row in snapshot_value.get('records', [])) and
                              snapshot_os.get('enabled') is True and snapshot_os.get('supported') is True and
                              snapshot_os.get('stopped') is True and snapshot_os.get('reader_errors') == 0 and snapshot_os.get('dropped') == 0))
              monitor_value = summary.get('capture_monitor_probe', {}) if summary else {}
              monitor_os = summary.get('capture_monitor_os_probe', {}) if summary else {}
              monitor_boundary_mask = (1 << 0) | (1 << 14)
              monitor_ok = (not snapshot_focus or not enabled or
                            (monitor_value.get('enabled') is True and monitor_value.get('dropped') == 0 and
                             all((row.get('present', 0) & monitor_boundary_mask) == monitor_boundary_mask
                                 for row in monitor_value.get('records', [])) and
                             monitor_os.get('enabled') is True and monitor_os.get('supported') is True and
                             monitor_os.get('stopped') is True and monitor_os.get('reader_errors') == 0 and monitor_os.get('dropped') == 0))
              callback_os = summary.get('callback_os_probe', {}) if summary else {}
              callback_os_ok = (not enabled or
                                (callback_os.get('enabled') is True and callback_os.get('supported') is True and
                                 callback_os.get('stopped') is True and callback_os.get('reader_errors') == 0 and
                                 callback_os.get('dropped') == 0))
              result = {'index': index, 'probe_enabled': enabled, 'command': command,
                        'started_utc': started, 'elapsed_seconds': process_elapsed,
                        'exit_code': code, 'timed_out': timed_out, 'launch_error': launch_error,
                        'summary_count': len(summaries), 'parse_errors': parse_errors, 'summary': summary,
                        'stdout_sha256': hashlib.sha256(out.read_bytes()).hexdigest(),
                        'stderr_sha256': hashlib.sha256(err.read_bytes()).hexdigest(),
                        'mutex_mapping': mutex_mapping, 'mapping_complete': mapping_ok,
                        'snapshot_capture_complete': snapshot_ok, 'monitor_capture_complete': monitor_ok,
                        'callback_os_capture_complete': callback_os_ok}
              (report / (stem + '.json')).write_text(json.dumps(result, indent=2) + '\n')
              results.append(result)
          (report / 'results.json').write_text(json.dumps({'identity': identity, 'results': results}, indent=2) + '\n')
          with pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as stream:
              stream.write('Matched callback captures (diagnostic only; failed and truncated input remains failed):\n\n')
              for row in results:
                  value = row['summary'] or {}
                  stream.write(f"- probe={row['probe_enabled']}, exit={row['exit_code']}, functional={value.get('functional')}, "
                               f"pacing_valid={value.get('pacing_valid')}, callback_max_ns={value.get('callback_duration_max_ns')}, mutex_probe_enabled={value.get('mutex_probe', {}).get('enabled')}\n")
              stream.write(f"\n{len(results) // 2} matched pairs retain trace-overhead evidence; they are not a stable performance estimate.\n")
          if any(row['exit_code'] != 0 or row['timed_out'] or row['launch_error'] or row['parse_errors'] or
                 row['summary_count'] != 1 or row['summary'].get('functional') != 'pass' or
                 row['summary'].get('pacing_valid') is not True or
                 row['summary'].get('callback_probe', {}).get('enabled') is not row['probe_enabled'] or
                 (focus and row['probe_enabled'] and row['summary'].get('mutex_probe', {}).get('enabled') is not True) or
                 not row['mapping_complete'] or not row['snapshot_capture_complete'] or not row['monitor_capture_complete'] or
                 not row['callback_os_capture_complete'] for row in results):
              raise SystemExit('FATAL: callback comparison contains a failed/incomplete run or instrumentation capture; inspect exact retained process results')
          PY_CALLBACK_PROBE
      - name: Retain exact paced-context ELF and provenance
        if: always() && !cancelled() && (inputs.paced_context_focus || inputs.paced_callback_focus || (inputs.scope == 'symbol-burst-live' && inputs.paced_backlog && !inputs.paced_mutex_focus && !inputs.paced_snapshot_focus)) && steps.build_prerequisites.outcome == 'success'
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -B tools/retain-paced-diagnostic.py \
