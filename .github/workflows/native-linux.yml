name: Native Linux validation shard

on:
  workflow_dispatch:
    inputs:
      linux_runner:
        description: 'Linux x86_64 runner for this validation shard'
        type: choice
        options: [ubuntu-24.04, ubuntu-latest-m, ubuntu-latest-l, ubuntu-latest-h]
        default: ubuntu-24.04
      build_type:
        description: 'Debug includes ASan and UBSan'
        type: choice
        options: [Release, Debug]
        default: Release
      scope:
        description: 'Run one complete native scope without repeating the other shards'
        type: choice
        options: [core, fast, live, calibration, frontends, web, package, cli, eme-diagnostic, receiver, startup-guide, sched-hop-diagnostic, alsa-diagnostic, alsa-radius-diagnostic]
        default: core
      calibration_section:
        description: 'Calibration section; used only by the calibration scope'
        type: choice
        options: [all, shaped, matrix, 'null', default-window]
        default: all
      sanitizer_realtime:
        description: 'Include real-time Fast RX checks in instrumented Debug coverage'
        type: boolean
        default: false
  workflow_call:
    inputs:
      linux_runner:
        type: string
        default: ubuntu-24.04
      build_type:
        type: string
        default: Release
      scope:
        description: 'core, fast, live, calibration, calibration-aggregate, frontends, web, package, cli, sanitizer-gui, eme-diagnostic, receiver, startup-guide, sched-hop-diagnostic, alsa-diagnostic, or alsa-radius-diagnostic'
        type: string
        required: true
      calibration_section:
        type: string
        default: all
      calibration_shard:
        description: 'Optional shaped capture part: 0 or 1; requires the separate aggregate job'
        type: string
        default: ''
      sanitizer_realtime:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    name: Linux ${{ inputs.build_type }} / ${{ inputs.scope }} / ${{ inputs.calibration_section }}${{ inputs.calibration_shard != '' && format(' / part {0}', inputs.calibration_shard) || '' }}
    runs-on: ${{ inputs.linux_runner }}
    # Preserve the portable application's glibc 2.35 baseline in every shard.
    container: ubuntu:22.04
    # Standard runners need room for the full instrumented suite after compilation.
    # Explicit test limits and physical deadlines remain unchanged.
    timeout-minutes: ${{ inputs.build_type == 'Debug' && (inputs.scope == 'core' || inputs.scope == 'calibration') && 240 || 120 }}
    defaults:
      run:
        shell: bash
    env:
      DATAPUMP_CI_SMOKE_WARNINGS_DIR: ${{ github.workspace }}/build/ci-smoke-results
      DATAPUMP_CI_SMOKE_RUNNER: ${{ github.workspace }}/tools/run-gui-smoke.py
      DATAPUMP_SMOKE_TARGET: linux-x86_64-fltk
      DATAPUMP_SMOKE_SCOPE: source/native
      DATAPUMP_SMOKE_SOURCE_SHA: ${{ github.sha }}
      DATAPUMP_SMOKE_INVENTORY_SHA256: ''
      DEBIAN_FRONTEND: noninteractive
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      CC: gcc-11
      CXX: g++-11
      CI_SCOPE: ${{ inputs.scope }}
      DATAPUMP_SANITIZERS: ${{ inputs.build_type == 'Debug' && 'ON' || 'OFF' }}
      SANITIZER_REALTIME: ${{ inputs.sanitizer_realtime }}
    steps:
      - name: Validate manual package configuration
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'package' && inputs.build_type != 'Release'
        run: |
          echo '::error::The package scope requires build_type=Release.'
          exit 2
      - name: Load current package-fetch helper before installing Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .ci-bootstrap
          sparse-checkout: tools/ci-apt.sh
          sparse-checkout-cone-mode: false
      - name: Prepare build dependencies
        run: |
          cp .ci-bootstrap/tools/ci-apt.sh "$RUNNER_TEMP/ci-apt.sh"
          sh "$RUNNER_TEMP/ci-apt.sh" install ca-certificates curl git cmake ninja-build make g++-11 binutils libssl-dev libasound2-dev libx11-dev libxft-dev libxext-dev libxrender-dev libxcursor-dev libxfixes-dev libxinerama-dev libncurses-dev libsdl2-dev xvfb xauth fontconfig-config fonts-dejavu-core python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned dependency scanner
        run: |
          sh tools/install-release-cmake.sh "$GITHUB_WORKSPACE/build/ci-cmake"
          echo "$GITHUB_WORKSPACE/build/ci-cmake/bin" >> "$GITHUB_PATH"
      - name: Prepare the pinned CPU framebuffer host
        if: inputs.scope == 'package' || inputs.scope == 'frontends'
        run: |
          python3 -B tools/prepare-native-sdl.py "$GITHUB_WORKSPACE/build/native-sdl" --cc gcc-11 --cxx g++-11 --jobs "$(python3 -B tools/build_capacity.py)"
          echo "DATAPUMP_NATIVE_SDL_ROOT=$GITHUB_WORKSPACE/build/native-sdl/install" >> "$GITHUB_ENV"
      - name: Prepare the JavaScript test host
        if: inputs.scope == 'web'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Configure native application and selected test scope
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=gcc-11 -DCMAKE_CXX_COMPILER=g++-11
          -DCMAKE_BUILD_TYPE=${{ inputs.build_type }}
          -DDATAPUMP_SANITIZERS=${{ inputs.build_type == 'Debug' && 'ON' || 'OFF' }}
          -DDATAPUMP_PORTABLE=${{ inputs.build_type == 'Release' && 'ON' || 'OFF' }}
          -DBUILD_TESTING=${{ inputs.scope == 'package' && 'OFF' || 'ON' }}
          -DDATAPUMP_BUILD_TUI=${{ (inputs.scope == 'package' || inputs.scope == 'frontends') && 'ON' || 'OFF' }}
          -DDATAPUMP_BUILD_FB=${{ (inputs.scope == 'package' || inputs.scope == 'frontends') && 'ON' || 'OFF' }}
          -DDATAPUMP_BUILD_WEB_WORKER=${{ (inputs.scope == 'package' || inputs.scope == 'web') && 'ON' || 'OFF' }}
          -DDATAPUMP_CALIBRATION_SECTION=${{ inputs.calibration_section }}
          -DDATAPUMP_CALIBRATION_SHARD=${{ inputs.calibration_shard }}
          -DDART_TESTING_TIMEOUT=3600
          -DCMAKE_DISABLE_FIND_PACKAGE_Python3=${{ (inputs.scope == 'frontends' || inputs.scope == 'web') && 'FALSE' || 'TRUE' }}
      - name: Build this shard's prerequisites
        id: build_prerequisites
        run: |
          case "$CI_SCOPE" in
            calibration|calibration-aggregate) targets=(test_differential_receiver_probability) ;;
            package) targets=(datapump-apps) ;;
            frontends) targets=(datapump-tests-frontends) ;;
            web) targets=(datapump-tests-web) ;;
            sanitizer-gui) targets=(datapump-apps test_gui_smoke_budget test_gui_launch_command) ;;
            core) targets=(datapump-apps datapump-tests-ci-core) ;;
            cli) targets=(pump) ;;
            eme-diagnostic) targets=(test_frequency_axis_probability) ;;
            alsa-diagnostic|alsa-radius-diagnostic) targets=(test_alsa_audio) ;;
            receiver) targets=(test_pattern_correlator test_pattern_drift test_receiver_differential test_clock_sync test_pattern_startup_guide) ;;
            startup-guide) targets=(test_pattern_startup_guide) ;;
            sched-hop-diagnostic) targets=(test_sched_hop_transmit test_sched_hop_receiver) ;;
            fast) targets=(datapump-tests-fast) ;;
            live) targets=(datapump-tests-ci-live) ;;
            *) echo "Unknown native scope: $CI_SCOPE" >&2; exit 2 ;;
          esac
          cmake --build build --target "${targets[@]}" --parallel "$(python3 -B tools/build_capacity.py)"
      - name: Diagnose one strict EME continuation capture without changing its gates
        if: inputs.scope == 'eme-diagnostic'
        timeout-minutes: 30
        run: |
          set -o pipefail
          git -c safe.directory="$PWD" rev-parse HEAD | tee build/eme-diagnostic-source.txt
          ./build/test_frequency_axis_probability --strict-end 128 30 3 3 2>&1 | tee build/eme-diagnostic.log
          echo 'One paired strict capture: exact content, immutable pending identity, backend parity and independent physical end are required. Full regression and calibration remain separate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Measure original V1 reconstruction before its unchanged strict gate
        if: inputs.scope == 'alsa-diagnostic'
        timeout-minutes: 30
        run: |
          set -o pipefail
          git -c safe.directory="$PWD" rev-parse HEAD | tee build/alsa-diagnostic-source.txt
          ./build/test_alsa_audio --dsss-clipping-diagnostic 2>&1 | tee build/alsa-diagnostic.log
      - name: Measure exact source-radius variants with the original native clipping gate
        if: inputs.scope == 'alsa-radius-diagnostic'
        timeout-minutes: 40
        run: |
          python3 -B - <<'PY'
          import hashlib,json,pathlib,re,subprocess
          root=pathlib.Path.cwd(); report=root/'build/alsa-radius-diagnostic';report.mkdir()
          header=root/'include/datapump/pattern_pulse.hpp'; original=header.read_bytes()
          assert hashlib.sha256(original).hexdigest()=='21f2e598edafc01871409655c96941bb3e0df7cbfffb4c62c0361b5fa1683a14'
          before=b'inline constexpr double pattern_pcm_radius_limit = .992;'
          assert original.count(before)==1
          git=['git','-c','safe.directory='+str(root)]
          subprocess.run(git+['diff','--exit-code'],check=True)
          source=subprocess.check_output(git+['rev-parse','HEAD'],text=True).strip()
          (report/'original-pattern-pulse.hpp').write_bytes(original)
          jobs=subprocess.check_output(['python3','-B','tools/build_capacity.py'],text=True).strip()
          results=[]
          try:
              for radius in ['.988','.984','.981']:
                  changed=original.replace(before,b'inline constexpr double pattern_pcm_radius_limit = '+radius.encode()+b';')
                  header.write_bytes(changed)
                  prefix=report/('radius-'+radius[1:]); prefix.with_suffix('.patch').write_bytes(subprocess.check_output(git+['diff','--binary','--',str(header)]))
                  subprocess.run(['cmake','--build','build','--target','test_alsa_audio','--parallel',jobs],check=True)
                  with prefix.with_suffix('.log').open('w') as log:
                      run=subprocess.run(['./build/test_alsa_audio','--dsss-clipping-diagnostic'],stdout=log,stderr=subprocess.STDOUT)
                  lines=prefix.with_suffix('.log').read_text().splitlines()
                  assert sum(line.startswith('clipping_diagnostic_complete ') for line in lines)==1, 'incomplete source-radius measurement'
                  phases=[line for line in lines if line.startswith('clipping_diagnostic_phase ')]
                  assert len(phases)==257, 'omitted table-node or actual-fixture phase'
                  known='fractional DSSS reconstruction clipping exceeds the bounded reference distortion'
                  assert run.returncode==0 or (run.returncode==1 and lines[-1]==known), 'unexpected diagnostic failure'
                  metrics=[{k:float(v) for k,v in re.findall(r'(fraction|clamp_fraction)=([^ ]+)',line)} for line in phases]
                  worst=max(metrics,key=lambda m:m['clamp_fraction'])
                  item={'source':source,'only_source_change':'pattern_pcm_radius_limit','radius':radius,
                      'header_sha256':hashlib.sha256(changed).hexdigest(),
                      'binary_sha256':hashlib.sha256((root/'build/test_alsa_audio').read_bytes()).hexdigest(),
                      'original_strict_exit':run.returncode,
                      'actual_fixture':metrics[0],'worst_measured_node':worst,
                      'scope':'exact compiled source variant; diagnostic only, not regression or sensitivity qualification'}
                  results.append(item);prefix.with_suffix('.json').write_text(json.dumps(item,indent=2)+'\n');print(json.dumps(item),flush=True)
          finally:
              header.write_bytes(original)
          subprocess.run(git+['diff','--exit-code'],check=True)
          (report/'results.json').write_text(json.dumps(results,indent=2)+'\n')
          PY
      - name: Run selected receiver, clock and scheduled-hop tests
        if: inputs.scope == 'receiver' || inputs.scope == 'startup-guide' || inputs.scope == 'sched-hop-diagnostic'
        run: |
          mkdir -p build/receiver-fixtures
          selector='^(pattern_correlator|pattern_drift|receiver_differential|clock_sync|pattern_startup_guide)$'
          expected='pattern_correlator,pattern_drift,receiver_differential,clock_sync,pattern_startup_guide'
          if [ "$CI_SCOPE" = startup-guide ]; then
            selector='^pattern_startup_guide$'; expected='pattern_startup_guide'
          fi
          if [ "$CI_SCOPE" = sched-hop-diagnostic ]; then
            selector='^(sched_hop_transmit|sched_hop_receiver)$'
            expected='sched_hop_transmit,sched_hop_receiver'
          fi
          ctest --test-dir build --show-only=json-v1 -R "$selector" > build/receiver-fixtures/inventory.json
          python3 -c 'import json,sys; names=[t["name"] for t in json.load(open("build/receiver-fixtures/inventory.json"))["tests"]]; expected=sys.argv[1].split(","); assert len(names)==len(expected) and set(names)==set(expected),names' "$expected"
          ctest --test-dir build --output-on-failure --no-tests=error --parallel 1 --timeout 3600 --output-junit "$PWD/build/receiver-fixtures/results.xml" -R "$selector"
      - name: Run the selected native tests
        if: inputs.scope == 'core' || inputs.scope == 'fast' || inputs.scope == 'live' || inputs.scope == 'calibration' || inputs.scope == 'frontends' || inputs.scope == 'web'
        run: |
          options=()
          if [ "$DATAPUMP_SANITIZERS" = ON ]; then
            options+=(--sanitizers)
          fi
          if [ "$SANITIZER_REALTIME" = true ]; then
            options+=(--sanitizer-realtime)
          fi
          jobs=2
          if [ "$CI_SCOPE" = live ] || [ "$CI_SCOPE" = frontends ] || [ "$CI_SCOPE" = web ]; then jobs=1; fi
          # Instrumented calibration needs compute headroom on standard runners.
          # A complete shaped run retains all fixed seeds and statistical gates.
          test_timeout=3600
          if [ "$DATAPUMP_SANITIZERS" = ON ]; then
            if [ "$CI_SCOPE" = core ]; then test_timeout=7200; fi
            if [ "$CI_SCOPE" = calibration ]; then
              test_timeout=7200
              if [ -z "${{ inputs.calibration_shard }}" ]; then test_timeout=10800; fi
            fi
          fi
          python3 tools/run-ci-tests.py --build-dir build --scope "$CI_SCOPE" --jobs "$jobs" --timeout "$test_timeout" --report build/ci-test-report.json "${options[@]}"
      - name: Record partial capture scope
        if: inputs.calibration_shard != ''
        run: |
          echo 'This job completed half of the fixed shaped captures. It is not full calibration qualification: the required aggregate job checks complete seed coverage and the original per-case and joined statistical assertions.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the completed capture part for required aggregation
        if: inputs.calibration_shard != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Stable within this exact-source run, so rerunning only a failed
          # part can reuse its successful sibling from an earlier attempt.
          name: Shaped-Debug-captures-part-${{ inputs.calibration_shard }}
          path: build/shaped-result.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Download shaped capture part zero
        if: inputs.scope == 'calibration-aggregate'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Shaped-Debug-captures-part-0
          path: build/calibration-results/0
      - name: Download shaped capture part one
        if: inputs.scope == 'calibration-aggregate'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Shaped-Debug-captures-part-1
          path: build/calibration-results/1
      - name: Require every shaped capture and the unchanged aggregate assertions
        if: inputs.scope == 'calibration-aggregate'
        timeout-minutes: 5
        run: |
          ./build/test_differential_receiver_probability --aggregate-shaped build/calibration-results/0/shaped-result.txt build/calibration-results/1/shaped-result.txt 2>&1 | tee build/calibration-aggregate.log
          echo 'All 64 original seeds for each shaped case are present exactly once. The original per-case probability and combined RMS assertions passed using the instrumented capture results.' >> "$GITHUB_STEP_SUMMARY"
      - name: Record separate instrumented desktop coverage
        if: always() && inputs.scope == 'core' && inputs.build_type == 'Debug'
        run: |
          echo '::notice::Instrumented desktop smoke is a separate opt-in job. Its omission is not a smoke pass; Release/package desktop workflows remain required.'
          echo 'Instrumented desktop smoke is outside this regression shard. Select sanitizer_smoke=true or the focused sanitizer-gui diagnostic to run it. Omitted instrumented desktop coverage is not a pass.' >> "$GITHUB_STEP_SUMMARY"
      - name: Check the focused smoke budget policy
        if: inputs.scope == 'sanitizer-gui'
        run: |
          python3 tests/test_gui_smoke_runner.py
          ctest --test-dir build --output-on-failure --no-tests=error -R '^(gui_smoke_budget|gui_launch_command)$'
          echo 'Focused instrumented GUI workflow and budget-policy checks only; no general regression or calibration is claimed by this job.' >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise native desktop workflow
        if: inputs.scope == 'package' || inputs.scope == 'sanitizer-gui'
        run: |
          xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' python3 tools/run-gui-smoke.py --allow-budget-exhaustion --report "$DATAPUMP_CI_SMOKE_WARNINGS_DIR/source-gui.json" --log "build/gui-smoke-${{ inputs.build_type }}-${{ github.run_attempt }}.log" --summary "$GITHUB_STEP_SUMMARY" -- ./build/datapump-gui --smoke-test --smoke-timeout 600
      - name: Developer CLI regressions (Python is not packaged)
        if: ${{ !cancelled() && (inputs.scope == 'core' || inputs.scope == 'cli') && steps.build_prerequisites.outcome == 'success' }}
        run: |
          set -o pipefail
          printf 'source_sha=%s\n' "$GITHUB_SHA" | tee build/cli-regressions.log
          sha256sum build/pump | tee -a build/cli-regressions.log
          python3 tests/test_cli.py build/pump 2>&1 | tee -a build/cli-regressions.log
      - name: Verify relocated native GUI and package inventory
        if: inputs.scope == 'package'
        env:
          DATAPUMP_SMOKE_SCOPE: published/relocation
        run: |
          xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' cmake -DBUILD_DIR="$PWD/build" -DCONFIG=Release -DGUI_SMOKE=ON -DGUI_SMOKE_TIMEOUT=600 -P tests/package_native.cmake 2>&1 | tee build/package-relocation.log
      - name: Create and verify both native archives
        if: inputs.scope == 'package'
        env:
          DATAPUMP_SMOKE_SCOPE: published/native-archives
        run: |
          cmake --build build --target package --parallel "$(python3 -B tools/build_capacity.py)"
          xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' cmake -DARCHIVE_DIR="$PWD/build/releases" -DBUILD_DIR="$PWD/build" -DGUI_SMOKE=ON -DGUI_SMOKE_TIMEOUT=600 -DMAX_GLIBC=2.35 -DREQUIRE_MANUALS=ON -DREQUIRE_FRONTENDS=ON -P tools/verify-native-archives.cmake 2>&1 | tee build/package-archives.log
          echo 'Portable Release desktop, relocation, corruption, both archive formats and ABI checks completed; any incomplete smoke coverage is listed in the retained reports. Independent regression/calibration jobs still determine the overall workflow result.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Linux offline bundles
        if: inputs.scope == 'package'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DataPump-Linux-x86_64-glibc-2.35
          path: |
            build/releases/*.tar.gz
            build/releases/*.zip
            build/releases/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Retain shard reports and failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CI-Linux-${{ inputs.build_type }}-${{ inputs.scope }}-${{ inputs.calibration_section }}${{ inputs.calibration_shard != '' && format('-part-{0}', inputs.calibration_shard) || '' }}-attempt-${{ github.run_attempt }}
          path: |
            build/ci-test-report.*
            build/cli-regressions.log
            build/Testing/Temporary/
            build/gui-smoke-*.log
            build/package-*.log
            build/shaped-result.txt
            build/calibration-aggregate.log
            build/eme-diagnostic*
            build/alsa-diagnostic*
            build/alsa-radius-diagnostic/
            build/CMakeCache.txt
            build/receiver-fixtures/
            ${{ github.workspace }}/build/ci-smoke-results/
          if-no-files-found: warn
          retention-days: 7
