          with tarfile.open(archive) as captured:
              for member in captured.getmembers():
                  path = Path(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise ValueError("unsafe isolated source archive member")
                  if member.issym() or member.islnk():
                      target = (source / path.parent / member.linkname).resolve()
                      if not target.is_relative_to(source):
                          raise ValueError("isolated source archive link escapes source")
              captured.extractall(source)
