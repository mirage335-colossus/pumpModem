            ${{ inputs.scope == 'simulation-first-transition-diagnostic' && inputs.stop_group == 'framed-4e-census' && 'build/current-4e-source/' || '' }}
            ${{ inputs.scope == 'simulation-first-transition-diagnostic' && inputs.stop_group == 'framed-4e-census' && 'build/first-transition-source/' || '' }}
            ${{ inputs.scope == 'simulation-first-transition-diagnostic' && inputs.stop_group == 'framed-4e-census' && 'build/test_live' || '' }}
            build/first-transition-source/prepared-source.json
