                      f.add("transmitting",s.transmitting);f.add("noise",s.transmitting_noise);
                      f.add("stopping",s.transmission_stopping);f.add("finished",s.transmission_finished);
                      f.add("transmission_failed",s.transmission_failed);
                      f.add("process_cpu_available",cpu!=std::clock_t(-1));
                      f.add("process_cpu_seconds",cpu!=std::clock_t(-1)?double(cpu)/CLOCKS_PER_SEC:0.);
                      f.add("receiver_bank_builds",s.receiver_bank_builds);
                      f.add("receiver_admissions",s.receiver_admissions);f.add("receiver_retirements",s.receiver_retirements);
