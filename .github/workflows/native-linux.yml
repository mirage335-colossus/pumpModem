        timeout-minutes: 30
        run: |
          python3 -B tools/simulation-clock-diagnostic/production_components.py \
            --root "$PWD" \
            --report "$PWD/build/simulation-clock-diagnostics/components-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --expected-head "$GITHUB_SHA" \
