        if: inputs.scope == 'simulation-clock-diagnostic' || inputs.scope == 'continuation-carrier-diagnostic'
        run: echo 'This focused simulation media clock diagnostic does not replace the complete Live test scope.' >> "$GITHUB_STEP_SUMMARY"
      - name: Capture original Live first-transition census
        if: inputs.scope == 'simulation-first-transition-diagnostic' && inputs.stop_group != 'framed-4e-census' && !cancelled() && steps.build_prerequisites.outcome == 'success'
        timeout-minutes: 12
        run: >-
          python3 -B tools/first-transition-diagnostic/capture.py
          --root "$PWD"
          --compiled-source "$PWD/build/first-transition-source"
          --binary "$PWD/build/test_live"
          --report "$PWD/build/simulation-first-transition-diagnostics/capture"
      - name: Capture matched current-source first-transition census cases
        if: inputs.scope == 'simulation-first-transition-diagnostic' && inputs.stop_group == 'framed-4e-census' && !cancelled() && steps.build_prerequisites.outcome == 'success'
        timeout-minutes: 25
        run: >-
          python3 -B tools/framed-first-transition-diagnostic/capture.py
          --root "$PWD"
