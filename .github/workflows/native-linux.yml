      - name: Prepare focused Symbol Burst Live qualification evidence
        if: inputs.scope == 'symbol-burst-live'
        run: |
          set -euo pipefail
          report="$PWD/build/symbol-burst-live-qualification"
          mkdir -p "$report"
          git -c safe.directory="$PWD" rev-parse HEAD > "$report/source.txt"
          git -c safe.directory="$PWD" rev-parse 'HEAD^{tree}' > "$report/source-tree.txt"
          cp build/CMakeCache.txt "$report/CMakeCache.txt"
          python3 -B - "$PWD" "$report" <<'PY_BURST_PREPARE'
          import hashlib, json, pathlib, re, subprocess, sys

          root, report = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          source = (report / 'source.txt').read_text().strip()
          tree = (report / 'source-tree.txt').read_text().strip()
          status = subprocess.check_output(
              ['git', '-c', 'safe.directory=' + str(root), 'status', '--porcelain=v1', '--untracked-files=all'],
              cwd=root, text=True)
          assert not status, f'focused qualification requires a clean source checkout: {status!r}'
          paths = ('CMakeLists.txt', 'src/live.cpp', 'src/signal_view.cpp', 'src/live_capture_monitor_probe.hpp', 'src/live_snapshot_copy.hpp',
                   'src/signal_view.hpp', 'tests/test_live_monitor_frame.cpp',
                   'tests/test_live_snapshot_copy.cpp', 'tests/test_symbol_burst_live.cpp', 'tests/cpu_work_budget.hpp')
          source_inventory = {
              'source_commit': source,
              'source_tree': tree,
              'test': 'symbol_burst_live',
              'test_target': 'test_symbol_burst_live',
              'source_files_sha256': {name: hashlib.sha256((root / name).read_bytes()).hexdigest()
                                      for name in paths},
              'cmake_cache_sha256': hashlib.sha256((report / 'CMakeCache.txt').read_bytes()).hexdigest(),
          }
          (report / 'source-inventory.json').write_text(json.dumps(source_inventory, indent=2) + '\n')
          selector = '^(symbol_burst_live)$'
          with (report / 'inventory.json').open('w') as output:
              subprocess.run(['ctest', '--test-dir', str(root / 'build'), '--show-only=json-v1', '-R', selector],
                             cwd=root, stdout=output, check=True)
          tests = json.loads((report / 'inventory.json').read_text()).get('tests', [])
          assert len(tests) == 1 and tests[0].get('name') == 'symbol_burst_live', [t.get('name') for t in tests]
          lines = (root / 'build/CTestTestfile.cmake').read_text().splitlines()
          registration = next((line.strip() for line in lines
                               if line.lstrip().startswith('add_test(') and 'symbol_burst_live' in line), None)
          assert registration is not None, 'the original CTest registration is missing'
          match = re.fullmatch(r'add_test\(\[=\[symbol_burst_live\]=\] "([^"]+/test_symbol_burst_live)"\)', registration)
          assert match and pathlib.Path(match.group(1)).resolve() == (root / 'build/test_symbol_burst_live').resolve(), registration
          cache = {}
          for line in (report / 'CMakeCache.txt').read_text().splitlines():
              if '=' not in line or line.startswith('//') or line.startswith('#'):
                  continue
              key, value = line.split('=', 1)
              cache[key.split(':', 1)[0]] = value
          assert cache.get('CMAKE_BUILD_TYPE') == 'Debug', cache.get('CMAKE_BUILD_TYPE')
          assert cache.get('DATAPUMP_SANITIZERS') == 'ON', cache.get('DATAPUMP_SANITIZERS')
          assert cache.get('DATAPUMP_CI_HOSTED_CLOCK_FUNCTIONAL') == 'OFF', cache.get('DATAPUMP_CI_HOSTED_CLOCK_FUNCTIONAL')
          print('exact source, one original no-argument test registration and Debug sanitizer configuration verified')
          PY_BURST_PREPARE
      - name: Preflight paced runtime package ownership
        if: inputs.paced_context_focus || inputs.paced_callback_focus
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 -B - "$PWD" <<'PY_PACED_OWNER_PREFLIGHT'
          import hashlib, importlib.util, json, pathlib, sys

          root = pathlib.Path(sys.argv[1]).resolve()
          report = root / 'build/symbol-burst-live-qualification'
          helper = root / 'tools/retain-paced-diagnostic.py'
          spec = importlib.util.spec_from_file_location('retain_paced_diagnostic', helper)
          if spec is None or spec.loader is None:
              raise RuntimeError('cannot load the canonical paced retention helper')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          copyright_root = report / 'runtime-owner-preflight-copyright'
          metadata = module.package_metadata(pathlib.Path('/lib/x86_64-linux-gnu/libgcc_s.so.1'), copyright_root)
          identity = {
              'source_commit': (report / 'source.txt').read_text().strip(),
              'source_tree': (report / 'source-tree.txt').read_text().strip(),
              'helper_source': str(helper),
              'helper_sha256': hashlib.sha256(helper.read_bytes()).hexdigest(),
              'classification': 'setup preflight only; no ELF execution or qualification',
              'runtime_package_metadata': metadata,
          }
          (report / 'runtime-owner-preflight.json').write_text(json.dumps(identity, indent=2) + '\n')
