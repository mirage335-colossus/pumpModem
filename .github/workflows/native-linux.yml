        run: echo 'Six identical fixed-bank prefix replays retain acquisition scopes and a joined storage census in both modes, alternating only the new FFT execution scopes. Original A4 timeline/work/output gates and the additive storage reader remain mandatory. This diagnostic does not execute original full-fixture assertions or establish Live/GUI deadlines or qualification.' >> "$GITHUB_STEP_SUMMARY"
      - name: Run the focused simulation media clock diagnostic
        if: (inputs.scope == 'simulation-clock-diagnostic' || inputs.scope == 'continuation-carrier-diagnostic') && !cancelled() && steps.build_prerequisites.outcome == 'success'
        timeout-minutes: 15
        run: |
          python3 -B - <<'PY_CLOCK_DIAGNOSTIC'
          from pathlib import Path
          import hashlib, json, shutil, subprocess, time

          root = Path.cwd()
          report = root / "build/simulation-clock-diagnostics"
          report.mkdir(parents=True, exist_ok=True)
          binary = root / "build/test_live"
          compiler = shutil.which("g++-11")
          command = [str(binary), "--simulation-media-clock"]
          source_probe = subprocess.run(["git", "-c", "safe.directory=" + str(root), "rev-parse", "HEAD"],
                                        cwd=root, capture_output=True, text=True)
          (report / "source-probe.stdout").write_text(source_probe.stdout)
          (report / "source-probe.stderr").write_text(source_probe.stderr)
          source_probe.check_returncode()
          source = source_probe.stdout.strip()
          compiler_version = subprocess.run([compiler or "g++-11", "--version"], cwd=root,
                                            capture_output=True, text=True)
          binary_sha256 = hashlib.sha256(binary.read_bytes()).hexdigest()
          source_files = {}
          for name in ("tests/test_live.cpp", "CMakeLists.txt", "src/live.cpp", "src/channel.cpp",
                       "src/live_simulation_clock.hpp"):
              source_files[name] = hashlib.sha256((root / name).read_bytes()).hexdigest()
          started = time.monotonic()
          timeout_seconds = 600
          timed_out = False
          try:
              result = subprocess.run(command, cwd=root, capture_output=True, timeout=timeout_seconds)
              stdout, stderr, exit_code = result.stdout, result.stderr, result.returncode
          except subprocess.TimeoutExpired as error:
              stdout, stderr = error.stdout or b"", error.stderr or b""
              exit_code, timed_out = 124, True
          elapsed = time.monotonic() - started
          (report / "stdout.log").write_bytes(stdout)
          (report / "stderr.log").write_bytes(stderr)
          identity = {
              "source_commit": source,
              "source_files": source_files,
              "build_command": ["cmake", "--build", "build", "--target", "test_live"],
              "compiler_path": compiler,
              "compiler_version": compiler_version.stdout.strip(),
              "compiler_version_exit": compiler_version.returncode,
              "binary_path": str(binary),
              "binary_sha256": binary_sha256,
              "command": command,
              "timeout_seconds": timeout_seconds,
              "timed_out": timed_out,
              "exit": exit_code,
              "wall_seconds": elapsed,
              "stdout_sha256": hashlib.sha256(stdout).hexdigest(),
              "stderr_sha256": hashlib.sha256(stderr).hexdigest(),
          }
          (report / "run.json").write_text(json.dumps(identity, indent=2) + "\n")
          print(f"Simulation media clock diagnostic exit={exit_code} timed_out={timed_out} wall_seconds={elapsed:.3f}")
          raise SystemExit(exit_code)
          PY_CLOCK_DIAGNOSTIC
      - name: Mark simulation clock scope as diagnostic only
        if: inputs.scope == 'simulation-clock-diagnostic' || inputs.scope == 'continuation-carrier-diagnostic'
        run: echo 'This focused simulation media clock diagnostic does not replace the complete Live test scope.' >> "$GITHUB_STEP_SUMMARY"
      - name: Run default and explicitly traced simulation clock diagnostics
        if: (inputs.scope == 'simulation-clock-trace-diagnostic' || inputs.scope == 'simulation-clock-geometry-diagnostic' || (inputs.scope == 'simulation-clock-raw-component-diagnostic' || inputs.scope == 'simulation-clock-chain-score-diagnostic'))
        timeout-minutes: ${{ inputs.scope == 'simulation-clock-geometry-diagnostic' && 35 || 25 }}
        run: |
          python3 -B - <<'PY_CLOCK_TRACE'
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib, json, os, resource, runpy, shutil, subprocess, time

          root = Path.cwd()
          report = root / "build/simulation-clock-trace-diagnostics"
          report.mkdir(parents=True, exist_ok=True)
          binary = root / "build/test_live"
          compiler = shutil.which("g++-11")
          timeout_seconds = 600
          source_probe = subprocess.run(
              ["git", "-c", "safe.directory=" + str(root), "rev-parse", "HEAD"],
              cwd=root, capture_output=True, text=True)
          (report / "source-probe.stdout").write_text(source_probe.stdout)
          (report / "source-probe.stderr").write_text(source_probe.stderr)
          source_probe.check_returncode()
          source_commit = source_probe.stdout.strip()
          compiler_version = subprocess.run([compiler or "g++-11", "--version"], cwd=root,
                                            capture_output=True, text=True)
          binary_sha256 = hashlib.sha256(binary.read_bytes()).hexdigest()
          config_path = root / "build/CMakeCache.txt"
          config_sha256 = hashlib.sha256(config_path.read_bytes()).hexdigest()
          source_paths = ("tests/test_live.cpp", "CMakeLists.txt", "src/live.cpp",
                          "src/channel.cpp", "src/live_simulation_clock.hpp", "src/audio_trace.hpp",
                          "tools/gui-stop-differential.py")
          compiled_source = root / "build/raw-chain-source" if os.environ["CI_SCOPE"] == "simulation-clock-chain-score-diagnostic" else root
          source_files = {name: hashlib.sha256((compiled_source / name).read_bytes()).hexdigest()
                          for name in source_paths}
          safe_environment_keys = ("PATH", "LANG", "LC_ALL", "TZ", "DATAPUMP_RX_CPU_PROFILE",
                                  "ASAN_OPTIONS", "UBSAN_OPTIONS", "RUNNER_OS", "RUNNER_ARCH")
          environment = {key: os.environ[key] for key in safe_environment_keys if key in os.environ}
          environment_sha256 = hashlib.sha256("\0".join(
              key + "=" + value for key, value in sorted(os.environ.items())).encode()).hexdigest()
          # Reuse the established strict footer/seal/sequence validator. Loading
          # its definitions does not run its guarded prepare/run/restore CLI.
          trace_seal = runpy.run_path(str(root / "tools/gui-stop-differential.py"))["trace_seal"]
          component_directory = (report / "raw-component").resolve()
          chain_scope = os.environ["CI_SCOPE"] == "simulation-clock-chain-score-diagnostic"
          component_scope = chain_scope or os.environ["CI_SCOPE"] == "simulation-clock-raw-component-diagnostic"
          base_environment = os.environ.copy()
          base_environment.pop("DATAPUMP_RAW_CHAIN_SCORE_DIAGNOSTIC", None)
          base_environment_sha256 = hashlib.sha256("\0".join(
              key + "=" + value for key, value in sorted(base_environment.items())).encode()).hexdigest()
          receiver_overlay = None
          if chain_scope:
              evidence = report / "overlay-evidence"
              receiver_overlay = json.loads((evidence / "manifest.json").read_text())
              source_files["src/pattern_receiver.cpp"] = hashlib.sha256((compiled_source / "src/pattern_receiver.cpp").read_bytes()).hexdigest()
              source_files["src/raw_chain_score_probe.hpp"] = hashlib.sha256((compiled_source / "src/raw_chain_score_probe.hpp").read_bytes()).hexdigest()
          trace_path = ((component_directory / "component-trace.jsonl") if component_scope else
                        (report / "default-media-clock.jsonl")).resolve()
          if chain_scope:
              cases = (("off", "standard-component", []), ("on", "standard-component", []))
          elif component_scope:
              cases = (("trace", "standard-component", [str(binary), "--simulation-media-clock-raw-component", str(component_directory)]),)
          elif os.environ["CI_SCOPE"] == "simulation-clock-geometry-diagnostic":
              cases = (("default", "compact", [str(binary), "--simulation-media-clock"]),
                       ("standard", "standard", [str(binary), "--simulation-media-clock-standard"]),
                       ("trace", "standard", [str(binary), "--simulation-media-clock-standard-trace", str(trace_path)]))
          else:
              cases = (("default", "compact", [str(binary), "--simulation-media-clock"]),
                       ("trace", "compact", [str(binary), "--simulation-media-clock-trace", str(trace_path)]))
          results = []
          for name, geometry, command in cases:
              case_report = report / name if chain_scope else report
              case_report.mkdir(parents=True, exist_ok=True)
              child_environment = os.environ.copy()
              if chain_scope:
                  child_environment = base_environment.copy()
                  child_environment["DATAPUMP_RAW_CHAIN_SCORE_DIAGNOSTIC"] = "1" if name == "on" else "0"
                  component_directory = (case_report / "raw-component").resolve()
                  trace_path = component_directory / "component-trace.jsonl"
                  command = [str(binary), "--simulation-media-clock-raw-component", str(component_directory)]
              record_name = "trace" if chain_scope else name
              stdout_path = case_report / (record_name + ".stdout.log")
              stderr_path = case_report / (record_name + ".stderr.log")
              started_utc = datetime.now(timezone.utc).isoformat()
              started = time.monotonic()
              cpu_started = resource.getrusage(resource.RUSAGE_CHILDREN)
              timed_out = False
              try:
                  completed = subprocess.run(command, cwd=root, capture_output=True,
                                             timeout=timeout_seconds, env=child_environment)
                  stdout, stderr = completed.stdout, completed.stderr
                  actual_exit_code = completed.returncode
              except subprocess.TimeoutExpired as error:
                  stdout, stderr = error.stdout or b"", error.stderr or b""
                  actual_exit_code, timed_out = 124, True
              elapsed = time.monotonic() - started
              cpu_finished = resource.getrusage(resource.RUSAGE_CHILDREN)
              finished_utc = datetime.now(timezone.utc).isoformat()
              stdout_path.write_bytes(stdout)
              stderr_path.write_bytes(stderr)
              component_files = None
              if component_scope:
                  (case_report / "component-report.jsonl").write_bytes(stdout)
                  component_files = {str(path.relative_to(case_report)): {
                      "bytes": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
                      for path in sorted(component_directory.rglob("*")) if path.is_file()}
              trace_complete = None
              if record_name == "trace":
                  validation, validation_error = None, None
                  try:
                      validation = trace_seal(trace_path, stderr.decode("utf-8", errors="strict"))
                      trace_complete = not timed_out
                  except (OSError, UnicodeError, ValueError, KeyError, TypeError) as error:
                      validation_error = type(error).__name__ + ": " + str(error)
                      trace_complete = False
                  (case_report / "trace-status.json").write_text(json.dumps({
                      "path": str(trace_path), "exists": trace_path.exists(),
                      "validator": "tools/gui-stop-differential.py::trace_seal",
                      "validation": validation, "validation_error": validation_error,
                      "timed_out": timed_out, "trace_complete": trace_complete,
                      "correctness_note": "Incomplete, dropped, ambiguous, or size-limited trace data is never a pass."
                  }, indent=2) + "\n")
              item = {
                  "name": record_name, "fixture_geometry": geometry, "command": command, "cwd": str(root),
                  "environment": environment, "environment_sha256": environment_sha256,
                  "started_utc": started_utc, "finished_utc": finished_utc,
                  "timeout_seconds": timeout_seconds, "timed_out": timed_out,
                  "actual_exit_code": actual_exit_code, "wall_seconds": elapsed,
                  "binary_path": str(binary), "binary_sha256": binary_sha256,
                  "source_commit": source_commit, "source_files_sha256": source_files,
                  "configuration_path": str(config_path), "configuration_sha256": config_sha256,
                  "compiler_path": compiler, "compiler_version": compiler_version.stdout.strip(),
                  "compiler_version_exit": compiler_version.returncode,
                  "stdout_path": str(stdout_path), "stdout_sha256": hashlib.sha256(stdout).hexdigest(),
                  "stderr_path": str(stderr_path), "stderr_sha256": hashlib.sha256(stderr).hexdigest(),
                  "trace_path": str(trace_path) if record_name == "trace" else None,
                  "trace_complete": trace_complete,
                  "component_files": component_files,
                  "classification": "diagnostic only; no Live or GUI qualification"
              }
              if chain_scope:
                  item.update(mode=name, diagnostic_enabled=int(name == "on"),
                              process_cpu_user_seconds=cpu_finished.ru_utime-cpu_started.ru_utime,
                              process_cpu_system_seconds=cpu_finished.ru_stime-cpu_started.ru_stime,
                              process_cpu_seconds=cpu_finished.ru_utime+cpu_finished.ru_stime-cpu_started.ru_utime-cpu_started.ru_stime,
                              process_cpu_scope="RUSAGE_CHILDREN difference around one subprocess; includes child threads",
                              base_environment_sha256=base_environment_sha256,
                              receiver_overlay=receiver_overlay,
                              compiled_source_directory=str(compiled_source))
                  item["environment"] = {**environment, "DATAPUMP_RAW_CHAIN_SCORE_DIAGNOSTIC": child_environment["DATAPUMP_RAW_CHAIN_SCORE_DIAGNOSTIC"]}
                  item["environment_sha256"] = hashlib.sha256("\0".join(
                      key + "=" + value for key, value in sorted(child_environment.items())).encode()).hexdigest()
                  (case_report / "commands-and-exits.json").write_text(json.dumps([item], indent=2) + "\n")
              results.append(item)
              (report / "commands-and-exits.json").write_text(json.dumps(results, indent=2) + "\n")
              print(json.dumps(item), flush=True)
          # Run both processes even after a failure; preserve each actual exit status.
          failed = any(item["actual_exit_code"] != 0 or item["trace_complete"] is False
                       for item in results)
          raise SystemExit(1 if failed else 0)
          PY_CLOCK_TRACE
      - name: Mark traced simulation clock scope as diagnostic only
        if: (inputs.scope == 'simulation-clock-trace-diagnostic' || inputs.scope == 'simulation-clock-geometry-diagnostic' || (inputs.scope == 'simulation-clock-raw-component-diagnostic' || inputs.scope == 'simulation-clock-chain-score-diagnostic'))
        run: echo 'This simulation clock geometry/trace capture is diagnostic evidence only. Original assertions and each process outcome remain required; it does not qualify Live or GUI behavior.' >> "$GITHUB_STEP_SUMMARY"
      - name: Capture one first-owner census with the original Live assertion
        if: inputs.scope == 'simulation-owner-census-diagnostic'
        timeout-minutes: 12
        env:
          DATAPUMP_OWNER_CENSUS_DIAGNOSTIC: '1'
        run: |
          python3 -B - <<'PY_OWNER_CENSUS_CAPTURE'
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib, json, os, resource, runpy, shutil, subprocess, time

          root = Path.cwd()
          report = root / "build/simulation-owner-census-diagnostics"
          evidence = report / "overlay-evidence"
          report.mkdir(parents=True, exist_ok=True)
          binary = root / "build/test_live"
          trace_path = (report / "first-owner-census.jsonl").resolve()
          timeout_seconds = 600
          git = ["git", "-c", "safe.directory=" + str(root)]
          source_probe = subprocess.run(git + ["rev-parse", "HEAD"], cwd=root,
                                        capture_output=True, text=True)
          (report / "source-probe.stdout").write_text(source_probe.stdout)
          (report / "source-probe.stderr").write_text(source_probe.stderr)
          source_probe.check_returncode()
          source_commit = source_probe.stdout.strip()
          assert len(source_commit) == 40 and all(character in "0123456789abcdef" for character in source_commit)
          archive_record = json.loads((evidence / "source-archive.json").read_text())
          overlay_manifest = json.loads((evidence / "manifest.json").read_text())
          assert archive_record["launcher_source_commit"] == source_commit
          compiled_source = Path(archive_record["compiled_source_directory"])
          source_paths = tuple(overlay_manifest["source_closure"])
          source_files = {name: hashlib.sha256((compiled_source / name).read_bytes()).hexdigest()
                          for name in source_paths}
          compiled_overlay = {name: hashlib.sha256((compiled_source / name).read_bytes()).hexdigest()
                              for name in ("src/live.cpp", "src/pattern_receiver.cpp", "src/owner_census_probe.hpp")}
          assert compiled_overlay == archive_record["compiled_overlay_sha256"]
          assert compiled_overlay["src/live.cpp"] == overlay_manifest["sources"]["live"]["after_sha256"]
          assert compiled_overlay["src/pattern_receiver.cpp"] == overlay_manifest["sources"]["pattern_receiver"]["after_sha256"]
          assert compiled_overlay["src/owner_census_probe.hpp"] == overlay_manifest["support_sha256"]
          source_files.update(compiled_overlay)
          source_files["tests/test_live.cpp"] = hashlib.sha256(
              (compiled_source / "tests/test_live.cpp").read_bytes()).hexdigest()
          binary_sha256 = hashlib.sha256(binary.read_bytes()).hexdigest()
          config_path = root / "build/CMakeCache.txt"
          config_sha256 = hashlib.sha256(config_path.read_bytes()).hexdigest()
          cache = config_path.read_text().splitlines()
          def cache_value(key):
              matches = [line.split("=", 1)[1] for line in cache if line.startswith(key + ":")]
              if len(matches) != 1:
                  raise ValueError("missing or duplicate CMake cache key: " + key)
              return matches[0]
          cache_values = {key: cache_value(key) for key in (
              "CMAKE_BUILD_TYPE", "DATAPUMP_SANITIZERS", "DATAPUMP_PORTABLE",
              "CMAKE_C_COMPILER", "CMAKE_CXX_COMPILER")}
          assert cache_values["CMAKE_BUILD_TYPE"] == "Debug"
          assert cache_values["DATAPUMP_SANITIZERS"] == "ON"
          assert cache_values["DATAPUMP_PORTABLE"] == "OFF"
          c_compiler = shutil.which("gcc-11")
          compiler = shutil.which("g++-11")
          assert c_compiler and Path(cache_values["CMAKE_C_COMPILER"]).resolve() == Path(c_compiler).resolve()
          assert compiler and Path(cache_values["CMAKE_CXX_COMPILER"]).resolve() == Path(compiler).resolve()
          compiler_version = subprocess.run([compiler or "g++-11", "--version"], cwd=root,
                                            capture_output=True, text=True)
          safe_environment_keys = ("PATH", "LANG", "LC_ALL", "TZ", "ASAN_OPTIONS",
                                   "UBSAN_OPTIONS", "RUNNER_OS", "RUNNER_ARCH")
          environment = {key: os.environ[key] for key in safe_environment_keys if key in os.environ}
          environment["DATAPUMP_OWNER_CENSUS_DIAGNOSTIC"] = os.environ["DATAPUMP_OWNER_CENSUS_DIAGNOSTIC"]
          environment_sha256 = hashlib.sha256("\0".join(
              key + "=" + value for key, value in sorted(environment.items())).encode()).hexdigest()
          trace_seal = runpy.run_path(str(root / "tools/gui-stop-differential.py"))["trace_seal"]
          command = [str(binary), "--simulation-media-clock-trace", str(trace_path)]
          child_environment = os.environ.copy()
          started_utc = datetime.now(timezone.utc).isoformat()
          started = time.monotonic()
          cpu_started = resource.getrusage(resource.RUSAGE_CHILDREN)
          timed_out = False
          try:
              completed = subprocess.run(command, cwd=root, capture_output=True,
                                         timeout=timeout_seconds, env=child_environment)
              stdout, stderr = completed.stdout, completed.stderr
              actual_exit_code = completed.returncode
          except subprocess.TimeoutExpired as error:
              stdout, stderr = error.stdout or b"", error.stderr or b""
              actual_exit_code, timed_out = 124, True
          elapsed = time.monotonic() - started
          cpu_finished = resource.getrusage(resource.RUSAGE_CHILDREN)
          finished_utc = datetime.now(timezone.utc).isoformat()
          (report / "first-owner-census.stdout.log").write_bytes(stdout)
          (report / "first-owner-census.stderr.log").write_bytes(stderr)
          validation, validation_error = None, None
          try:
              validation = trace_seal(trace_path, stderr.decode("utf-8", errors="strict"))
          except (OSError, UnicodeError, ValueError, KeyError, TypeError) as error:
              validation_error = type(error).__name__ + ": " + str(error)
          trace_complete = validation is not None and not timed_out
          trace_status = {
              "path": str(trace_path), "exists": trace_path.exists(),
              "sha256": hashlib.sha256(trace_path.read_bytes()).hexdigest() if trace_path.exists() else None,
              "validator": "tools/gui-stop-differential.py::trace_seal",
              "validation": validation, "validation_error": validation_error,
              "timed_out": timed_out, "trace_complete": trace_complete,
              "correctness_note": "Strict footer, external finalization, flush, close, sequence and drop checks are required; the original test exit remains authoritative."
          }
          (report / "trace-status.json").write_text(json.dumps(trace_status, indent=2) + "\n")
          reader_metadata = {
              "source_commit": source_commit,
              "trace_path": str(trace_path),
              "trace_sha256": trace_status["sha256"],
              "status_path": str(report / "first-owner-census.stderr.log"),
              "status_sha256": hashlib.sha256(stderr).hexdigest(),
              "actual_exit_code": actual_exit_code
          }
          (report / "census-reader-metadata.json").write_text(json.dumps(reader_metadata, indent=2) + "\n")
          identity = {
              "scope": "simulation-owner-census-diagnostic",
              "classification": "one original default-provider first-omission capture; diagnostic only, no Live/GUI qualification",
              "fixture": "one test_live --simulation-media-clock-trace process; natural origin; no paired or fixed-work comparison",
              "source_commit": source_commit,
              "source_archive": archive_record,
              "overlay_manifest": overlay_manifest,
              "compiled_source_directory": str(compiled_source),
              "source_files_sha256": source_files,
              "configuration_path": str(config_path), "configuration_sha256": config_sha256,
              "configuration": cache_values,
              "compiler_path": compiler, "compiler_version": compiler_version.stdout.strip(),
              "compiler_version_exit": compiler_version.returncode,
              "binary_path": str(binary), "binary_sha256": binary_sha256,
              "command": command, "cwd": str(root), "environment": environment,
              "environment_sha256": environment_sha256,
              "started_utc": started_utc, "finished_utc": finished_utc,
              "timeout_seconds": timeout_seconds, "timed_out": timed_out,
              "actual_exit_code": actual_exit_code, "wall_seconds": elapsed,
              "process_cpu_user_seconds": cpu_finished.ru_utime - cpu_started.ru_utime,
              "process_cpu_system_seconds": cpu_finished.ru_stime - cpu_started.ru_stime,
              "process_cpu_seconds": (cpu_finished.ru_utime + cpu_finished.ru_stime -
                                      cpu_started.ru_utime - cpu_started.ru_stime),
              "process_cpu_scope": "RUSAGE_CHILDREN difference around the one subprocess, includes child threads; distinct from producer census emission timing",
              "stdout_path": str(report / "first-owner-census.stdout.log"),
              "stdout_sha256": hashlib.sha256(stdout).hexdigest(),
              "stderr_path": str(report / "first-owner-census.stderr.log"),
              "stderr_sha256": hashlib.sha256(stderr).hexdigest(),
              "trace_path": str(trace_path), "trace_complete": trace_complete,
              "preservation": "original test assertions and exit code are retained; 10-second stop and fully scored six-second absence behavior are unchanged"
          }
          (report / "run.json").write_text(json.dumps(identity, indent=2) + "\n")
          print(json.dumps(identity), flush=True)
          # A sealed diagnostic trace does not convert the original assertion failure to success.
          raise SystemExit(actual_exit_code if actual_exit_code != 0 else (0 if trace_complete else 1))
          PY_OWNER_CENSUS_CAPTURE
      - name: Mark first-owner census as diagnostic only
        if: inputs.scope == 'simulation-owner-census-diagnostic'
        run: echo 'This one-process first-owner census preserves the original test outcome and physical deadlines. Its trace and timing are diagnostic evidence only, not Live or GUI qualification.' >> "$GITHUB_STEP_SUMMARY"
      - name: Record partial capture scope
        if: inputs.calibration_shard != ''
        run: |
          echo 'This job completed half of the fixed shaped captures. It is not full calibration qualification: the required aggregate job checks complete seed coverage and the original per-case and joined statistical assertions.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the completed capture part for required aggregation
        if: inputs.calibration_shard != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Stable within this exact-source run, so rerunning only a failed
          # part can reuse its successful sibling from an earlier attempt.
          name: Shaped-Debug-captures-part-${{ inputs.calibration_shard }}
          path: build/shaped-result.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Download shaped capture part zero
        if: inputs.scope == 'calibration-aggregate'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Shaped-Debug-captures-part-0
          path: build/calibration-results/0
      - name: Download shaped capture part one
        if: inputs.scope == 'calibration-aggregate'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Shaped-Debug-captures-part-1
          path: build/calibration-results/1
      - name: Require every shaped capture and the unchanged aggregate assertions
        if: inputs.scope == 'calibration-aggregate'
        timeout-minutes: 5
        run: |
          ./build/test_differential_receiver_probability --aggregate-shaped build/calibration-results/0/shaped-result.txt build/calibration-results/1/shaped-result.txt 2>&1 | tee build/calibration-aggregate.log
          echo 'All 64 original seeds for each shaped case are present exactly once. The original per-case probability and combined RMS assertions passed using the instrumented capture results.' >> "$GITHUB_STEP_SUMMARY"
      - name: Record separate instrumented desktop coverage
        if: always() && inputs.scope == 'core' && inputs.build_type == 'Debug'
        run: |
          echo '::notice::Instrumented desktop smoke is a separate opt-in job. Its omission is not a smoke pass; Release/package desktop workflows remain required.'
          echo 'Instrumented desktop smoke is outside this regression shard. Select sanitizer_smoke=true or the focused sanitizer-gui diagnostic to run it. Omitted instrumented desktop coverage is not a pass.' >> "$GITHUB_STEP_SUMMARY"
      - name: Check the focused smoke budget policy
        if: inputs.scope == 'sanitizer-gui'
        run: |
          python3 tests/test_gui_smoke_runner.py
          ctest --test-dir build --output-on-failure --no-tests=error -R '^(gui_smoke_budget|gui_launch_command)$'
          echo 'Focused instrumented GUI workflow and budget-policy checks only; no general regression or calibration is claimed by this job.' >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise native desktop workflow
        if: inputs.scope == 'package' || inputs.scope == 'sanitizer-gui'
        run: |
          xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' python3 tools/run-gui-smoke.py --allow-budget-exhaustion --report "$DATAPUMP_CI_SMOKE_WARNINGS_DIR/source-gui.json" --log "build/gui-smoke-${{ inputs.build_type }}-${{ github.run_attempt }}.log" --summary "$GITHUB_STEP_SUMMARY" -- ./build/datapump-gui --smoke-test --smoke-timeout 600
      - name: Developer CLI regressions (Python is not packaged)
        if: ${{ !cancelled() && (inputs.scope == 'core' || inputs.scope == 'cli') && steps.build_prerequisites.outcome == 'success' }}
        run: |
          set -o pipefail
          printf 'source_sha=%s\n' "$GITHUB_SHA" | tee build/cli-regressions.log
          sha256sum build/pump | tee -a build/cli-regressions.log
          python3 tests/test_cli.py build/pump 2>&1 | tee -a build/cli-regressions.log
      - name: Verify relocated native GUI and package inventory
        if: inputs.scope == 'package'
        env:
          DATAPUMP_SMOKE_SCOPE: published/relocation
        run: |
          xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' cmake -DBUILD_DIR="$PWD/build" -DCONFIG=Release -DGUI_SMOKE=ON -DGUI_SMOKE_TIMEOUT=600 -P tests/package_native.cmake 2>&1 | tee build/package-relocation.log
      - name: Create and verify both native archives
        if: inputs.scope == 'package'
        env:
          DATAPUMP_SMOKE_SCOPE: published/native-archives
        run: |
          cmake --build build --target package --parallel "$(python3 -B tools/build_capacity.py)"
          xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' cmake -DARCHIVE_DIR="$PWD/build/releases" -DBUILD_DIR="$PWD/build" -DGUI_SMOKE=ON -DGUI_SMOKE_TIMEOUT=600 -DMAX_GLIBC=2.35 -DREQUIRE_MANUALS=ON -DREQUIRE_FRONTENDS=ON -P tools/verify-native-archives.cmake 2>&1 | tee build/package-archives.log
          echo 'Portable Release desktop, relocation, corruption, both archive formats and ABI checks completed; any incomplete smoke coverage is listed in the retained reports. Independent regression/calibration jobs still determine the overall workflow result.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Linux offline bundles
        if: inputs.scope == 'package'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DataPump-Linux-x86_64-glibc-2.35
          path: |
            build/releases/*.tar.gz
            build/releases/*.zip
            build/releases/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Restore and verify the diagnostic source preimages
        if: always() && inputs.scope == 'gui-stop-diagnostic'
        run: |
          python3 -B - <<'PY_STOP_RESTORE'
          if not __debug__: raise RuntimeError("optimized diagnostic execution is forbidden")
          import hashlib,json,pathlib,subprocess
          report=pathlib.Path('build/gui-stop-diagnostic')
          manifest_path=report/'source-variant-manifest.json'
          if not manifest_path.exists():
              # No variant was prepared; do not guess at or overwrite source bytes.
              print('No source-variant manifest; preparation did not reach source writes.')
              raise SystemExit(0)
          manifest=json.loads(manifest_path.read_text())
          expected = {'src/live.cpp': ('789735690478e9c7331487740c475e862293df69a49ce7a44b6793a3909415ac', 'a5ea910a216b4dcfd6b5ea6fab3880e2d3b90124c1094c0558784ac34c7a3cd8'), 'tests/test_gui_controller.cpp': ('3730678e53ef37e295adc319b757b527ffb6a6505bc5424955958658df56ce0f', 'b3e50c1c31d80907d57d556549e0ddd0cb4e30e9cf018f87623d882868329054'), 'src/pattern_receiver.cpp': ('a5860a8130a9e6d851c7b8c68bced746c2c12a9a6ad7c0bc15c8062b6ecd52c8', '52d182ac805a0b5788a77deebf437299953589afcd9599af8a5d2e18b3aea2cf'), 'src/pattern_fft_batch.cpp': ('241e2493c5ad5426c177d500c8a0514e64645c81a384176a4760a06323d62e0e', 'f63e76d8d7903cb96a6f919a29f9f18b89bb699fe79b85d10d7be7f324151c61'), 'src/scheduled_work_profile.hpp': ('87a701a4ed853685e4250805a8665fdd0f10b15347ab0f4f8be1fcc8148b7acf', 'a8cd68e03621e4eb597b687c37e3a5c8d6d97fefc7e106afb240279fac0aff35')}
          assert set(manifest)==set(expected)
          originals={}
          for p,(pre,post) in expected.items():
              assert manifest[p]=={'pre_sha256':pre,'post_sha256':post}
              data=(report/('original-'+p.replace('/','__'))).read_bytes()
              assert hashlib.sha256(data).hexdigest()==pre, p
              assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==post, p
              originals[p]=data
          # Check all current postimages and originals before the first restoration.
          for p,data in originals.items(): pathlib.Path(p).write_bytes(data)
          for p,(pre,_) in expected.items():
              assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==pre, p
          git=['git','-c','safe.directory='+str(pathlib.Path.cwd())]
          subprocess.run(git+['diff','--exit-code','HEAD','--'],check=True)
          (report/'restoration.json').write_text(json.dumps({'restored_preimages':{p:v[0] for p,v in expected.items()},'source_diff_empty':True,'binary_remains_diagnostic_only':True},indent=2)+'\n')
          PY_STOP_RESTORE
      - name: Run the matched stop differential group
        if: inputs.scope == 'gui-stop-differential'
        run: |
          python3 -B tools/gui-stop-differential.py run --root "$PWD" --report "$PWD/build/stop-differential" --group "$CI_STOP_GROUP"
      - name: Restore the matched stop differential source preimages
        if: always() && inputs.scope == 'gui-stop-differential'
        run: |
          python3 -B tools/gui-stop-differential.py restore --root "$PWD" --report "$PWD/build/stop-differential"
      - name: Retain shard reports and failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CI-Linux-${{ inputs.build_type }}-${{ inputs.scope }}-${{ inputs.calibration_section }}${{ inputs.calibration_shard != '' && format('-part-{0}', inputs.calibration_shard) || '' }}-attempt-${{ github.run_attempt }}
          path: |
            build/ci-test-report.*
            build/cli-regressions.log
            build/Testing/Temporary/
            build/gui-smoke-*.log
            build/package-*.log
            build/shaped-result.txt
            build/calibration-aggregate.log
            build/eme-diagnostic*
            build/alsa-diagnostic*
            build/alsa-radius-diagnostic/
            build/CMakeCache.txt
            build/receiver-fixtures/
            build/core-diagnostics/
            build/gui-stop-diagnostic/
            build/fft-diagnostics/
            build/eme-probability-diagnostics/
            build/stop-differential/
            build/planner-diagnostics/
            build/simulation-clock-diagnostics/
            build/simulation-clock-trace-diagnostics/
            build/simulation-owner-census-diagnostics/
            build/simulation-capacity-shape-diagnostics/
            build/simulation-acquisition-partition-diagnostics/
            build/native-peak-lease-diagnostic/
            build/sched-hop-radius-control/
            ${{ github.workspace }}/build/ci-smoke-results/
          if-no-files-found: warn
          retention-days: 7
