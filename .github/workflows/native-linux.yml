          replace(p, '                if(!direct) {\n                    if(supplied_tables)search_fft::fft(std::span(row),true,tables,stop);\n', '                // GUI_BATCH_CPU_ROW_FINISH_BEGIN\n                if(diagnostic_row)diagnostic_row->finish();\n                // GUI_BATCH_CPU_ROW_FINISH_END\n                if(!direct) {\n                    // GUI_BATCH_CPU_INVERSE_BEGIN\n                    std::optional<rx_cpu::Scope> diagnostic_inverse;\n                    if(diagnostic_batch_profile)diagnostic_inverse.emplace(rx_cpu::Stage::diagnostic_batch_fft);\n                    // GUI_BATCH_CPU_INVERSE_END\n                    if(supplied_tables)search_fft::fft(std::span(row),true,tables,stop);\n')
          replace(p, '                visit([&](std::size_t j) {\n', '                // GUI_BATCH_CPU_EVIDENCE_BEGIN\n                std::optional<rx_cpu::Scope> diagnostic_evidence;\n                if(diagnostic_batch_profile)diagnostic_evidence.emplace(rx_cpu::Stage::diagnostic_batch_evidence);\n                // GUI_BATCH_CPU_EVIDENCE_END\n                visit([&](std::size_t j) {\n')
          assert hashlib.sha256(changed['src/pattern_fft_batch.cpp'].encode()).hexdigest() == 'f63e76d8d7903cb96a6f919a29f9f18b89bb699fe79b85d10d7be7f324151c61'
          manifest = {p: {"pre_sha256": expected[p],
              "post_sha256": hashlib.sha256(changed[p].encode()).hexdigest()} for p in expected}
          patch = ''.join(''.join(difflib.unified_diff(
              original[p].splitlines(True), changed[p].splitlines(True),
              fromfile='a/'+p, tofile='b/'+p)) for p in expected)
          assert hashlib.sha256(patch.encode()).hexdigest() == \
              '58b083ff06976480951850dc183779b2212f0bd4e79483c28a3d6f117aa89720'
          print(json.dumps({"files": manifest,"patch_sha256":hashlib.sha256(patch.encode()).hexdigest(),
                            "patch_bytes":len(patch)}, indent=2))
