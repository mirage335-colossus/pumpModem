        if: (inputs.scope == 'simulation-clock-diagnostic' || inputs.scope == 'continuation-carrier-diagnostic') && !cancelled() && steps.build_prerequisites.outcome == 'success' && (inputs.scope != 'simulation-clock-diagnostic' || steps.production_components.outcome == 'success')
        timeout-minutes: 15
        run: |
          python3 -B - <<'PY_CLOCK_DIAGNOSTIC'
          from pathlib import Path
          import hashlib, json, shutil, subprocess, time

          root = Path.cwd()
          report = root / "build/simulation-clock-diagnostics"
          report.mkdir(parents=True, exist_ok=True)
          binary = root / "build/test_live"
          compiler = shutil.which("g++-11")
          command = [str(binary), "--simulation-media-clock"]
          source_probe = subprocess.run(["git", "-c", "safe.directory=" + str(root), "rev-parse", "HEAD"],
                                        cwd=root, capture_output=True, text=True)
          (report / "source-probe.stdout").write_text(source_probe.stdout)
          (report / "source-probe.stderr").write_text(source_probe.stderr)
          source_probe.check_returncode()
          source = source_probe.stdout.strip()
          compiler_version = subprocess.run([compiler or "g++-11", "--version"], cwd=root,
                                            capture_output=True, text=True)
          binary_sha256 = hashlib.sha256(binary.read_bytes()).hexdigest()
          source_files = {}
          for name in ("tests/test_live.cpp", "CMakeLists.txt", "src/live.cpp", "src/channel.cpp",
                       "src/live_simulation_clock.hpp"):
              source_files[name] = hashlib.sha256((root / name).read_bytes()).hexdigest()
          started = time.monotonic()
          timeout_seconds = 600
          timed_out = False
          try:
              result = subprocess.run(command, cwd=root, capture_output=True, timeout=timeout_seconds)
              stdout, stderr, exit_code = result.stdout, result.stderr, result.returncode
          except subprocess.TimeoutExpired as error:
              stdout, stderr = error.stdout or b"", error.stderr or b""
              exit_code, timed_out = 124, True
          elapsed = time.monotonic() - started
          (report / "stdout.log").write_bytes(stdout)
          (report / "stderr.log").write_bytes(stderr)
          identity = {
              "source_commit": source,
              "source_files": source_files,
              "build_command": ["cmake", "--build", "build", "--target", "test_live"],
              "compiler_path": compiler,
              "compiler_version": compiler_version.stdout.strip(),
              "compiler_version_exit": compiler_version.returncode,
              "binary_path": str(binary),
              "binary_sha256": binary_sha256,
              "command": command,
              "timeout_seconds": timeout_seconds,
              "timed_out": timed_out,
              "exit": exit_code,
              "wall_seconds": elapsed,
              "stdout_sha256": hashlib.sha256(stdout).hexdigest(),
              "stderr_sha256": hashlib.sha256(stderr).hexdigest(),
          }
          (report / "run.json").write_text(json.dumps(identity, indent=2) + "\n")
          print(f"Simulation media clock diagnostic exit={exit_code} timed_out={timed_out} wall_seconds={elapsed:.3f}")
          raise SystemExit(exit_code)
          PY_CLOCK_DIAGNOSTIC
