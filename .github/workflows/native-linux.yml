          import hashlib,json,pathlib,subprocess
          root=pathlib.Path.cwd(); report=root/'build/sched-hop-radius-control';report.mkdir()
          git=['git','-c','safe.directory='+str(root)]
          subprocess.run(git+['diff','--exit-code'],check=True)
          header=root/'include/datapump/pattern_pulse.hpp';original=header.read_bytes()
          assert hashlib.sha256(original).hexdigest()=='f3053ed41fa5cbca182ae4dcf5ff4796b030a3cb15527f617d7a765e7f989312'
          source_hashes={'tests/test_sched_hop_transmit.cpp':'18c1a2305c9bb1267c1c755c6f118cd631968b4666eb5d714b63ec0e881e773b',
              'tests/test_sched_hop_receiver.cpp':'995a6ed3f68080157b40b75314eca973a16f4d827c56ff5a881863ee07b11527'}
          for path,digest in source_hashes.items():assert hashlib.sha256((root/path).read_bytes()).hexdigest()==digest
          before=b'inline constexpr double pattern_pcm_radius_limit = .988;'
          assert original.count(before)==1
          changed=original.replace(before,b'inline constexpr double pattern_pcm_radius_limit = .992;')
          changed_hash=hashlib.sha256(changed).hexdigest()
          source=subprocess.check_output(git+['rev-parse','HEAD'],text=True).strip()
          (report/'original-pattern-pulse.hpp').write_bytes(original)
          assert not (root/'build/test_sched_hop_transmit').exists() and not (root/'build/test_sched_hop_receiver').exists()
          result={'source':source,'scope':'one-constant .992 diagnostic control of current code; not pre-feature baseline or current-radius qualification',
              'only_source_change':'pattern_pcm_radius_limit .988 -> .992','original_header_sha256':hashlib.sha256(original).hexdigest(),
              'control_header_sha256':changed_hash,'test_source_sha256':source_hashes}
          exit_code=1
          try:
              header.write_bytes(changed)
              (report/'control.patch').write_bytes(subprocess.check_output(git+['diff','--binary','--',str(header)]))
              jobs=subprocess.check_output(['python3','-B','tools/build_capacity.py'],text=True).strip()
              subprocess.run(['cmake','--build','build','--target','test_sched_hop_transmit','test_sched_hop_receiver','--parallel',jobs],check=True)
              result['binary_sha256']={name:hashlib.sha256((root/'build'/name).read_bytes()).hexdigest()
                  for name in ['test_sched_hop_transmit','test_sched_hop_receiver']}
              selector='^(sched_hop_transmit|sched_hop_receiver)$'
              with (report/'inventory.json').open('w') as inventory:
                  subprocess.run(['ctest','--test-dir','build','--show-only=json-v1','-R',selector],stdout=inventory,check=True)
              names=[test['name'] for test in json.loads((report/'inventory.json').read_text())['tests']]
              assert len(names)==2 and set(names)=={'sched_hop_transmit','sched_hop_receiver'},names
              with (report/'control.log').open('w') as log:
                  run=subprocess.run(['ctest','--test-dir','build','--output-on-failure','--no-tests=error','--parallel','1','--timeout','3600',
                      '--output-junit',str(report/'results.xml'),'-R',selector],stdout=log,stderr=subprocess.STDOUT)
              exit_code=run.returncode;result['test_exit']=exit_code
          finally:
              assert hashlib.sha256(header.read_bytes()).hexdigest()==changed_hash,'unexpected control-header mutation; preserve evidence'
              header.write_bytes(original)
              subprocess.run(git+['diff','--exit-code'],check=True)
              result['original_source_restored']=True
              (report/'result.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result),flush=True)
          raise SystemExit(exit_code)
          PYCONTROL
