          assert len(set(names)) == len(expected), f"duplicate inventory names: {names}"
          assert set(names) == set(expected), f"wrong inventory names: {names}"
          for test in tests:
              command = test.get("command")
              assert isinstance(command, list) and len(command) == 1, (
                  f"test must run with no arguments: {test}"
              )
