name: Native Linux validation shard

on:
  workflow_dispatch:
    inputs:
      linux_runner:
        description: 'Linux x86_64 runner for this validation shard'
        type: choice
        options: [ubuntu-24.04, ubuntu-latest-m, ubuntu-latest-l, ubuntu-latest-h]
        default: ubuntu-24.04
      build_type:
        description: 'Debug includes ASan and UBSan'
        type: choice
        options: [Release, Debug]
        default: Release
      scope:
        description: 'Run one complete native scope without repeating the other shards'
        type: choice
        options: [ci-build-probe, ci-apt-probe, core, preparation, fast, live, release-drain-scheduling-diagnostic, gui-receiver-feed-diagnostic, gui-stop-interval-diagnostic, live-drain-diagnostic, symbol-burst-live, gui-stop-current-wave, calibration, calibration-plan, frontends, web, package, cli, eme-diagnostic, receiver, native-peak-lease-diagnostic, correlator-tone-diagnostic, startup-guide, sched-hop-diagnostic, sched-hop-radius-control, alsa-diagnostic, alsa-radius-diagnostic, preparation-diagnostic, gui-core-diagnostic, gui-stop-diagnostic, fft-diagnostic, planner-diagnostic, eme-probability-diagnostic, gui-stop-differential, fft-kernel-diagnostic, simulation-clock-diagnostic, continuation-carrier-diagnostic, simulation-first-transition-diagnostic, simulation-clock-trace-diagnostic, simulation-clock-geometry-diagnostic, simulation-clock-raw-component-diagnostic, simulation-clock-chain-score-diagnostic, simulation-owner-census-diagnostic, simulation-capacity-shape-diagnostic, simulation-acquisition-partition-diagnostic, fft-normalization-diagnostic]
        default: core
      stop_group:
        description: Temporary matched stop experiment group; diagnostic only
        type: choice
        options: [original, eu, fcc, eu-offset, eu-guard, eu-position, eu-o0-san-on, eu-o1-san-off, eu-o0-san-off, eu-focus-o1-san-on, eu-focus-o0-san-on, eu-focus-o1-san-off, eu-focus-o0-san-off, eu-kernel-o1-san-on, eu-kernel-o1-san-off, eu-clock-o1-san-on, eu-worker-one-o1-san-on, framed-4e-census]
        default: original
      calibration_section:
        description: 'Calibration section; used only by the calibration scope'
        type: choice
        options: [all, shaped, matrix, 'null', default-window]
        default: all
      core_part:
        description: 'Debug core partition: all preserves the complete entry point; 0 or 1 runs one planned half'
        type: choice
        options: [all, '0', '1']
        default: all
      preparation_part:
        description: 'Debug preparation comparison partition: all retains the complete original invocation'
        type: choice
        options: [all, '0', '1', '2', '3']
        default: all
      apt_profile:
        description: 'Exact package profile used only by ci-apt-probe'
        type: choice
        options: [native-ubuntu22, sdk-runtime-ubuntu24]
        default: native-ubuntu22
      sanitizer_realtime:
        description: 'Include real-time Fast RX checks in instrumented Debug coverage'
        type: boolean
        default: false
      core_process_observation:
        description: 'Passively retain and observe the original Burst test during manual Release core coverage'
        type: boolean
        default: false
      paced_backlog:
        description: 'Run paced Symbol Burst backlog diagnostics, including four receiver-held cases, after the original qualification'
        type: boolean
        default: false
      paced_context_focus:
        description: 'Run original-context paced Symbol Burst diagnostics; retain the ninth process and omit later component/GUI reruns'
        type: boolean
        default: false
      paced_callback_probe:
        description: 'Run matched held keyed-On callback timing probes; diagnostic only'
        type: boolean
        default: false
      paced_mutex_focus:
        description: 'Focus paced diagnostics on matched held keyed-On shared-mutex probes; diagnostic only'
        type: boolean
        default: false
      paced_snapshot_focus:
        description: 'Observe Snapshot phases and holder OS state with the ordinary mutex; diagnostic only'
        type: boolean
        default: false
      paced_callback_focus:
        description: 'Focus on three matched plain held keyed-On callback pairs; diagnostic only'
        type: boolean
        default: false
  workflow_call:
    inputs:
      linux_runner:
        type: string
        default: ubuntu-24.04
      build_type:
        type: string
        default: Release
      scope:
        description: 'core, preparation, fast, live, symbol-burst-live, gui-stop-current-wave, calibration, calibration-plan, calibration-aggregate, frontends, web, package, cli, sanitizer-gui, eme-diagnostic, receiver, correlator-tone-diagnostic, startup-guide, sched-hop-diagnostic, sched-hop-radius-control, alsa-diagnostic, alsa-radius-diagnostic, preparation-diagnostic, gui-core-diagnostic, gui-stop-diagnostic, fft-diagnostic, planner-diagnostic, eme-probability-diagnostic, gui-stop-differential, fft-kernel-diagnostic, simulation-clock-diagnostic, continuation-carrier-diagnostic, simulation-first-transition-diagnostic, simulation-clock-trace-diagnostic, simulation-clock-geometry-diagnostic, simulation-clock-raw-component-diagnostic, simulation-clock-chain-score-diagnostic, simulation-owner-census-diagnostic, simulation-capacity-shape-diagnostic, simulation-acquisition-partition-diagnostic, or fft-normalization-diagnostic'
        type: string
        required: true
      stop_group:
        description: Temporary matched stop experiment group; diagnostic only
        type: string
        default: original
      calibration_section:
        type: string
        default: all
      calibration_shard:
        description: 'Optional shaped capture part below calibration_shards; requires the separate aggregate job'
        type: string
        default: ''
      calibration_shards:
        description: 'Shaped capture partition count: 2 preserves the legacy route; 4 requires Debug shaped scope'
        type: string
        default: '2'
      core_part:
        description: 'Debug core partition: all preserves the complete entry point; 0 or 1 runs one planned half'
        type: string
        default: all
      preparation_part:
        description: 'Debug preparation comparison partition: all retains the complete original invocation'
        type: string
        default: all
      apt_profile:
        description: 'Exact package profile used only by ci-apt-probe'
        type: string
        default: native-ubuntu22
      sanitizer_realtime:
        type: boolean
        default: false
      core_process_observation:
        description: 'Passively retain and observe the original Burst test during manual Release core coverage'
        type: boolean
        default: false
      paced_backlog:
        description: 'Run paced Symbol Burst backlog diagnostics, including four receiver-held cases, after the original qualification'
        type: boolean
        default: false
      paced_context_focus:
        description: 'Run original-context paced Symbol Burst diagnostics; retain the ninth process and omit later component/GUI reruns'
        type: boolean
        default: false
      paced_callback_probe:
        type: boolean
        default: false
      paced_mutex_focus:
        type: boolean
        default: false
      paced_snapshot_focus:
        type: boolean
        default: false
      paced_callback_focus:
        description: 'Focus on three matched plain held keyed-On callback pairs; diagnostic only'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci-build-probe:
    if: inputs.scope == 'ci-build-probe'
    uses: ./.github/workflows/ci-build-responsiveness-probe.yml
  gui-receiver-feed-diagnostic:
    if: inputs.scope == 'gui-receiver-feed-diagnostic'
    uses: ./.github/workflows/receiver-feed-partition.yml
    with:
      source_sha: '8c54277ca9ec7bf35dee65126ec0d78f3a484f74'
  gui-stop-interval-diagnostic:
    if: inputs.scope == 'gui-stop-interval-diagnostic'
    uses: ./.github/workflows/gui-stop-interval.yml
    with:
      source_sha: '8c54277ca9ec7bf35dee65126ec0d78f3a484f74'
  ci-apt-probe:
    if: inputs.scope == 'ci-apt-probe'
    uses: ./.github/workflows/ci-apt-responsiveness-probe.yml
    with:
      profile: ${{ inputs.apt_profile || 'native-ubuntu22' }}
  fft-kernel:
    if: inputs.scope == 'fft-kernel-diagnostic'
    uses: ./.github/workflows/fft-kernel-diagnostic.yml
  fft-normalization:
    if: inputs.scope == 'fft-normalization-diagnostic'
    uses: ./.github/workflows/fft-normalization-diagnostic.yml
  native:
    if: inputs.scope != 'ci-build-probe' && inputs.scope != 'ci-apt-probe' && inputs.scope != 'fft-kernel-diagnostic' && inputs.scope != 'fft-normalization-diagnostic' && inputs.scope != 'gui-stop-interval-diagnostic' && inputs.scope != 'gui-receiver-feed-diagnostic'
    name: Linux ${{ inputs.build_type }} / ${{ inputs.scope }} / ${{ inputs.calibration_section }}${{ inputs.preparation_part != 'all' && format(' / preparation part {0}', inputs.preparation_part) || '' }}${{ inputs.calibration_shard != '' && format(' / part {0}', inputs.calibration_shard) || '' }}${{ (inputs.scope == 'gui-stop-differential' || (inputs.scope == 'simulation-first-transition-diagnostic' && inputs.stop_group == 'framed-4e-census')) && format(' / {0}', inputs.stop_group) || '' }}
    runs-on: ${{ inputs.linux_runner }}
    # Preserve the portable application's glibc 2.35 baseline in every shard.
    container: ubuntu:22.04
    # Standard runners need room for the full instrumented suite after compilation.
    # Explicit test limits and physical deadlines remain unchanged.
    timeout-minutes: ${{ inputs.scope == 'preparation' && 240 || inputs.build_type == 'Debug' && (inputs.scope == 'core' || inputs.scope == 'calibration' || inputs.scope == 'preparation-diagnostic' || inputs.scope == 'symbol-burst-live') && 240 || inputs.build_type == 'Debug' && inputs.scope == 'gui-core-diagnostic' && 360 || 120 }}
    defaults:
      run:
        shell: bash
    env:
      DATAPUMP_SMOKE_TARGET: linux-x86_64-fltk
      DATAPUMP_SMOKE_SCOPE: source/native
      DATAPUMP_SMOKE_SOURCE_SHA: ${{ github.sha }}
      DATAPUMP_SMOKE_INVENTORY_SHA256: ''
      DEBIAN_FRONTEND: noninteractive
      # This fixed Ubuntu 22.04 package profile is about 165 MB. Bound slow
      # successful acquisition before trying another signed official mirror;
      # the installer itself remains outside the watchdog.
      CI_APT_DOWNLOAD_TIMEOUT: '180'
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      CC: gcc-11
      CXX: g++-11
      CI_SCOPE: ${{ inputs.scope }}
      CORE_PART: ${{ inputs.core_part }}
      PREPARATION_PART: ${{ inputs.preparation_part }}
      CALIBRATION_SHARDS: ${{ inputs.calibration_shards || '2' }}
      CI_STOP_GROUP: ${{ inputs.stop_group }}
      DATAPUMP_SANITIZERS: ${{ inputs.scope == 'gui-stop-differential' && (inputs.stop_group == 'eu-o1-san-off' || inputs.stop_group == 'eu-o0-san-off' || inputs.stop_group == 'eu-focus-o1-san-off' || inputs.stop_group == 'eu-focus-o0-san-off' || inputs.stop_group == 'eu-kernel-o1-san-off') && 'OFF' || ((inputs.build_type == 'Debug' || inputs.scope == 'simulation-clock-diagnostic' || (inputs.scope == 'simulation-clock-trace-diagnostic' || inputs.scope == 'simulation-clock-geometry-diagnostic' || (inputs.scope == 'simulation-clock-raw-component-diagnostic' || inputs.scope == 'simulation-clock-chain-score-diagnostic' || inputs.scope == 'simulation-owner-census-diagnostic' || inputs.scope == 'simulation-capacity-shape-diagnostic' || inputs.scope == 'simulation-acquisition-partition-diagnostic' || inputs.scope == 'continuation-carrier-diagnostic'))) && 'ON' || 'OFF') }}
      SANITIZER_REALTIME: ${{ inputs.sanitizer_realtime }}
    steps:
      - name: Validate shaped capture partition cardinality
        run: |
          case "$CALIBRATION_SHARDS" in
            2) ;;
            4)
              if [ '${{ inputs.build_type }}' != Debug ] || [ '${{ inputs.calibration_section }}' != shaped ] || { [ "$CI_SCOPE" != calibration ] && [ "$CI_SCOPE" != calibration-aggregate ]; }; then
                echo '::error::Four shaped parts require Debug shaped calibration or its aggregate.'
                exit 2
              fi ;;
            *) echo '::error::calibration_shards must be 2 or 4.'; exit 2 ;;
          esac
      - name: Restrict passive core observation to its matched scope
        if: inputs.core_process_observation
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$CI_SCOPE" != core ] || [ "$DATAPUMP_SANITIZERS" != OFF ] || [ '${{ inputs.linux_runner }}' != ubuntu-24.04 ]; then
            echo '::error::Passive core observation requires manual Release core coverage on ubuntu-24.04'
            exit 2
          fi
      - name: Restrict planned Debug core partitions
        if: inputs.core_part != 'all'
        run: |
          if [ "$CI_SCOPE" != core ] || [ '${{ inputs.build_type }}' != Debug ] || { [ "$CORE_PART" != 0 ] && [ "$CORE_PART" != 1 ]; } || [ '${{ inputs.core_process_observation }}' = true ] || [ '${{ inputs.paced_backlog }}' = true ] || [ '${{ inputs.paced_context_focus }}' = true ] || [ '${{ inputs.paced_callback_probe }}' = true ] || [ '${{ inputs.paced_mutex_focus }}' = true ] || [ '${{ inputs.paced_snapshot_focus }}' = true ] || [ '${{ inputs.paced_callback_focus }}' = true ]; then
            echo '::error::core_part 0/1 requires core on Debug with diagnostic observers disabled.'
            exit 2
          fi
      - name: Restrict matched Live drain diagnosis
        if: inputs.scope == 'live-drain-diagnostic' && (github.event_name != 'workflow_dispatch' || inputs.build_type != 'Release' || inputs.linux_runner != 'ubuntu-24.04')
        run: |
          echo '::error::Matched Live drain diagnosis requires manual Release on standard ubuntu-24.04.'
          exit 2
      - name: Restrict matched Release drain scheduling diagnosis
        if: inputs.scope == 'release-drain-scheduling-diagnostic' && (github.event_name != 'workflow_dispatch' || inputs.build_type != 'Release' || inputs.linux_runner != 'ubuntu-24.04' || inputs.sanitizer_realtime)
        run: |
          echo '::error::Matched Release drain scheduling diagnosis requires manual Release, sanitizer_realtime=false, on standard ubuntu-24.04.'
          exit 2
      - name: Restrict the temporary graceful-stop diagnostic
        if: inputs.scope == 'gui-stop-diagnostic' && (github.event_name != 'workflow_dispatch' || inputs.build_type != 'Debug' || inputs.linux_runner != 'ubuntu-24.04')
        run: |
          echo '::error::The temporary stop diagnostic requires manual Debug on ubuntu-24.04.'
          exit 2
      - name: Restrict the current-wave GUI stop capture
        if: inputs.scope == 'gui-stop-current-wave' && (github.event_name != 'workflow_dispatch' || inputs.build_type != 'Debug' || inputs.linux_runner != 'ubuntu-24.04')
        run: |
          echo '::error::The current-wave GUI stop capture requires manual Debug on ubuntu-24.04.'
          exit 2
      - name: Restrict the framed census marker
        if: always() && inputs.stop_group == 'framed-4e-census' && inputs.scope != 'simulation-first-transition-diagnostic'
        run: |
          echo '::error::The framed census marker requires its manual first-transition diagnostic scope.'
          exit 2
      - name: Restrict the first-transition diagnostic
        if: inputs.scope == 'simulation-first-transition-diagnostic' && (github.event_name != 'workflow_dispatch' || inputs.build_type != 'Debug' || inputs.linux_runner != 'ubuntu-24.04')
        run: |
          echo '::error::The first-transition diagnostic requires manual Debug on ubuntu-24.04.'
          exit 2
      - name: Restrict the production simulation-clock component route
        if: inputs.scope == 'simulation-clock-diagnostic' && (github.event_name != 'workflow_dispatch' || inputs.build_type != 'Debug' || inputs.linux_runner != 'ubuntu-24.04')
        run: |
          echo '::error::The production component route requires manual Debug on ubuntu-24.04.'
          exit 2
      - name: Restrict the native peak lease diagnostic
        if: inputs.scope == 'native-peak-lease-diagnostic' && (github.event_name != 'workflow_dispatch' || inputs.build_type != 'Debug' || inputs.linux_runner != 'ubuntu-24.04')
        run: |
          echo '::error::The native peak lease diagnostic requires manual Debug on ubuntu-24.04.'
          exit 2
      - name: Restrict the acquisition partition diagnostic
        if: inputs.scope == 'simulation-acquisition-partition-diagnostic' && (github.event_name != 'workflow_dispatch' || inputs.build_type != 'Debug' || inputs.linux_runner != 'ubuntu-24.04')
        run: |
          echo '::error::The acquisition partition diagnostic requires manual Debug on ubuntu-24.04.'
          exit 2
      - name: Restrict focused Symbol Burst Live qualification to Debug
        if: inputs.scope == 'symbol-burst-live' && inputs.build_type != 'Debug'
        run: |
          echo '::error::The focused Symbol Burst Live qualification requires Debug with ASan/UBSan.'
          exit 2
      - name: Restrict paced Symbol Burst backlog diagnostics
        if: always() && inputs.paced_backlog && (github.event_name != 'workflow_dispatch' || inputs.scope != 'symbol-burst-live' || inputs.build_type != 'Debug' || inputs.linux_runner != 'ubuntu-24.04')
        run: |
          echo '::error::Paced Symbol Burst diagnostics require manual symbol-burst-live on Debug and ubuntu-24.04.'
          exit 2
      - name: Restrict paced original-context focus
        if: always() && inputs.paced_context_focus && (!inputs.paced_backlog || github.event_name != 'workflow_dispatch' || inputs.scope != 'symbol-burst-live' || inputs.build_type != 'Debug' || inputs.linux_runner != 'ubuntu-24.04' || inputs.paced_mutex_focus || inputs.paced_snapshot_focus || inputs.paced_callback_focus)
        run: |
          echo '::error::Paced original-context focus requires manual Debug symbol-burst-live on ubuntu-24.04, backlog enabled, and all other focus modes disabled.'
          exit 2
      - name: Restrict paced callback timing probes
        if: always() && inputs.paced_callback_probe && (!inputs.paced_backlog || github.event_name != 'workflow_dispatch' || inputs.scope != 'symbol-burst-live' || inputs.build_type != 'Debug' || inputs.linux_runner != 'ubuntu-24.04')
        run: |
          echo '::error::Callback probes require manual paced symbol-burst-live on Debug and ubuntu-24.04.'
          exit 2
      - name: Restrict paired tone numeric capture
        if: inputs.scope == 'correlator-tone-diagnostic' && (github.event_name != 'workflow_dispatch' || inputs.build_type != 'Release' || inputs.linux_runner != 'ubuntu-24.04')
        run: |
          echo '::error::Tone numeric capture requires manual Release on standard ubuntu-24.04.'
          exit 2
      - name: Restrict paced mutex focus
        if: always() && inputs.paced_mutex_focus && (!inputs.paced_callback_probe || !inputs.paced_backlog || github.event_name != 'workflow_dispatch' || inputs.scope != 'symbol-burst-live' || inputs.build_type != 'Debug' || inputs.linux_runner != 'ubuntu-24.04')
        run: |
          echo '::error::Paced mutex focus requires manual paced symbol-burst-live on Debug and ubuntu-24.04 with callback probes enabled.'
          exit 2
      - name: Restrict paced Snapshot focus
        if: always() && inputs.paced_snapshot_focus && (inputs.paced_mutex_focus || !inputs.paced_callback_probe || !inputs.paced_backlog || github.event_name != 'workflow_dispatch' || inputs.scope != 'symbol-burst-live' || inputs.build_type != 'Debug' || inputs.linux_runner != 'ubuntu-24.04')
        run: |
          echo '::error::Snapshot focus requires manual Debug on ubuntu-24.04, callback/backlog enabled and mutex wrapper disabled.'
          exit 2
      - name: Restrict paced plain callback focus
        if: always() && inputs.paced_callback_focus && (!inputs.paced_callback_probe || !inputs.paced_backlog || inputs.paced_mutex_focus || inputs.paced_snapshot_focus || github.event_name != 'workflow_dispatch' || inputs.scope != 'symbol-burst-live' || inputs.build_type != 'Debug' || inputs.linux_runner != 'ubuntu-24.04')
        run: |
          echo '::error::Plain callback focus requires manual symbol-burst-live on Debug and ubuntu-24.04 with backlog/callback probes enabled and mutex/Snapshot focus disabled.'
          exit 2
      - name: Validate manual package configuration
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'package' && inputs.build_type != 'Release'
        run: |
          echo '::error::The package scope requires build_type=Release.'
          exit 2
      - name: Load current package-fetch helper before installing Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .ci-bootstrap
          sparse-checkout: tools/ci-apt.sh
          sparse-checkout-cone-mode: false
      - name: Restrict the matched stop differential diagnostic
        if: inputs.scope == 'gui-stop-differential' && (github.event_name != 'workflow_dispatch' || inputs.build_type != 'Debug' || inputs.linux_runner != 'ubuntu-24.04')
        run: |
          echo '::error::The matched stop diagnostic requires manual Debug on ubuntu-24.04.'
          exit 2
      - name: Prepare build dependencies
        run: |
          cp .ci-bootstrap/tools/ci-apt.sh "$RUNNER_TEMP/ci-apt.sh"
          sh "$RUNNER_TEMP/ci-apt.sh" install ca-certificates curl git cmake ninja-build make g++-11 binutils libssl-dev libasound2-dev libx11-dev libxft-dev libxext-dev libxrender-dev libxcursor-dev libxfixes-dev libxinerama-dev libncurses-dev libsdl2-dev xvfb xauth fontconfig-config fonts-dejavu-core python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ (inputs.scope == 'simulation-capacity-shape-diagnostic' || inputs.scope == 'simulation-acquisition-partition-diagnostic') && 16 || 1 }}
      - name: Set container-local smoke evidence paths
        run: |
          printf 'DATAPUMP_CI_SMOKE_WARNINGS_DIR=%s/build/ci-smoke-results\n' "$PWD" >> "$GITHUB_ENV"
          printf 'DATAPUMP_CI_SMOKE_RUNNER=%s/tools/run-gui-smoke.py\n' "$PWD" >> "$GITHUB_ENV"
      - name: Fetch the immutable Live drain application preimage
        if: inputs.scope == 'live-drain-diagnostic'
        run: git -c safe.directory="$PWD" fetch --no-tags --depth=1 origin 3611f0cf0ae066d6d9679cdee8447b73b66468c7
      - name: Install the pinned dependency scanner
        run: |
          sh tools/install-release-cmake.sh "$GITHUB_WORKSPACE/build/ci-cmake"
          echo "$GITHUB_WORKSPACE/build/ci-cmake/bin" >> "$GITHUB_PATH"
      - name: Prepare the pinned CPU framebuffer host
        if: inputs.scope == 'package' || inputs.scope == 'frontends'
        run: |
          python3 -B tools/prepare-native-sdl.py "$GITHUB_WORKSPACE/build/native-sdl" --cc gcc-11 --cxx g++-11 --jobs "$(python3 -B tools/build_capacity.py)"
          echo "DATAPUMP_NATIVE_SDL_ROOT=$GITHUB_WORKSPACE/build/native-sdl/install" >> "$GITHUB_ENV"
      - name: Prepare the JavaScript test host
        if: inputs.scope == 'web'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Prepare current-source GUI stop wave capture
        if: inputs.scope == 'gui-stop-current-wave'
        run: python3 -B tools/gui-stop-current-wave.py prepare --root "$PWD" --report "$PWD/build/gui-stop-current"
      - name: Prepare the exact isolated graceful-stop source variant
        if: inputs.scope == 'gui-stop-diagnostic'
        env:
          APPLY_GUI_STOP_VARIANT: '1'
        run: |
          python3 -B - <<'PY_STOP_PREPARE'
          if not __debug__: raise RuntimeError("optimized diagnostic preparation is forbidden")
          from pathlib import Path
          import difflib, hashlib, json, os
          import subprocess
          root=Path.cwd()
          git=['git','-c','safe.directory='+str(root)]
          assert subprocess.check_output(git+['status','--porcelain=v1','--untracked-files=all'],text=True)=='', 'diagnostic requires clean checkout'
          report=Path('build/gui-stop-diagnostic');report.mkdir(parents=True,exist_ok=False)
          (report/'source.txt').write_text(subprocess.check_output(git+['rev-parse','HEAD'],text=True))

