                  f"unexpected test executable: {test}"
              )
          PYINVENTORY
          ctest --test-dir build --output-on-failure --no-tests=error --parallel 1 --timeout 3600 --output-junit "$PWD/build/eme-probability-diagnostics/results.xml" -R "$selector" > "$report/ctest.log" 2>&1
          python3 - "$report/results.xml" <<'PYRESULTS'
          if not __debug__: raise RuntimeError("EME probability JUnit validation requires assertions")
          import sys
          import xml.etree.ElementTree as ET
          expected = {"frequency_axis_probability"}
          suite = ET.parse(sys.argv[1]).getroot()
          assert suite.tag == "testsuite", f"unexpected JUnit root: {suite.tag}"
          cases = suite.findall(".//testcase")
          names = [case.get("name") for case in cases]
          assert len(names) == len(expected), f"wrong JUnit case count: {names}"
          assert len(set(names)) == len(expected), f"duplicate JUnit cases: {names}"
          assert set(names) == expected, f"wrong JUnit cases: {names}"
          assert all(case.get("status") == "run" for case in cases), f"JUnit contains a case that did not run: {[(case.get('name'), case.get('status')) for case in cases]}"
          for case in cases:
              assert not any(case.find(tag) is not None for tag in ("skipped", "failure", "error")), f"JUnit case did not pass: {case.get('name')}"
          counts = {"tests": len(cases), "failures": sum(case.find("failure") is not None for case in cases), "errors": sum(case.find("error") is not None for case in cases), "skipped": sum(case.find("skipped") is not None for case in cases)}
          for name, actual in counts.items():
              assert int(suite.get(name, "0")) == actual, f"JUnit {name} count does not match its test cases"
          assert int(suite.get("disabled", "0")) == 0, "JUnit reports disabled tests"
          PYRESULTS
