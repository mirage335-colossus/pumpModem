          jobs=subprocess.check_output(['python3','-B','tools/build_capacity.py'],text=True).strip()
          results=[]
          try:
              for radius in ['.988','.984','.981']:
                  changed=original.replace(before,b'inline constexpr double pattern_pcm_radius_limit = '+radius.encode()+b';')
                  header.write_bytes(changed)
                  prefix=report/('radius-'+radius[1:]); prefix.with_suffix('.patch').write_bytes(subprocess.check_output(git+['diff','--binary','--',str(header)]))
                  subprocess.run(['cmake','--build','build','--target','test_alsa_audio','--parallel',jobs],check=True)
                  with prefix.with_suffix('.log').open('w') as log:
                      run=subprocess.run(['./build/test_alsa_audio','--dsss-clipping-diagnostic'],stdout=log,stderr=subprocess.STDOUT)
                  lines=prefix.with_suffix('.log').read_text().splitlines()
                  assert sum(line.startswith('clipping_diagnostic_complete ') for line in lines)==1, 'incomplete source-radius measurement'
                  phases=[line for line in lines if line.startswith('clipping_diagnostic_phase ')]
