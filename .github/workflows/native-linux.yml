          assert manifest["tool_sha256"] == expected_tool
          assert manifest["extension_tool_sha256"] == expected_extension_tool
          assert manifest["support_sha256"] == expected_header
          assert manifest["field_contract_sha256"] == expected_field_contract
          assert hashlib.sha256((root / "tools/owner-census-diagnostic/prepare.py").read_bytes()).hexdigest() == expected_tool
          assert hashlib.sha256((root / "tools/owner-census-diagnostic/ledger_extension.py").read_bytes()).hexdigest() == expected_extension_tool
          assert hashlib.sha256((root / "tools/owner-census-diagnostic/owner_census_probe.hpp").read_bytes()).hexdigest() == expected_header
