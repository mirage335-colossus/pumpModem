              names=[test['name'] for test in json.loads((report/'inventory.json').read_text())['tests']]
              assert len(names)==2 and set(names)=={'sched_hop_transmit','sched_hop_receiver'},names
              with (report/'control.log').open('w') as log:
                  run=subprocess.run(['ctest','--test-dir','build','--output-on-failure','--no-tests=error','--parallel','1','--timeout','3600',
                      '--output-junit',str(report/'results.xml'),'-R',selector],stdout=log,stderr=subprocess.STDOUT)
              exit_code=run.returncode;result['test_exit']=exit_code
          finally:
              assert hashlib.sha256(header.read_bytes()).hexdigest()==changed_hash,'unexpected control-header mutation; preserve evidence'
              header.write_bytes(original)
              subprocess.run(git+['diff','--exit-code'],check=True)
              result['original_source_restored']=True
              (report/'result.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result),flush=True)
          raise SystemExit(exit_code)
          PYCONTROL
