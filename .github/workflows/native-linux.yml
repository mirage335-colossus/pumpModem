              const auto diagnostic_request_started=std::chrono::steady_clock::now();
              const auto diagnostic_transmission_id=controller.snapshot().transmission_id;
              const auto diagnostic_snapshot=[&](const char* phase) {
                  if(!stop_diagnostic||!delayed_arrival)return;
