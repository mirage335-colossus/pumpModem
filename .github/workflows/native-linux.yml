        id: paced_burst
        if: success() && inputs.paced_backlog && !inputs.paced_callback_focus && !inputs.paced_mutex_focus && !inputs.paced_snapshot_focus && !cancelled()
        timeout-minutes: 95
        env:
          PACED_SCOPE: ${{ inputs.scope }}
          PACED_BUILD_TYPE: ${{ inputs.build_type }}
          PACED_LINUX_RUNNER: ${{ inputs.linux_runner }}
          PACED_CONTEXT_FOCUS: ${{ inputs.paced_context_focus }}
          PACED_CALLBACK_PROBE: ${{ inputs.paced_callback_probe }}
        run: |
          set -euo pipefail
          python3 -B - "$PWD" <<'PY_PACED_BURST'
          import datetime, hashlib, json, os, pathlib, signal, subprocess, sys, time

          root = pathlib.Path(sys.argv[1]).resolve()
          report = root / 'build/symbol-burst-live-qualification/paced'
          report.mkdir(parents=True, exist_ok=True)
          binary = root / 'build/test_symbol_burst_live'
          source = root / 'tests/test_symbol_burst_live.cpp'
          parent_report = report.parent
          cache = root / 'build/CMakeCache.txt'
          for name in ('source.txt', 'source-tree.txt', 'CMakeCache.txt', 'source-inventory.json'):
              source_file = parent_report / name
              if not source_file.is_file():
                  raise SystemExit(f'missing original qualification evidence: {source_file}')
              (report / name).write_bytes(source_file.read_bytes())
          if not binary.is_file() or not source.is_file():
              raise SystemExit('missing built Symbol Burst test or its source')
          inputs = {
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'event_name': os.environ['GITHUB_EVENT_NAME'],
              'scope': os.environ['PACED_SCOPE'],
              'build_type': os.environ['PACED_BUILD_TYPE'],
              'linux_runner': os.environ['PACED_LINUX_RUNNER'],
              'source_commit': (report / 'source.txt').read_text().strip(),
              'source_tree': (report / 'source-tree.txt').read_text().strip(),
              'cmake_cache_sha256': hashlib.sha256(cache.read_bytes()).hexdigest(),
              'test_source_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
              'binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
          }
          (report / 'inputs.json').write_text(json.dumps(inputs, indent=2) + '\n')
          selectors = ('--paced-plain-off', '--paced-plain-on', '--paced-keyed-off', '--paced-keyed-on', '--paced-keyed-on-follow',
                       '--paced-held-plain-off', '--paced-held-plain-on', '--paced-held-keyed-off', '--paced-held-keyed-on')
          context_focus = os.environ.get('PACED_CONTEXT_FOCUS') == 'true'
          callback_probe = os.environ.get('PACED_CALLBACK_PROBE') == 'true'
          results = []
          for index, selector in enumerate(selectors, 1):
              stem = f'{index:02d}-{selector[2:]}'
              trace_path = report / f'{stem}.trace.jsonl' if index == 5 else None
              command = [str(binary), selector]
              if context_focus and index == len(selectors) and callback_probe:
                  command.append('--pacing-probe')
              if trace_path is not None:
                  command.append('--trace=' + str(trace_path))
              stdout_path, stderr_path = report / f'{stem}.stdout.log', report / f'{stem}.stderr.log'
              started = datetime.datetime.now(datetime.timezone.utc).isoformat()
              start = time.monotonic()
              timed_out = False
              timeout_kill = False
              launch_error = None
              returncode = None
              process = None
              cleanup_deadline = None
              with stdout_path.open('wb') as stdout, stderr_path.open('wb') as stderr:
                  try:
                      process = subprocess.Popen(command, cwd=root, stdout=stdout,
                                                stderr=stderr, start_new_session=True)
                      try:
                          returncode = process.wait(timeout=600)
                      except subprocess.TimeoutExpired:
                          timed_out = True
                          cleanup_deadline = time.monotonic() + 10
                          try:
                              os.killpg(process.pid, signal.SIGTERM)
                          except ProcessLookupError:
                              pass
                          try:
                              returncode = process.wait(timeout=max(0, cleanup_deadline - time.monotonic()))
                          except subprocess.TimeoutExpired:
                              timeout_kill = True
                              try:
                                  os.killpg(process.pid, signal.SIGKILL)
                              except ProcessLookupError:
                                  pass
                              returncode = process.wait()
                  except Exception as error:
                      launch_error = f'{type(error).__name__}: {error}'
                  finally:
                      # Close the private process group even if wait raised an
                      # unexpected exception. Reap the leader before continuing.
                      if process is not None:
                          if cleanup_deadline is None:
                              cleanup_deadline = time.monotonic() + 10
                          try:
                              os.killpg(process.pid, signal.SIGTERM)
                          except ProcessLookupError:
                              pass
                          try:
                              returncode = process.wait(timeout=max(0, cleanup_deadline - time.monotonic()))
                          except subprocess.TimeoutExpired:
                              timeout_kill = True
                              try:
                                  os.killpg(process.pid, signal.SIGKILL)
                              except ProcessLookupError:
                                  pass
                              returncode = process.wait()
                          while time.monotonic() < cleanup_deadline:
                              try:
                                  os.killpg(process.pid, 0)
                              except ProcessLookupError:
                                  break
                              time.sleep(0.1)
                          else:
                              try:
                                  os.killpg(process.pid, signal.SIGKILL)
                              except ProcessLookupError:
                                  pass
              elapsed = time.monotonic() - start
              ended = datetime.datetime.now(datetime.timezone.utc).isoformat()
              summaries = []
              parse_errors = []
              with stdout_path.open('r', encoding='utf-8', errors='replace') as stream:
                  for line_number, line in enumerate(stream, 1):
                      if line.startswith('PACED_BURST_JSON '):
                          try:
                              value = json.loads(line[len('PACED_BURST_JSON '):])
                              if not isinstance(value, dict):
                                  raise ValueError('summary JSON is not an object')
                              summaries.append({'line': line_number, 'value': value})
                          except Exception as error:
                              parse_errors.append(f'line {line_number}: {type(error).__name__}: {error}')
              summary = summaries[0]['value'] if len(summaries) == 1 else None
              trace_validation = None
              if trace_path is not None:
                  trace_validation = {'complete': False, 'error': None}
                  try:
                      records = [json.loads(line) for line in trace_path.read_text().splitlines()]
                      begins = [row for row in records if row.get('event') == 'trace_begin']
                      ends = [row for row in records if row.get('event') == 'trace_end']
                      seals = []
                      for line in stderr_path.read_text().splitlines():
                          if line.startswith('{"event":"trace_finalization",'):
                              seals.append(json.loads(line))
                      if len(begins) != 1 or len(ends) != 1 or len(seals) != 1:
                          raise ValueError('trace requires exactly one begin, end and external finalization seal')
                      begin, end, seal = begins[0], ends[0], seals[0]
                      attempted = end['attempted']
                      sequences = sorted(row['sequence'] for row in records if 'sequence' in row)
                      if sequences != list(range(1, attempted + 1)):
                          raise ValueError('trace sequence census differs from attempted records')
                      if not (begin['token'] == end['token'] == seal['token'] and
                              end['dropped'] == seal['dropped'] == 0 and
                              end['attempted'] == seal['attempted'] and
                              not end['size_limited'] and not seal['size_limited'] and
                              not end['prior_io_failed'] and not seal['prior_io_failed'] and
                              seal['flush_ok'] and seal['close_ok'] and seal['result'] == 'complete' and
                              seal['path'] == str(trace_path)):
                          raise ValueError('trace footer or finalization seal is incomplete or mismatched')
                      trace_validation.update(complete=True, records=attempted, token=begin['token'])
                  except Exception as error:
                      trace_validation['error'] = f'{type(error).__name__}: {error}'
              exit_ok = returncode == 0
              functional_ok = bool(summary and summary.get('functional') == 'pass')
              held_acceptance = None
              held_acceptance_ok = True
              if selector.startswith('--paced-held-'):
                  health = summary.get('health') if isinstance(summary, dict) else None
                  held_on = selector.endswith('-on')
                  held_checks = {
                      'functional_pass': functional_ok,
                      'pacing_valid': isinstance(summary, dict) and summary.get('pacing_valid') is True,
                      'no_health_fault': isinstance(health, dict) and
                          health.get('input_overruns') == 0 and health.get('dropped_samples') == 0 and
                          health.get('input_interrupted') is False and health.get('search_limited') is False and
                          health.get('receiver_reset') is False,
                      'not_follow_trace': isinstance(summary, dict) and summary.get('diagnostic_follow') is False,
                      'observation_failures_zero': isinstance(summary, dict) and summary.get('observation_failures') == 0,
                      'hold_enabled': isinstance(summary, dict) and summary.get('decoder_hold_enabled') is True,
                      'held_result': isinstance(summary, dict) and summary.get('classification') ==
                          ('observed' if held_on else 'control_no_rescue_claim'),
                      'held_evidence_count': isinstance(summary, dict) and
                          summary.get('cleared_poststartup_gaps', 0) >= 3 if held_on else
                          isinstance(summary, dict) and summary.get('decoder_hold_released', 0) >= 3,
                  }
                  held_acceptance_ok = all(held_checks.values())
                  held_acceptance = {'checks': held_checks, 'accepted': held_acceptance_ok}
              complete = (not timed_out and not launch_error and exit_ok and len(summaries) == 1 and
                          not parse_errors and functional_ok and held_acceptance_ok and
                          (trace_validation is None or trace_validation['complete']))
              result = {
                  'selector': selector,
                  'command': command,
                  'selective_trace': trace_path is not None,
                  'trace_file': trace_path.name if trace_path else None,
                  'trace_sha256': hashlib.sha256(trace_path.read_bytes()).hexdigest() if trace_path and trace_path.is_file() else None,
                  'trace_validation': trace_validation,
                  'started_utc': started,
                  'ended_utc': ended,
                  'elapsed_seconds': elapsed,
                  'exit_code': returncode,
                  'signal': -returncode if returncode is not None and returncode < 0 else None,
                  'timed_out': timed_out,
                  'timeout_exit_code': (137 if timeout_kill else 124) if timed_out else None,
                  'launch_error': launch_error,
                  'stdout_file': stdout_path.name,
                  'stderr_file': stderr_path.name,
                  'stdout_sha256': hashlib.sha256(stdout_path.read_bytes()).hexdigest(),
                  'stderr_sha256': hashlib.sha256(stderr_path.read_bytes()).hexdigest(),
                  'summary_count': len(summaries),
                  'summary_parse_errors': parse_errors,
                  'summary': summary,
                  'functional_ok': functional_ok,
                  'held_acceptance': held_acceptance,
                  'diagnostic_complete': complete,
              }
              (report / f'{stem}.json').write_text(json.dumps(result, indent=2) + '\n')
              results.append(result)
          manifest = {'inputs': inputs, 'results': results,
                      'all_functional_runs_complete': all(row['diagnostic_complete'] for row in results)}
          if context_focus:
              manifest.update(diagnostic_route='paced-original-context',
                              runtime_probe_arm='on' if callback_probe else 'off')
          (report / 'results.json').write_text(json.dumps(manifest, indent=2) + '\n')
          summary_path = pathlib.Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary_path.open('a', encoding='utf-8') as stream:
              stream.write(('Paced Symbol Burst original-context diagnostics (all nine original selectors and order; only the ninth process may use the pacing probe):\n\n' if context_focus else 'Paced Symbol Burst backlog diagnostics (four baseline processes, keyed-On full-input trace, then four receiver-held cases):\n\n'))
              for row in results:
                  value = row['summary'] or {}
                  stream.write(f"- `{row['selector']}`: exit={row['exit_code']}, timeout={row['timed_out']}, "
                               f"functional={value.get('functional', 'missing')}, "
                               f"classification={value.get('classification', 'missing')}, "
                               f"held_acceptance={(row.get('held_acceptance') or {}).get('accepted', 'n/a')}, "
                               f"complete={row['diagnostic_complete']}\n")
              stream.write('\nPacing classifications are diagnostic observations, not qualification or performance claims.\n')
          if not manifest['all_functional_runs_complete']:
              raise SystemExit('FATAL: one or more paced Symbol Burst runs timed out, failed, or lacked exactly one valid functional summary')
          PY_PACED_BURST
