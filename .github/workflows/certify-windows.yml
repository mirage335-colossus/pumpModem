name: Certify Windows source and published archive

on:
  workflow_call:
    inputs:
      backend:
        type: string
        required: true
      target:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      tooling_sha:
        type: string
        required: true
      release_tag:
        type: string
        required: true
      inventory_sha256:
        type: string
        required: true
      windows_runner:
        type: string
        default: windows-latest-h
      scope:
        description: 'main source/package checks, independent calibration, or independent frontends'
        type: string
        default: main
      frontends:
        description: 'Release inventory requires the terminal and framebuffer applications'
        type: boolean
        default: false
    outputs:
      warnings:
        description: 'Exact, scoped hosted-graphics exceptions for the certificate'
        value: ${{ jobs.windows.outputs.warnings }}

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 / ${{ inputs.backend }} / ${{ inputs.scope }}
    runs-on: ${{ inputs.windows_runner }}
    timeout-minutes: 120
    outputs:
      warnings: ${{ steps.graphics.outputs.warnings || '[]' }}
    env:
      DATAPUMP_CI_SMOKE_WARNINGS_DIR: ${{ github.workspace }}/build/ci-smoke-results
      DATAPUMP_CI_SMOKE_RUNNER: ${{ github.workspace }}/.certification-tools/tools/run-gui-smoke.py
      DATAPUMP_SMOKE_TARGET: ${{ inputs.target }}
      DATAPUMP_SMOKE_SCOPE: source/native
      DATAPUMP_SMOKE_SOURCE_SHA: ${{ inputs.source_sha }}
      DATAPUMP_SMOKE_INVENTORY_SHA256: ${{ inputs.inventory_sha256 }}
      VCPKG_DISABLE_METRICS: '1'
      UseMultiToolTask: 'true'
      EnforceProcessCountAcrossBuilds: 'true'
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      GUI_BACKEND: ${{ inputs.backend }}
      RELEASE_TARGET: ${{ inputs.target }}
      INVENTORY_SHA256: ${{ inputs.inventory_sha256 }}
      CERTIFICATION_SCOPE: ${{ inputs.scope }}
    steps:
      - name: Validate certification scope
        shell: pwsh
        run: |
          if ($env:CERTIFICATION_SCOPE -notin @('main', 'calibration', 'frontends')) { throw 'Unsupported certification scope' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Load current runner tooling without changing the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tooling_sha }}
          path: .certification-tools
      - name: Verify smoke policy and registered-test orchestration on Windows
        if: inputs.scope == 'main'
        shell: pwsh
        run: |
          python .certification-tools/tests/test_gui_smoke_runner.py
          if ($LASTEXITCODE -ne 0) { throw 'Smoke policy fixtures failed' }
          python .certification-tools/tests/test_native_tests_runner.py
          if ($LASTEXITCODE -ne 0) { throw 'Native orchestration fixtures failed' }
      - name: Reuse this release's verified static dependencies (legacy base fallback)
        shell: pwsh
        run: |
          # Keep the release's recipe identity, with current runner discovery.
          # Releases predating dependency bases retain the existing fallback.
          $recipeRoot = if (Test-Path tools/windows-base.py) { "$PWD" } else { "$PWD/.certification-tools" }
          & ./.certification-tools/tools/use-windows-base.ps1 -SourceRoot $recipeRoot -Repository "$env:GITHUB_REPOSITORY" -Destination "$PWD/build/windows-base" -ReleaseTag "$env:RELEASE_TAG" -InventorySha256 "$env:INVENTORY_SHA256"
      - name: Configure the pinned Windows source and dependency recipe
        shell: pwsh
        run: |
          $frontendOptions = @()
          if ('${{ inputs.frontends }}' -eq 'true') { $frontendOptions = @('-DDATAPUMP_BUILD_TUI=ON', '-DDATAPUMP_BUILD_FB=ON') }
          # This exact source is immutable after configure. Avoid parallel VS
          # projects racing to restore CMake's shared regeneration timestamp.
          cmake -S . -B build/release-windows -A x64 -DCMAKE_SUPPRESS_REGENERATION=ON -DCMAKE_TOOLCHAIN_FILE="$env:DATAPUMP_WINDOWS_TOOLCHAIN" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DDATAPUMP_GUI_BACKEND="$env:GUI_BACKEND" -DDATAPUMP_PORTABLE=ON -DDART_TESTING_TIMEOUT=3600 -DDATAPUMP_TEST_NATIVE_GUI=ON -DGUI_SMOKE_TIMEOUT=600 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded @frontendOptions
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }
          if ($env:CERTIFICATION_SCOPE -eq 'main' -and $env:GUI_BACKEND -eq 'rev') {
            cmake --build build/release-windows --config Release --target test_rev_coordinates --parallel $env:NUMBER_OF_PROCESSORS
            if ($LASTEXITCODE -ne 0) { throw 'Rev native context probe build failed' }
          }
      - name: Classify only the known hosted WGL limitation
        id: graphics
        if: inputs.scope == 'main' && inputs.backend == 'rev'
        shell: pwsh
        run: |
          python .certification-tools/tools/windows-certification.py --executable build/release-windows/Release/test_rev_coordinates.exe
          if ($LASTEXITCODE -ne 0) { throw 'Rev native context or adapter check failed' }
      - name: Build and run required Windows source regressions
        if: inputs.scope == 'main'
        shell: pwsh
        env:
          GUI_SMOKE: ${{ steps.graphics.outputs.gui_smoke || 'ON' }}
        run: |
          cmake --build build/release-windows --config Release --target datapump-apps datapump-tests-contract datapump-tests-gui datapump-tests-packaging --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          # Only native graphics are unavailable after the exact WGL warning.
          # Headless GUI, CLI, modem, package and calibration checks stay required.
          $graphicsExclusions = @()
          if ($env:GUI_SMOKE -eq 'OFF') {
            # Clipboard platform conformance does not require OpenGL.
            $graphicsExclusions = @('-E', '^(gui_workflow|gui_adapter_conformance|gui_coordinates_1x|gui_coordinates_2x)$')
          }
          foreach ($group in @('gui', 'contract', 'packaging')) {
            if ($group -eq 'gui' -and $env:GUI_SMOKE -ne 'OFF') {
              python .certification-tools/tools/run-native-tests.py --allow-budget-exhaustion --build-dir build/release-windows --config Release --label gui --exclude-label calibration --report-dir "$env:DATAPUMP_CI_SMOKE_WARNINGS_DIR"
            } else {
              ctest --test-dir build/release-windows -C Release --output-on-failure -L "^$group`$" -LE '^calibration$' @graphicsExclusions --parallel 1 --stop-on-failure --no-tests=error
            }
            if ($LASTEXITCODE -ne 0) { throw "$group tests failed" }
          }
          # Only the exact slow case moves to the required independent job.
          # Keep any other registered calibration cases in this main scope.
          $remainingCalibration = ctest --test-dir build/release-windows -C Release --show-only=json-v1 -L '^(contract|gui|packaging)$' -L '^calibration$' -E '^differential_receiver_probability$' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Calibration inventory failed' }
          if (@($remainingCalibration.tests).Count -gt 0) {
            ctest --test-dir build/release-windows -C Release --output-on-failure -L '^(contract|gui|packaging)$' -L '^calibration$' -E '^differential_receiver_probability$' --parallel 1 --stop-on-failure --no-tests=error
            if ($LASTEXITCODE -ne 0) { throw 'Remaining calibration tests failed' }
          }
      - name: Build and run terminal and framebuffer checks independently
        if: inputs.scope == 'frontends'
        shell: pwsh
        run: |
          if ('${{ inputs.frontends }}' -ne 'true') { throw 'Frontend scope requires declared release inventory' }
          cmake --build build/release-windows --config Release --target datapump-tests-frontends --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
          ctest --test-dir build/release-windows -C Release --output-on-failure -L '^frontends$' --parallel 1 --stop-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed' }
      - name: Record historical frontend coverage
        if: inputs.scope == 'main' && !inputs.frontends
        shell: pwsh
        run: "'This historical release does not declare TUI/framebuffer delivery. No frontend source coverage is claimed.' >> $env:GITHUB_STEP_SUMMARY"
      - name: Build and run the full differential receiver calibration
        if: inputs.scope == 'calibration'
        shell: pwsh
        run: |
          cmake --build build/release-windows --config Release --target test_differential_receiver_probability --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { throw 'Calibration build failed' }
          $registration = ctest --test-dir build/release-windows -C Release --show-only=json-v1 -L '^(contract|gui|packaging)$' -L '^calibration$' -R '^differential_receiver_probability$'
          if ($LASTEXITCODE -ne 0) { throw 'Calibration inventory failed' }
          $registration | Set-Content -LiteralPath build/release-windows/calibration-registration.json -Encoding utf8
          # Use the registered command unchanged: all sections, original worker
          # count, every seed and aggregate assertion, and the original timeout.
          ctest --test-dir build/release-windows -C Release --output-on-failure -L '^(contract|gui|packaging)$' -L '^calibration$' -R '^differential_receiver_probability$' --parallel 1 --stop-on-failure --no-tests=error --output-junit "$PWD/build/release-windows/calibration-results.xml" --output-log "$PWD/build/release-windows/calibration.log"
          if ($LASTEXITCODE -ne 0) { throw 'Full calibration failed' }
      - name: Download and verify the exact published Windows archive
        if: inputs.scope == 'main'
        id: binary
        shell: pwsh
        run: |
          python .certification-tools/tools/certify-release.py download --repo "$env:GITHUB_REPOSITORY" --tag "$env:RELEASE_TAG" --target "$env:RELEASE_TARGET" --directory published --inventory-sha256 "$env:INVENTORY_SHA256" --github-output "$env:GITHUB_OUTPUT"
          if ($LASTEXITCODE -ne 0) { throw 'Published archive verification failed' }
      - name: Test the published GUI, CLI and relocation
        if: inputs.scope == 'main'
        shell: pwsh
        env:
          PACKAGE_ROOT: ${{ steps.binary.outputs.package_root }}
          DATAPUMP_SMOKE_SCOPE: published/source-host
          GUI_SMOKE: ${{ steps.graphics.outputs.gui_smoke || 'ON' }}
        run: |
          cmake -DPACKAGE_ROOT="$env:PACKAGE_ROOT" -DBUILD_DIR="$PWD/build/release-windows" -DGUI_SMOKE="$env:GUI_SMOKE" -DGUI_SMOKE_TIMEOUT=600 -P .certification-tools/tools/verify-native-package.cmake
          if ($LASTEXITCODE -ne 0) { throw 'Published application checks failed' }
      - name: Identify this attempt's smoke coverage artifact
        if: always() && inputs.scope == 'main'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          directory = Path(os.environ['DATAPUMP_CI_SMOKE_WARNINGS_DIR'])
          directory.mkdir(parents=True, exist_ok=True)
          (directory / 'job-coverage.json').write_text(json.dumps({
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT']}))
          PY
      - name: Retain smoke workload coverage and diagnostics
        if: always() && inputs.scope == 'main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: certification-smoke-windows-${{ inputs.backend }}-attempt-${{ github.run_attempt }}
          path: ${{ github.workspace }}/build/ci-smoke-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Retain independent calibration diagnostics
        if: always() && inputs.scope == 'calibration'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: certification-calibration-windows-${{ inputs.backend }}-attempt-${{ github.run_attempt }}
          path: |
            build/release-windows/calibration.log
            build/release-windows/calibration-results.xml
            build/release-windows/calibration-registration.json
            build/release-windows/CMakeCache.txt
            build/release-windows/Testing/Temporary/
            build/release-windows/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 7
      - name: Retain independent terminal and framebuffer diagnostics
        if: always() && inputs.scope == 'frontends'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: certification-frontends-windows-${{ inputs.backend }}-attempt-${{ github.run_attempt }}
          path: |
            build/release-windows/build-info.txt
            build/release-windows/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 7
