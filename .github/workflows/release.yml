name: Manual portable release
run-name: Build portable binaries (${{ inputs.linux_baseline }}, experiment=${{ inputs.experiment }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional release label, for example v001_00; blank uses the CMake version'
        type: string
        default: ''
      experiment:
        description: 'Title exactly experiment; prerelease, never Latest'
        type: boolean
        default: true
      publish:
        description: 'Publish after packaging; unchecked leaves a draft release for inspection'
        type: boolean
        default: true
      linux_baseline:
        description: 'x86-64 SDK (glibc 2.36), or older Ubuntu baseline (glibc 2.35)'
        type: choice
        options: [bookworm-sdk, ubuntu-22.04]
        default: bookworm-sdk
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/certify.yml'
      - 'tools/release.py'
      - 'tools/certify-release.py'
      - 'tests/test_release.py'
      - 'tests/test_certify_release.py'

permissions:
  contents: read

concurrency:
  group: portable-release-${{ github.ref }}-${{ inputs.linux_baseline }}
  cancel-in-progress: false

jobs:
  helpers:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 tests/test_release.py
          python3 tests/test_certify_release.py
          python3 tests/test_sdk_release.py

  metadata:
    if: github.event_name == 'workflow_dispatch'
    needs: helpers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      metadata_json: ${{ steps.meta.outputs.metadata_json }}
      linux_matrix: ${{ steps.meta.outputs.linux_matrix }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record one build date and exact source revision
        id: meta
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          LINUX_BASELINE: ${{ inputs.linux_baseline }}
          EXPERIMENT: ${{ inputs.experiment }}
        run: |
          args=()
          if [ "$EXPERIMENT" = true ]; then args+=(--experiment); fi
          python3 tools/release.py metadata --version "$RELEASE_VERSION" \
            --linux-baseline "$LINUX_BASELINE" --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --output release-metadata.json \
            --github-output "$GITHUB_OUTPUT" "${args[@]}"
          python3 - <<'PYMETA'
          import json, os
          metadata = json.load(open('release-metadata.json'))
          sdk = metadata['linux_baseline'] == 'bookworm-sdk'
          matrix = {'include': [
              {'arch': 'x86_64', 'runner': 'ubuntu-24.04', 'image': 'debian:bookworm-slim' if sdk else 'ubuntu:22.04', 'sdk': sdk, 'glibc': '2.36' if sdk else '2.35'},
              {'arch': 'aarch64', 'runner': 'ubuntu-24.04-arm', 'image': 'ubuntu:22.04', 'sdk': False, 'glibc': '2.35'}]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('metadata_json=' + json.dumps(metadata) + '\n')
              out.write('linux_matrix=' + json.dumps(matrix) + '\n')
          PYMETA
      - name: Reserve a draft for direct release-asset uploads
        run: |
          cat > release-details.md <<NOTES
          Download the archive matching your operating system and architecture. Unpack the whole archive and keep bin/ and lib/ together; required application libraries are bundled. Host audio/graphics services and drivers remain required.

          Packaging checks have passed when this release is published. Extensive contract, GUI and copied-binary checks run separately through the Certify published release workflow; its hash-bound reports will be attached here later. Hosted checks do not qualify physical audio hardware.

          The ARM64 bundle requires a compatible 64-bit Linux installation, including Raspberry Pi OS or Velvet OS. Windows requires Windows 10 1903+/11 x64. See [requirements and certification scope](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/releases.md).

          Reusable developer SDKs and their complete source archives are preserved separately in the [base release](https://github.com/$GITHUB_REPOSITORY/releases/tag/base). Application releases never rebuild an SDK automatically.
          NOTES
          python3 tools/release.py reserve --metadata release-metadata.json --notes release-details.md --repo "$GITHUB_REPOSITORY"

  linux:
    needs: metadata
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.linux_matrix) }}
    env:
      DEBIAN_FRONTEND: noninteractive
      GH_TOKEN: ${{ github.token }}
      RELEASE_METADATA: ${{ needs.metadata.outputs.metadata_json }}
    steps:
      - name: Install download and archive inspection prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git gh python3 file binutils make
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch exact SDK from base (no compiler rebuild)
        if: matrix.sdk
        id: sdk
        run: python3 tools/sdk-release.py fetch --binary-only --repo "$GITHUB_REPOSITORY" --directory downloaded-sdk --github-output "$GITHUB_OUTPUT"
      - name: Install verified SDK
        if: matrix.sdk
        env:
          SDK_FOUND: ${{ steps.sdk.outputs.found }}
        run: |
          if [ "$SDK_FOUND" != true ]; then echo 'Run Maintain base SDK for this recipe first.' >&2; exit 1; fi
          set -- downloaded-sdk/datapump-sdk-*-linux-x86_64.tar.gz
          test "$#" -eq 1
          python3 tools/build-sdk.py install --archive "$1" --destination "$GITHUB_WORKSPACE/build/sdk"
          python3 tools/build-sdk.py verify "$GITHUB_WORKSPACE/build/sdk" --max-host-glibc 2.36
      - name: Install native baseline dependencies and pinned scanner
        if: ${{ !matrix.sdk }}
        run: |
          apt-get install -y --no-install-recommends cmake ninja-build g++-11 libssl-dev libasound2-dev libx11-dev libxft-dev libxext-dev libxrender-dev libxcursor-dev libxfixes-dev libxinerama-dev
          sh tools/install-release-cmake.sh "$GITHUB_WORKSPACE/build/ci-cmake"
          echo "$GITHUB_WORKSPACE/build/ci-cmake/bin" >> "$GITHUB_PATH"
      - name: Build application, package and check relocation and ABI
        env:
          USE_SDK: ${{ matrix.sdk }}
          DATAPUMP_MAX_GLIBC: ${{ matrix.glibc }}
        run: |
          if [ "$USE_SDK" = true ]; then
            ./build.sh package --sdk "$GITHUB_WORKSPACE/build/sdk" --build-dir build/release-app --jobs "$(nproc)"
          else
            CC=gcc-11 CXX=g++-11 ./build.sh package --build-dir build/release-app --jobs "$(nproc)"
          fi
      - name: Upload this platform directly to the draft release
        env:
          RELEASE_TARGET: linux-${{ matrix.arch }}
        run: |
          printf '%s\n' "$RELEASE_METADATA" > release-metadata.json
          mkdir build/upload
          cp build/release-app/releases/*.tar.gz build/release-app/releases/*.zip build/release-app/releases/SHA256SUMS.txt build/upload/
          python3 tools/release.py upload --metadata release-metadata.json --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" --directory build/upload

  windows:
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VCPKG_DISABLE_METRICS: '1'
      GH_TOKEN: ${{ github.token }}
      RELEASE_METADATA: ${{ needs.metadata.outputs.metadata_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d # 2026.07.29
          path: .ci-vcpkg
          persist-credentials: false
      - name: Prepare pinned static OpenSSL
        shell: pwsh
        run: |
          & ./.ci-vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          & ./.ci-vcpkg/vcpkg.exe install openssl:x64-windows-static --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw 'OpenSSL build failed' }
      - name: Build and package with the Windows SDK and static runtime
        shell: pwsh
        run: |
          cmake -S . -B build/release-windows -G 'Visual Studio 17 2022' -A x64 -DCMAKE_TOOLCHAIN_FILE="$PWD/.ci-vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DDATAPUMP_PORTABLE=ON -DBUILD_TESTING=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }
          cmake --build build/release-windows --config Release --target package --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          cmake -DARCHIVE_DIR="$PWD/build/release-windows/releases" -DBUILD_DIR="$PWD/build/release-windows" -P tools/verify-native-archives.cmake
          if ($LASTEXITCODE -ne 0) { throw 'Archive checks failed' }
      - name: Upload this platform directly to the draft release
        shell: pwsh
        run: |
          $env:RELEASE_METADATA | Set-Content -Encoding utf8 release-metadata.json
          New-Item -ItemType Directory build/upload | Out-Null
          Copy-Item build/release-windows/releases/*.tar.gz, build/release-windows/releases/*.zip, build/release-windows/releases/SHA256SUMS.txt build/upload/
          python tools/release.py upload --metadata release-metadata.json --repo "$env:GITHUB_REPOSITORY" --target windows-x86_64 --directory build/upload
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }

  publish:
    needs: [metadata, linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_METADATA: ${{ needs.metadata.outputs.metadata_json }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify all uploaded bytes, attach checksums and publish
        run: |
          printf '%s\n' "$RELEASE_METADATA" > release-metadata.json
          args=()
          if [ "$PUBLISH" = true ]; then args+=(--publish); fi
          python3 tools/release.py finalize --metadata release-metadata.json --repo "$GITHUB_REPOSITORY" --directory release-assets "${args[@]}"
          python3 - <<'PYSUMMARY'
          import json, os
          metadata = json.load(open('release-metadata.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"Release: [{metadata['tag']}](https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{metadata['tag']})\n\n")
              out.write('Extensive certification is a separate workflow. Dispatch **Certify published release** with this tag after publication.\n')
          PYSUMMARY
