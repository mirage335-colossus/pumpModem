name: Native Robust bounded regression
'on':
  workflow_call:
    inputs:
      candidate_ref:
        type: string
        default: ''
      reference_ref:
        type: string
        default: ''
    outputs:
      performance_status:
        description: Native measurement status; establishment is not a relative regression pass
        value: ${{ jobs.abbreviated.outputs.performance_status }}
      relative_regression_pass:
        description: True only after an applicable native reference comparison passes
        value: ${{ jobs.abbreviated.outputs.relative_regression_pass }}
  workflow_dispatch:
    inputs:
      reference_ref:
        description: Native reference commit; empty selects the candidate's first parent
        type: string
        default: ''
      establish_baseline:
        description: Diagnostic baseline establishment without a relative regression comparison
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  abbreviated:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      performance_status: ${{ steps.result.outputs.performance_status }}
      relative_regression_pass: ${{ steps.result.outputs.relative_regression_pass }}
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      REFERENCE_REF: ${{ inputs.reference_ref }}
      ESTABLISH_BASELINE: ${{ inputs.establish_baseline || false }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ inputs.candidate_ref || github.sha }}
    - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
      with:
        python-version: '3.12'
    - name: Select native reference or the exact initial port transition
      id: reference
      run: |
        options=()
        if [ "$ESTABLISH_BASELINE" = true ]; then options+=(--establish-baseline); fi
        python tools/triad-ci-reference.py --reference-ref "$REFERENCE_REF" "${options[@]}" --output build/triad-reference-selection.json --github-output "$GITHUB_OUTPUT"
    - name: Install native correctness-test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build g++ pkg-config libssl-dev
    - name: Check canonical source and receiver stages
      run: |
        ./build.sh test triad --cli --build-dir build/triad-candidate --jobs 2 -- -DPython3_EXECUTABLE="$(command -v python)"
        cmake --build build/triad-candidate --target triad_receiver_probe --parallel 2
    - name: Build same-run native reference
      if: steps.reference.outputs.mode == 'compare'
      env:
        REFERENCE_SHA: ${{ steps.reference.outputs.reference_sha }}
      run: |
        git worktree add --detach "$RUNNER_TEMP/triad-reference" "$REFERENCE_SHA"
        (
          cd "$RUNNER_TEMP/triad-reference"
          ./build.sh configure --cli --build-dir "$RUNNER_TEMP/triad-reference-build" --jobs 2 -- -DPython3_EXECUTABLE="$(command -v python)"
          cmake --build "$RUNNER_TEMP/triad-reference-build" --target triad_receiver_probe --parallel 2
        )
    - name: Measure bounded native reference
      if: steps.reference.outputs.mode == 'compare'
      run: |
        python tools/triad_abbreviated.py --output build/triad-reference.json --probe "$RUNNER_TEMP/triad-reference-build/triad_receiver_probe" --device cpu
    - name: Measure bounded native candidate
      env:
        REFERENCE_MODE: ${{ steps.reference.outputs.mode }}
      run: |
        options=()
        if [ "$REFERENCE_MODE" = compare ]; then options+=(--baseline build/triad-reference.json); fi
        python tools/triad_abbreviated.py --output build/triad-abbreviated.json --probe build/triad-candidate/triad_receiver_probe --device cpu "${options[@]}"
    - name: Record exact performance decision
      id: result
      if: always()
      env:
        REFERENCE_MODE: ${{ steps.reference.outputs.mode }}
      run: |
        python - <<'PY'
        import json, os
        from pathlib import Path
        path = Path('build/triad-abbreviated.json')
        result = json.loads(path.read_text()) if path.is_file() else {}
        status = result.get('status', 'not_measured')
        allowed = {'baseline_established', 'baseline_evidence_unresolved', 'inconclusive',
                   'no_material_slowdown_for_measured_kernels', 'material_slowdown',
                   'incomplete', 'unavailable', 'error', 'not_measured'}
        if status not in allowed:
            status = 'error'
        relative_pass = os.environ['REFERENCE_MODE'] == 'compare' and status == 'no_material_slowdown_for_measured_kernels'
        with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
            stream.write(f'performance_status={status}\nrelative_regression_pass={str(relative_pass).lower()}\n')
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
            stream.write(f'Native Robust performance status: **{status}**.\n\n')
            stream.write(f'Relative regression pass: **{str(relative_pass).lower()}**. '
                         'Baseline establishment, incomplete work and uncertainty do not qualify CPU capacity.\n')
        PY
    - name: Retain native evidence and uncertainty
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: triad-abbreviated-${{ github.run_attempt }}
        path: |
          build/triad-abbreviated.json
          build/triad-reference.json
          build/triad-reference-selection.json
          build/triad-candidate/Testing/Temporary/
        if-no-files-found: warn
        retention-days: 7
    - name: Remove temporary reference checkout and build
      if: always()
      run: |
        if [ -d "$RUNNER_TEMP/triad-reference" ]; then
          git worktree remove --force "$RUNNER_TEMP/triad-reference"
        fi
        rm -rf -- "$RUNNER_TEMP/triad-reference-build"
