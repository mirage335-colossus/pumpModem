name: Maintain base SDK

on:
  workflow_call:
    inputs:
      linux_runner:
        description: 'Linux x86_64 runner for compilation and qualification'
        type: string
        default: ubuntu-24.04
      windows_runner:
        description: 'Windows x64 runner for compilation and qualification'
        type: string
        default: windows-2022
      platform:
        description: 'Reusable Linux/Windows dependencies or the separate Wasm SDK'
        type: string
        default: linux
      source:
        description: 'auto reuses base; base verifies durable reuse; rebuild compiles from source'
        type: string
        default: auto
      jobs:
        description: 'Cold SDK compilation jobs; 0 uses all available runner CPUs'
        type: string
        default: '0'
      publish:
        description: 'Preserve the verified SDK and sources in the base release'
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      linux_runner:
        description: 'Linux x86_64 runner for compilation and qualification'
        type: choice
        options: [ubuntu-24.04, ubuntu-latest-m, ubuntu-latest-l, ubuntu-latest-h]
        default: ubuntu-24.04
      windows_runner:
        description: 'Windows x64 runner for compilation and qualification'
        type: choice
        options: [windows-2022, windows-latest-l, windows-latest-h]
        default: windows-2022
      platform:
        description: 'Reusable Linux/Windows dependencies or the separate Wasm SDK'
        type: choice
        options: [linux, windows, wasm, both, all]
        default: linux
      source:
        description: 'auto reuses base; base verifies durable reuse; rebuild compiles from source'
        type: choice
        options: [auto, base, rebuild]
        default: auto
      jobs:
        description: 'Cold SDK compilation jobs; 0 uses all available runner CPUs'
        type: string
        default: '0'
      publish:
        description: 'Preserve the verified SDK and sources in the base release'
        type: boolean
        default: true

  pull_request:
    paths:
      - 'tools/ci-apt.sh'
      - 'tests/test_ci_apt.py'
      - '.github/workflows/sdk-base.yml'
      - '.github/workflows/sdk-build.yml'
      - '.github/workflows/wasm-base.yml'
      - 'tools/wasm-sdk-release.py'
      - 'tools/build-wasm-sdk.py'
      - 'third_party/build-support/wasm-sdk/**'
      - 'tests/test_wasm_sdk_release.py'
      - '.github/workflows/windows-base.yml'
      - 'tools/sdk-release.py'
      - 'tests/test_sdk_release.py'

permissions:
  contents: write

# A single durable base release is shared by all branches.
concurrency:
  group: sdk-base-publication
  cancel-in-progress: false

jobs:
  helper:
    runs-on: ${{ inputs.linux_runner || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tests/test_sdk_release.py
      - run: python3 tests/test_wasm_sdk_release.py
      - run: python3 tests/test_ci_apt.py

  sdk:
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'linux' || inputs.platform == 'both' || inputs.platform == 'all')
    needs: helper
    uses: ./.github/workflows/sdk-build.yml
    with:
      linux_runner: ${{ inputs.linux_runner || 'ubuntu-24.04' }}
      source: ${{ inputs.source }}
      jobs: ${{ inputs.jobs }}
      publish_base: ${{ inputs.publish }}

  windows:
    # Both platforms publish to the same base release; serialize first-time
    # creation too, while allowing Windows-only maintenance to skip Linux.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.helper.result == 'success' && (inputs.platform == 'windows' || ((inputs.platform == 'both' || inputs.platform == 'all') && needs.sdk.result == 'success')) }}
    needs: [helper, sdk]
    uses: ./.github/workflows/windows-base.yml
    with:
      linux_runner: ${{ inputs.linux_runner || 'ubuntu-24.04' }}
      windows_runner: ${{ inputs.windows_runner || 'windows-2022' }}
      source: ${{ inputs.source }}
      publish: ${{ inputs.publish }}

  wasm:
    # Publication uses the same durable shelf; serialize only explicit base maintenance.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.helper.result == 'success' && (inputs.platform == 'wasm' || (inputs.platform == 'all' && needs.windows.result == 'success')) }}
    needs: [helper, windows]
    uses: ./.github/workflows/wasm-base.yml
    with:
      linux_runner: ${{ inputs.linux_runner || 'ubuntu-24.04' }}
      source: ${{ inputs.source }}
      jobs: ${{ inputs.jobs }}
      publish: ${{ inputs.publish }}
