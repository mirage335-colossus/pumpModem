name: FFT normalization diagnostic
on:
  workflow_call:
permissions:
  contents: read
jobs:
  normalization:
    name: GNU11 fixed-work FFT normalization differential
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install compiler and diagnostic tools
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git python3 g++-11 binutils libssl-dev
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Fetch exact immutable normalization baseline
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin 4f8f2703802baf03b9f931d5856e19b70350aa1a
      - name: Compare fixed-work FFT normalization and retain evidence
        run: python3 -B tools/fft-normalization-differential.py --root "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/fft-normalization-results" --compiler g++-11 --iterations 4096
      - name: Preserve all normalization evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fft-normalization-differential-${{ github.run_id }}-${{ github.run_attempt }}
          path: fft-normalization-results
          if-no-files-found: error
          retention-days: 7
