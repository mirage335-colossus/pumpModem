name: Receiver feed partition diagnostic

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact clean source revision for the original and traced builds
        type: string
        required: true
        default: 8c54277ca9ec7bf35dee65126ec0d78f3a484f74
  workflow_call:
    inputs:
      source_sha:
        description: Exact clean source revision for the original and traced builds
        type: string
        required: true

permissions:
  contents: read

jobs:
  diagnostic:
    name: Ubuntu 24.04 / container Ubuntu 22.04 / GCC 11 / Debug ASan+UBSan
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      CC: gcc-11
      CXX: g++-11
      DATAPUMP_SANITIZERS: 'ON'
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Check out diagnostic helper and reviewed overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build and GUI test dependencies
        run: |
          cp tools/ci-apt.sh "$RUNNER_TEMP/ci-apt.sh"
          sh "$RUNNER_TEMP/ci-apt.sh" install ca-certificates curl git cmake ninja-build make g++-11 binutils libssl-dev libasound2-dev libx11-dev libxft-dev libxext-dev libxrender-dev libxcursor-dev libxfixes-dev libxinerama-dev libncurses-dev libsdl2-dev xvfb xauth fontconfig-config fonts-dejavu-core python3
      - name: Check out the helper with Git now available
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the pinned clean source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 1
      - name: Verify both immutable Git checkouts before expensive work
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD
          test "$(git -C source -c safe.directory="$GITHUB_WORKSPACE/source" rev-parse HEAD)" = '${{ inputs.source_sha }}'
      - name: Install the established pinned CMake host
        run: |
          sh tools/install-release-cmake.sh "$RUNNER_TEMP/ci-cmake"
          echo "$RUNNER_TEMP/ci-cmake/bin" >> "$GITHUB_PATH"
      - name: Capture bounded receiver work with all original controller assertions
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/build/receiver-feed-partition-wave"
          python3 -B tools/receiver-feed-partition/run.py \
            --source-root "$GITHUB_WORKSPACE/source" \
            --helper-root "$GITHUB_WORKSPACE" \
            --output "$report"
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: receiver-feed-partition-${{ github.run_id }}
          path: |
            build/receiver-feed-partition-wave
            !build/receiver-feed-partition-wave/build-tree/**
            !build/receiver-feed-partition-wave/working-source/**
          if-no-files-found: warn
          retention-days: 30
