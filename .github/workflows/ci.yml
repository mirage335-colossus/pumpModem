name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitizers: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev python3-tk xvfb xauth
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DDATAPUMP_SANITIZERS=${{ matrix.sanitizers }}
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure --parallel 2
      - run: xvfb-run -a python3 tests/gui_smoke.py --pump build/pump
      - name: Verify offline relocation and GUI
        if: matrix.sanitizers == 'OFF'
        run: xvfb-run -a python3 tests/portable_smoke.py --pump build/pump --gui-smoke
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: vcpkg install openssl:x64-windows-static
      - name: Configure static OpenSSL and CRT
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure --parallel 2
      - name: Verify offline Windows runtime relocation
        run: python tests/portable_smoke.py --pump build/Release/pump.exe
