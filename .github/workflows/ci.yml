name: Focused checks and full native regression

on:
  # Branch pushes are covered by their PR. Automatic work is deliberately
  # bounded; completed candidates use the explicit full manual dispatch.
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'cmake/**'
      - 'third_party/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'build.sh'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'cmake/**'
      - 'third_party/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'build.sh'
  workflow_dispatch:
    inputs:
      linux_runner:
        description: 'Linux x86_64 runner for compilation and qualification'
        type: choice
        options: [ubuntu-24.04, ubuntu-latest-m, ubuntu-latest-l, ubuntu-latest-h]
        default: ubuntu-latest-h
      arm_runner:
        description: 'Linux ARM64 runner for compilation and qualification'
        type: choice
        options: [ubuntu-24.04-arm-l, ubuntu-24.04-arm-h, ubuntu-24.04-arm]
        default: ubuntu-24.04-arm-h
      windows_runner:
        description: 'Windows x64 runner for compilation and qualification'
        type: choice
        options: [windows-2022, windows-latest-l, windows-latest-h]
        default: windows-latest-h
      devfast:
        description: 'Run only the selected focused diagnostic; skip full regression and release work'
        type: boolean
        default: false
      sanitizer_smoke:
        description: 'Run the instrumented desktop smoke as a separate job (full runs only)'
        type: boolean
        default: false
      sanitizer_realtime:
        description: 'Include real-time Fast RX checks in the instrumented Debug job (full runs only)'
        type: boolean
        default: false
      diagnostic:
        description: 'Focused check used only with devfast=true'
        type: choice
        options: [legacy, certification, windows-certification, windows-rev, graphics, arm-rev-package, arm-rev-smoke, arm-rev-adapter, sdk-live, gui-contract, sanitizer-gui, runner-capacity, arm-runner-capacity]
        default: legacy
      diagnostic_release:
        description: 'Published tag for graphics, or immutable source tag/ref for ARM adapter / SDK live diagnostics'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.diagnostic || 'legacy' }}-${{ inputs.devfast && 'devfast' || 'full' }}-${{ !inputs.devfast && inputs.sanitizer_realtime && 'realtime' || 'standard' }}-${{ inputs.sanitizer_smoke && 'sanitizer-smoke' || 'no-sanitizer-smoke' }}-${{ inputs.linux_runner || 'ubuntu-latest-h' }}-${{ inputs.windows_runner || 'windows-latest-h' }}-${{ inputs.arm_runner || 'ubuntu-24.04-arm-h' }}
  cancel-in-progress: true

jobs:
  tooling:
    if: github.event_name != 'workflow_dispatch'
    name: Lightweight build and SDK helper checks (not full regression)
    runs-on: ubuntu-latest-h
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check orchestration with small offline fixtures
        run: |
          python3 tests/test_build_wrapper.py
          python3 tests/test_build_dependencies.py
          python3 tests/test_ci_apt.py
          python3 tests/test_source_sdk.py
          python3 tests/test_sdk_build.py
          python3 tests/test_release_dependencies.py
          python3 tests/test_gui_smoke_runner.py
          python3 tests/test_native_tests_runner.py
          python3 tests/test_ci_tests.py
      - name: Record the remaining candidate gate
        run: echo 'Automatic checks are focused feedback only. Completed runtime changes require explicit ci.yml devfast=false, applicable SDK qualification, and release certification when publishing.' >> "$GITHUB_STEP_SUMMARY"

  devfast:
    if: github.event_name != 'workflow_dispatch' || (inputs.devfast && inputs.diagnostic == 'legacy')
    uses: ./.github/workflows/devfast.yml
    with:
      linux_runner: ${{ inputs.linux_runner || 'ubuntu-latest-h' }}
      windows_runner: ${{ inputs.windows_runner || 'windows-latest-h' }}

  certification-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.devfast && (inputs.diagnostic == 'certification' || inputs.diagnostic == 'windows-certification' || inputs.diagnostic == 'arm-rev-adapter' || inputs.diagnostic == 'sdk-live')
    uses: ./.github/workflows/certification-diagnostic.yml
    with:
      scope: ${{ inputs.diagnostic == 'arm-rev-adapter' && 'arm-rev-adapter' || inputs.diagnostic == 'sdk-live' && 'sdk-live' || inputs.diagnostic == 'windows-certification' && 'windows' || 'all' }}
      source_ref: ${{ inputs.diagnostic_release }}
      linux_runner: ${{ inputs.linux_runner || 'ubuntu-latest-h' }}
      windows_runner: ${{ inputs.windows_runner || 'windows-latest-h' }}
      arm_runner: ${{ inputs.arm_runner || 'ubuntu-24.04-arm-h' }}

  windows-rev-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.devfast && inputs.diagnostic == 'windows-rev'
    uses: ./.github/workflows/windows-rev-diagnostic.yml
    with:
      windows_runner: ${{ inputs.windows_runner || 'windows-latest-h' }}

  runner-capacity:
    if: github.event_name == 'workflow_dispatch' && inputs.devfast && inputs.diagnostic == 'runner-capacity'
    uses: ./.github/workflows/runner-capacity.yml
    with:
      linux_runner: ${{ inputs.linux_runner || 'ubuntu-latest-h' }}
      windows_runner: ${{ inputs.windows_runner || 'windows-latest-h' }}

  arm-runner-capacity:
    if: github.event_name == 'workflow_dispatch' && inputs.devfast && inputs.diagnostic == 'arm-runner-capacity'
    uses: ./.github/workflows/arm-runner-capacity.yml
    with:
      arm_runner: ${{ inputs.arm_runner || 'ubuntu-24.04-arm-h' }}

  graphics-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.devfast && inputs.diagnostic == 'graphics'
    uses: ./.github/workflows/graphics-diagnostic.yml
    with:
      arm_runner: ${{ inputs.arm_runner || 'ubuntu-24.04-arm-h' }}
      windows_runner: ${{ inputs.windows_runner || 'windows-latest-h' }}
      release_tag: ${{ inputs.diagnostic_release }}

  arm-rev-package-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.devfast && (inputs.diagnostic == 'arm-rev-package' || inputs.diagnostic == 'arm-rev-smoke')
    uses: ./.github/workflows/arm-rev-package-diagnostic.yml
    with:
      arm_runner: ${{ inputs.arm_runner || 'ubuntu-24.04-arm-h' }}
      smoke: ${{ inputs.diagnostic == 'arm-rev-smoke' }}

  gui-contract:
    if: github.event_name == 'workflow_dispatch' && (!inputs.devfast || inputs.diagnostic == 'gui-contract')
    name: GUI contract (${{ matrix.backend }})
    runs-on: ${{ inputs.linux_runner || 'ubuntu-latest-h' }}
    container: debian:trixie-slim
    timeout-minutes: ${{ inputs.linux_runner == 'ubuntu-24.04' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        backend: [fltk, rev]
    env:
      DATAPUMP_CI_SMOKE_WARNINGS_DIR: ${{ github.workspace }}/build/ci-smoke-results
      DATAPUMP_CI_SMOKE_RUNNER: ${{ github.workspace }}/tools/run-gui-smoke.py
      DATAPUMP_SMOKE_TARGET: linux-x86_64-${{ matrix.backend }}
      DATAPUMP_SMOKE_SCOPE: source/native
      DATAPUMP_SMOKE_SOURCE_SHA: ${{ github.sha }}
      DATAPUMP_SMOKE_INVENTORY_SHA256: ''
      DEBIAN_FRONTEND: noninteractive
      LIBGL_ALWAYS_SOFTWARE: "1"
      # Keep software rendering from saturating the UI polling thread's CPUs.
      LP_NUM_THREADS: ${{ inputs.linux_runner == 'ubuntu-24.04' && '1' || '2' }}
    steps:
      - name: Load current package-fetch helper before installing Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .ci-bootstrap
          sparse-checkout: tools/ci-apt.sh
          sparse-checkout-cone-mode: false
      - name: Prepare shared native conformance environment
        run: |
          cp .ci-bootstrap/tools/ci-apt.sh "$RUNNER_TEMP/ci-apt.sh"
          sh "$RUNNER_TEMP/ci-apt.sh" install ca-certificates git cmake ninja-build make g++ clang-19 clang-tools-19 libssl-dev libasound2-dev libx11-dev libxft-dev libxext-dev libxrender-dev libxcursor-dev libxfixes-dev libxinerama-dev libxrandr-dev libgl-dev libglew-dev libfreetype-dev libxtst6 libgl1-mesa-dri xvfb xauth fonts-dejavu-core python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure the same contract suite for the selected adapter
        # The focused GUI diagnostic runs this same complete scope. Standard
        # runners get bounded cumulative computation headroom, with a warning
        # after a successful >600s smoke; all internal assertions stay strict.
        run: >-
          cmake -S . -B build-gui -G Ninja
          -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19
          -DCMAKE_BUILD_TYPE=Release -DDATAPUMP_PORTABLE=OFF
          -DDATAPUMP_GUI_BACKEND=${{ matrix.backend }} -DDATAPUMP_TEST_NATIVE_GUI=ON
          -DGUI_SMOKE_TIMEOUT=${{ inputs.linux_runner == 'ubuntu-24.04' && '1200' || '600' }} -DDART_TESTING_TIMEOUT=3600
      - run: cmake --build build-gui --target datapump-tests-gui --parallel "$(nproc)"
      - name: Check offline build and dependency tooling
        if: matrix.backend == 'fltk'
        run: |
          cmake --build build-gui --target datapump-tests-build --parallel "$(nproc)"
          ctest --test-dir build-gui --output-on-failure -L '^build$'
      - name: Test shared behavior, native contract and simulated workflow
        run: xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' python3 tools/run-native-tests.py --allow-budget-exhaustion --build-dir build-gui --label gui --report-dir "$DATAPUMP_CI_SMOKE_WARNINGS_DIR"
      - name: Record focused GUI scope
        if: inputs.devfast
        run: echo 'This diagnostic runs both GUI contracts and records any incomplete smoke coverage. It does not run general native regression, calibration, SDK or package qualification; skipped scopes are not passes.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain GUI timing report and failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CI-GUI-${{ matrix.backend }}-attempt-${{ github.run_attempt }}
          path: |
            build-gui/ci-test-report.*
            build-gui/Testing/Temporary/
            ${{ github.workspace }}/build/ci-smoke-results/
          if-no-files-found: warn
          retention-days: 7

  # Package producers do not wait for unit tests or calibration. Their exact
  # archives still pass every required Release desktop/integrity check, and all
  # independent test shards remain required for an overall successful workflow.
  linux-package:
    if: github.event_name == 'workflow_dispatch' && !inputs.devfast
    name: Linux portable package (glibc 2.35)
    uses: ./.github/workflows/native-linux.yml
    with:
      linux_runner: ${{ inputs.linux_runner || 'ubuntu-latest-h' }}
      build_type: Release
      scope: package

  windows-package:
    if: github.event_name == 'workflow_dispatch' && !inputs.devfast
    name: Windows portable package (static CRT)
    uses: ./.github/workflows/native-windows.yml
    with:
      windows_runner: ${{ inputs.windows_runner || 'windows-latest-h' }}
      scope: package

  linux-tests:
    if: github.event_name == 'workflow_dispatch' && !inputs.devfast
    name: Linux ${{ matrix.build_type }} / ${{ matrix.shard.scope }} / ${{ matrix.shard.section }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        shard:
          - {scope: core, section: all}
          - {scope: fast, section: all}
          - {scope: live, section: all}
          - {scope: calibration, section: matrix}
          - {scope: calibration, section: shaped}
          - {scope: calibration, section: "null"}
          - {scope: calibration, section: default-window}
        exclude:
          - build_type: Debug
            shard: {scope: calibration, section: shaped}
    uses: ./.github/workflows/native-linux.yml
    with:
      linux_runner: ${{ inputs.linux_runner || 'ubuntu-latest-h' }}
      build_type: ${{ matrix.build_type }}
      scope: ${{ matrix.shard.scope }}
      calibration_section: ${{ matrix.shard.section }}
      sanitizer_realtime: ${{ inputs.sanitizer_realtime }}

  linux-shaped:
    if: github.event_name == 'workflow_dispatch' && !inputs.devfast
    name: Debug shaped captures / part ${{ matrix.part }}
    strategy:
      fail-fast: false
      matrix:
        part: ['0', '1']
    uses: ./.github/workflows/native-linux.yml
    with:
      linux_runner: ${{ inputs.linux_runner || 'ubuntu-latest-h' }}
      build_type: Debug
      scope: calibration
      calibration_section: shaped
      calibration_shard: ${{ matrix.part }}

  linux-shaped-aggregate:
    if: github.event_name == 'workflow_dispatch' && !inputs.devfast
    name: Require complete shaped calibration and original aggregate assertions
    needs: linux-shaped
    uses: ./.github/workflows/native-linux.yml
    with:
      linux_runner: ${{ inputs.linux_runner || 'ubuntu-latest-h' }}
      build_type: Debug
      scope: calibration-aggregate
      calibration_section: shaped

  sanitizer-gui:
    if: github.event_name == 'workflow_dispatch' && ((inputs.devfast && inputs.diagnostic == 'sanitizer-gui') || (!inputs.devfast && inputs.sanitizer_smoke))
    name: Separate instrumented desktop smoke
    uses: ./.github/workflows/native-linux.yml
    with:
      linux_runner: ${{ inputs.linux_runner || 'ubuntu-latest-h' }}
      build_type: Debug
      scope: sanitizer-gui

  linux-compatibility:
    if: github.event_name == 'workflow_dispatch' && !inputs.devfast
    name: Copied Linux binaries on Ubuntu ${{ matrix.ubuntu }}
    needs: linux-package
    runs-on: ${{ inputs.linux_runner || 'ubuntu-latest-h' }}
    container: ubuntu:${{ matrix.ubuntu }}
    # Both archive formats run the full workflow; measured checks exceed ten
    # minutes even though devfast never runs these compatibility jobs.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
    env:
      DATAPUMP_CI_SMOKE_WARNINGS_DIR: ${{ github.workspace }}/build/ci-smoke-results
      DATAPUMP_CI_SMOKE_RUNNER: ${{ github.workspace }}/tools/run-gui-smoke.py
      DATAPUMP_SMOKE_TARGET: linux-x86_64-fltk
      DATAPUMP_SMOKE_SCOPE: published/ubuntu-${{ matrix.ubuntu }}
      DATAPUMP_SMOKE_SOURCE_SHA: ${{ github.sha }}
      DATAPUMP_SMOKE_INVENTORY_SHA256: ''
      DEBIAN_FRONTEND: noninteractive
    steps:
      # No application development libraries or compiler: only the display and
      # inspection tools used to check the downloaded, already built bundle.
      - name: Load current package-fetch helper before installing Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .ci-bootstrap
          sparse-checkout: tools/ci-apt.sh
          sparse-checkout-cone-mode: false
      - name: Prepare compatibility checks
        run: |
          cp .ci-bootstrap/tools/ci-apt.sh "$RUNNER_TEMP/ci-apt.sh"
          sh "$RUNNER_TEMP/ci-apt.sh" install ca-certificates curl git python3 cmake binutils xvfb xauth fontconfig-config fonts-dejavu-core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned dependency scanner
        run: |
          sh tools/install-release-cmake.sh "$GITHUB_WORKSPACE/build/ci-cmake"
          echo "$GITHUB_WORKSPACE/build/ci-cmake/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DataPump-Linux-x86_64-glibc-2.35
          path: downloaded
      - name: Run copied archives with isolated runtime paths
        run: xvfb-run -a -s '-screen 0 2400x1800x24 -dpi 96' cmake -DARCHIVE_DIR="$PWD/downloaded" -DGUI_SMOKE=ON -DGUI_SMOKE_TIMEOUT=600 -DMAX_GLIBC=2.35 -P tools/verify-native-archives.cmake
      - name: Retain smoke workload coverage and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CI-copied-Linux-${{ matrix.ubuntu }}-smoke-attempt-${{ github.run_attempt }}
          path: ${{ github.workspace }}/build/ci-smoke-results/
          if-no-files-found: warn
          retention-days: 7

  windows-tests:
    if: github.event_name == 'workflow_dispatch' && !inputs.devfast
    name: Windows Release / ${{ matrix.shard.scope }} / ${{ matrix.shard.section }}
    strategy:
      fail-fast: false
      matrix:
        shard:
          - {scope: core, section: all}
          - {scope: fast, section: all}
          - {scope: live, section: all}
          - {scope: calibration, section: matrix}
          - {scope: calibration, section: shaped}
          - {scope: calibration, section: "null"}
          - {scope: calibration, section: default-window}
    uses: ./.github/workflows/native-windows.yml
    with:
      windows_runner: ${{ inputs.windows_runner || 'windows-latest-h' }}
      scope: ${{ matrix.shard.scope }}
      calibration_section: ${{ matrix.shard.section }}
