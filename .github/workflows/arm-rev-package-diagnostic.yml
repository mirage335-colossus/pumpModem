name: Focused ARM64 Rev portable runtime check

on:
  workflow_call:
    inputs:
      smoke:
        description: 'Run complete copied GUI smoke on Ubuntu 22.04 and Trixie instead of the short Ubuntu startup probe'
        type: boolean
        default: false
      arm_runner:
        description: 'Linux ARM64 runner label'
        type: string
        default: ubuntu-24.04-arm

permissions:
  contents: read

jobs:
  package:
    name: ARM64 Rev package / ${{ inputs.smoke && 'full Ubuntu 22.04 and Trixie GUI smoke' || 'Ubuntu startup' }} (not certification)
    runs-on: ${{ inputs.arm_runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: ${{ inputs.smoke && 30 || 15 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build only the affected package in its Ubuntu 22.04 baseline
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace -e DEBIAN_FRONTEND=noninteractive ubuntu:22.04 sh -ec '
            sh /workspace/tools/ci-apt.sh install ca-certificates curl git python3 file binutils make cmake ninja-build g++-11 libssl-dev libasound2-dev libx11-dev libxft-dev libxext-dev libxrender-dev libxcursor-dev libxfixes-dev libxinerama-dev libgl1 libopengl0
            git config --global --add safe.directory /workspace
            sh tools/install-release-cmake.sh /workspace/build/ci-cmake
            python3 tools/install-release-rev.py /workspace/build/ci-rev-tools
            export PATH=/workspace/build/ci-cmake/bin:/workspace/build/ci-rev-tools/bin:$PATH
            CC=clang-19 CXX=clang++-19 DATAPUMP_MAX_GLIBC=2.35 ./build.sh package --backend rev --build-dir build/arm-rev-package --jobs "$(nproc)"
          '
      - name: Verify the unchanged archive and visible GUI with the newer host driver
        if: ${{ !inputs.smoke }}
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace -e DEBIAN_FRONTEND=noninteractive -e LIBGL_ALWAYS_SOFTWARE=1 -e LP_NUM_THREADS=2 ubuntu:24.04 sh -ec '
            sh /workspace/tools/ci-apt.sh install python3 cmake binutils xvfb xauth x11-utils mesa-utils fonts-dejavu-core fontconfig-config libgl1 libopengl0 libgl1-mesa-dri
            mkdir -p "build/arm-rev-copied destination"
            set -- build/arm-rev-package/releases/*.tar.gz
            test "$#" -eq 1
            tar -xzf "$1" -C "build/arm-rev-copied destination"
            set -- "build/arm-rev-copied destination"/DataPump-*
            test "$#" -eq 1
            package_root=$PWD/$1
            cmake -DPACKAGE_ROOT="$package_root" -DVERIFY_ONLY=ON -DREQUIRE_MANUALS=ON -P tools/verify-native-package.cmake
            xvfb-run -a -s "-screen 0 2400x1800x24 -dpi 96" python3 tools/check-rev-graphics-startup.py "$package_root" "$PWD/build/arm-rev-graphics-startup.log"
            cmake -DPACKAGE_ROOT="$package_root" -DVERIFY_ONLY=ON -DREQUIRE_MANUALS=ON -P tools/verify-native-package.cmake
          '
      - name: Verify the same package and run its complete GUI smoke on Ubuntu 22.04 and Trixie
        if: inputs.smoke
        shell: bash
        env:
          SMOKE_RENDER_THREADS: ${{ inputs.arm_runner == 'ubuntu-24.04-arm' && '1' || '2' }}
        run: |
          # Keep source and produced archives read-only in the compatibility
          # container. Retained evidence has a separate writable mount.
          for smoke_image in ubuntu:22.04 debian:trixie-slim; do
            echo "Running the unchanged ARM64 Rev package on $smoke_image"
            smoke_reports="$RUNNER_TEMP/arm-rev-package-smoke/${smoke_image//:/-}"
            mkdir -p "$smoke_reports"
            docker run --rm -v "$PWD:/workspace:ro" -v "$smoke_reports:/smoke-results" -w /workspace \
              -e DEBIAN_FRONTEND=noninteractive -e LIBGL_ALWAYS_SOFTWARE=1 -e "LP_NUM_THREADS=$SMOKE_RENDER_THREADS" \
              -e DATAPUMP_CI_SMOKE_WARNINGS_DIR=/smoke-results \
              -e DATAPUMP_CI_SMOKE_RUNNER=/workspace/tools/run-gui-smoke.py \
              -e DATAPUMP_SMOKE_TARGET=linux-aarch64-rev \
              -e "DATAPUMP_SMOKE_SCOPE=diagnostic/published/$smoke_image" \
              -e "DATAPUMP_SMOKE_SOURCE_SHA=$GITHUB_SHA" -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
              "$smoke_image" sh -ec '
              sh /workspace/tools/ci-apt.sh install ca-certificates curl git gh python3 cmake binutils xvfb xauth fontconfig-config fonts-dejavu-core libxtst6 libgl1 libopengl0 libgl1-mesa-dri
              export PATH=/workspace/build/ci-cmake/bin:$PATH
              (cd build/arm-rev-package/releases && sha256sum --check SHA256SUMS.txt)
              set -- $(sha256sum build/arm-rev-package/releases/SHA256SUMS.txt)
              export DATAPUMP_SMOKE_INVENTORY_SHA256=$1
              set -- build/arm-rev-package/releases/*.tar.gz
              test "$#" -eq 1
              sha256sum "$1"
              scratch=$(mktemp -d /tmp/datapump-arm-rev-smoke.XXXXXX)
              destination="$scratch/copied destination"
              mkdir -p "$destination"
              tar -xzf "$1" -C "$destination"
              set -- "$destination"/DataPump-*
              test "$#" -eq 1
              package_root=$1
              cmake -DPACKAGE_ROOT="$package_root" -DVERIFY_ONLY=ON -DREQUIRE_MANUALS=ON -P tools/verify-native-package.cmake
              cmake -DPACKAGE_ROOT="$package_root" -DMAX_GLIBC=2.35 -P tools/verify-linux-abi.cmake
              xvfb-run -a -s "-screen 0 2400x1800x24 -dpi 96" cmake -DPACKAGE_ROOT="$package_root" -DGUI_SMOKE=ON -DGUI_SMOKE_TIMEOUT=600 -DREQUIRE_MANUALS=ON -P tools/verify-native-package.cmake
              cmake -DPACKAGE_ROOT="$package_root" -DVERIFY_ONLY=ON -DREQUIRE_MANUALS=ON -P tools/verify-native-package.cmake
              (cd build/arm-rev-package/releases && sha256sum --check SHA256SUMS.txt)
            ' 2>&1 | tee "$smoke_reports/verification.log"
          done
      - name: Retain full-smoke diagnostics and incomplete coverage
        if: always() && inputs.smoke
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ARM64-Rev-package-smoke-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arm-rev-package-smoke/
          if-no-files-found: warn
          retention-days: 7
      - name: Record focused scope
        env:
          FULL_GUI_SMOKE: ${{ inputs.smoke }}
        run: |
          if [ "$FULL_GUI_SMOKE" = true ]; then
            python3 - "$RUNNER_TEMP/arm-rev-package-smoke" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, os, sys
          from pathlib import Path
          reports = [(path.parent.name, json.loads(path.read_text()))
                     for path in sorted(Path(sys.argv[1]).rglob('*.json'))]
          if len(reports) != 2 or any(report.get('status') not in ('passed', 'incomplete') for _, report in reports):
              raise SystemExit('Both copied GUI outcomes must have retained valid reports')
          with open(sys.argv[2], 'a', encoding='utf-8') as summary:
              summary.write(f'ARM64 Rev diagnostic source `{os.environ["GITHUB_SHA"]}`: inventory, relocation and glibc 2.35 audits passed.\n\n')
              for image, report in reports:
                  summary.write(f'- {image}: GUI smoke **{report["status"]}**.\n')
              summary.write('\nAny incomplete result is untested remaining smoke coverage, not a smoke pass; exact logs and reports are retained. No calibration, general matrix, SDK rebuild or release certification; no release assets changed.\n')
          PY
          else
            echo 'ARM64 Rev packaging and visible startup with the Ubuntu 24.04 host driver passed. No full smoke, calibration or certification claim; no release assets changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
